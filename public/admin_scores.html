<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>スコア管理 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 承認待ちのカード：左に大きいリザルト画像、右に点数と確認の札、下に却下理由と操作 */
.pq { margin-bottom:14px; border-radius:14px; border:1px solid var(--border-light); background:var(--bg-card); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); overflow:hidden; }
.pq.has-warn { border-color:rgba(255,107,128,0.55); }
.pq-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.06); }
.pq-user { font-weight:bold; font-size:0.98rem; color:var(--text-primary); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.pq-event { font-size:0.8rem; color:var(--text-muted); display:inline-flex; align-items:center; gap:4px; }
.pq-time { margin-left:auto; font-size:0.75rem; color:var(--text-muted); white-space:nowrap; }
.pq-body { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:16px; padding:14px 16px; }
.pq-img { display:block; position:relative; border-radius:10px; overflow:hidden; background:var(--bg-primary); border:1px solid var(--border); cursor:zoom-in; aspect-ratio:16/9; }
.pq-img img { width:100%; height:100%; object-fit:contain; display:block; }
.pq-info { display:flex; flex-direction:column; gap:8px; min-width:0; }
.pq-score-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.pending-score { font-size:1.6rem; font-weight:900; font-variant-numeric:tabular-nums; color:#fff; letter-spacing:0.01em; }
.pq-prev { font-size:0.8rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.pq-prev b { font-weight:bold; }
.pq-prev .up { color:#5dde8e; } .pq-prev .down { color:#ff6b6b; }
.pq-flags { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.pq-flag { display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:bold; padding:4px 10px; border-radius:8px; line-height:1.4; }
.pq-flag svg { flex-shrink:0; }
.pq-flags .ai-attr { margin-bottom:0; }
.pq-flag.ng { background:rgba(231,76,60,0.16); color:#ff6b5e; }
.pq-flag.dup { background:rgba(243,156,18,0.18); color:#f5b041; border:none; cursor:pointer; font:inherit; font-size:0.78rem; font-weight:bold; }
.pq-flag.dup:hover { background:rgba(243,156,18,0.28); }
.pq-yt { display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:#ff5a5a; }
.pq-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; padding:0; border-radius:50%; border:1px solid var(--border-light); background:rgba(255,255,255,0.04); color:var(--text-secondary); cursor:pointer; flex-shrink:0; }
.pq-icon-btn:hover { color:#fff; border-color:rgba(255,107,128,0.6); }
.pq-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.15); }
.pq-foot .form-input { flex:1 1 200px; min-width:0; padding:8px 12px; font-size:0.85rem; }
.pq-btn-ok { background:linear-gradient(135deg,#2ecc71,#1e9e57); color:#fff; border:none; box-shadow:0 0 12px -2px rgba(46,204,113,0.5); min-width:96px; }
.pq-btn-ok:hover { color:#fff; filter:brightness(1.08); }
.pq-btn-ok2 { background:transparent; color:#5dde8e; border:1px solid rgba(46,204,113,0.6); }
.pq-btn-ok2:hover { background:rgba(46,204,113,0.12); color:#5dde8e; }
.pq-btn-ng { background:transparent; color:#ff6b6b; border:1px solid rgba(231,76,60,0.65); }
.pq-btn-ng:hover { background:rgba(231,76,60,0.14); color:#ff6b6b; }
@media (max-width:720px) {
  .pq-body { grid-template-columns:1fr; gap:12px; }
  .pq-foot .form-input { flex-basis:100%; }
  .pq-foot .btn { flex:1; white-space:nowrap; padding-left:8px; padding-right:8px; }
  .pq-time { margin-left:0; width:100%; }
}
@media(max-width:600px){ .hide-mobile{display:none;} }
.user-name-cell{ max-width:6em; white-space:normal; word-break:break-all; }
.all-scores-table th:first-child, .all-scores-table td:first-child { width:auto; }
.all-scores-table th:nth-child(2), .all-scores-table td:nth-child(2) { width:auto; }
.review-group { margin-bottom:28px; }
.review-group-title { display:flex; align-items:center; gap:8px; font-size:0.95rem; font-weight:bold; margin-bottom:12px; }
.review-group-count { font-size:0.78rem; color:#fff; font-weight:normal; }
.review-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.review-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px; }
.review-card img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:6px; cursor:pointer; display:block; margin-bottom:8px; background:var(--bg-primary); }
.review-card .rname { font-size:0.8rem; font-weight:bold; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.review-card .rscore { font-size:0.82rem; color:var(--text-secondary); margin-bottom:6px; }
/* 属性の自動判定 */
.ai-attr { display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; font-size:0.78rem; font-weight:bold; padding:4px 10px; border-radius:8px; margin-bottom:6px; background:rgba(255,255,255,0.06); color:var(--text-secondary); }
.ai-attr.ok { background:rgba(46,204,113,0.14); color:#2ecc71; }
.ai-attr.ng { background:rgba(231,76,60,0.16); color:#ff6b5e; }
.ai-attr.warn { background:rgba(243,156,18,0.16); color:#f5b041; }
.ai-attr small { font-weight:normal; opacity:0.85; }
.review-card.is-mismatch { border-color:#e74c3c; box-shadow:0 0 0 1px #e74c3c inset; }
.review-card.is-excluded img { opacity:0.45; }
.review-ex { margin-top:6px; font-size:0.7rem; background:none; border:1px dashed var(--border-light); color:var(--text-muted); border-radius:4px; padding:1px 6px; cursor:pointer; }
.review-tools { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; font-size:0.85rem; }
.review-attr-fix { display:flex; gap:4px; align-items:center; }
.review-attr-fix select { flex:1; font-size:0.75rem; padding:2px 4px; }
</style>
</head>
<body>
<nav id="nav"></nav>

<!-- 重複リザルト比較モーダル -->
<div id="dup-modal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)closeDupModal()">
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-weight:bold;font-size:1rem;color:var(--warning)">リザルト比較</span>
      <button onclick="closeDupModal()" style="background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;line-height:1;padding:0 4px">&times;</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        <div id="dup-label-new" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px;text-align:center"></div>
        <a id="dup-link-new" href="#" target="_blank">
          <img id="dup-img-new" src="" alt="投稿リザルト" style="width:100%;border-radius:6px;border:2px solid var(--accent);cursor:pointer">
        </a>
      </div>
      <div>
        <div id="dup-label-existing" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px;text-align:center"></div>
        <a id="dup-link-existing" href="#" target="_blank">
          <img id="dup-img-existing" src="" alt="既存リザルト" style="width:100%;border-radius:6px;border:2px solid var(--border-light);cursor:pointer">
        </a>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="admin-head">
    <h1 class="page-title">スコア管理</h1>
    <div class="admin-nav" data-current="scores"></div>
  </div>
  <div id="alert"></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending')">承認待ち <span id="pending-count"></span></button>
    <button class="tab-btn" onclick="switchTab('all-scores')">全スコア一覧</button>
    <button class="tab-btn" onclick="switchTab('review')">属性チェック</button>
  </div>

  <!-- 承認待ち -->
  <div class="tab-content active" id="tab-pending">
    <div id="pending-list">
      <div class="loading"><div class="spinner"></div>読み込み中...</div>
    </div>
  </div>

  <!-- 全スコア一覧 -->
  <div class="tab-content" id="tab-all-scores">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <select class="form-select" id="filter-event" style="max-width:260px">
        <option value="">全イベント</option>
      </select>
      <select class="form-select" id="filter-status" style="max-width:160px">
        <option value="">全ステータス</option>
        <option value="pending">承認待ち</option>
        <option value="approved">承認済み</option>
        <option value="rejected">却下</option>
      </select>
      <button class="btn btn-secondary" onclick="loadAllScores()">絞り込み</button>
    </div>
    <div class="card">
      <div id="all-scores-list">
        <div class="loading"><div class="spinner"></div>読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- 属性チェック -->
  <div class="tab-content" id="tab-review">
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <select class="form-select" id="review-event-select" style="max-width:260px" onchange="loadReviewScores()">
        <option value="">イベントを選択してください</option>
      </select>
      <select class="form-select" id="review-status" style="max-width:160px" onchange="loadReviewScores()">
        <option value="">全ステータス</option>
        <option value="pending">承認待ち</option>
        <option value="approved">承認済み</option>
        <option value="rejected">却下</option>
      </select>
    </div>
    <div class="review-tools">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="review-ai-only" onchange="loadReviewScores()"> AIと食い違うものだけ表示</label>
      <span id="review-ai-summary" style="color:var(--text-muted);font-size:0.8rem"></span>
    </div>
    <div id="review-list"></div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav();
if (!requireAdmin()) throw new Error('redirect');

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['pending','all-scores','review'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'pending') loadPending();
  if (name === 'all-scores') { loadAllScores(); populateEventFilter('filter-event'); }
  if (name === 'review') { populateEventFilter('review-event-select'); }
}

// ===== 承認待ち =====
function openDupModal(newImg, newUser, existingImg, existingUser) {
  document.getElementById('dup-img-new').src = newImg;
  document.getElementById('dup-link-new').href = newImg;
  document.getElementById('dup-label-new').textContent = `投稿: ${newUser}`;
  document.getElementById('dup-img-existing').src = existingImg;
  document.getElementById('dup-link-existing').href = existingImg;
  document.getElementById('dup-label-existing').textContent = `既存: ${existingUser}`;
  document.getElementById('dup-modal').style.display = 'flex';
}

function closeDupModal() {
  document.getElementById('dup-modal').style.display = 'none';
}

// ===== 属性の自動判定の表示 =====
const AI_TIER_LABEL = { sure: '確定', single: '参考', dual_other: '参考（MVPは2属性）', dual_mvp_only: 'MVPが2属性', dual_out: '手がかりが食い違い', conflict: '手がかりが食い違い', none: '判定なし' };
const AI_SIG_LABEL = { adm: 'ADM', mvp: 'MVP', member: '編成' };
// ac: 判定結果、attr: 比べる属性（投稿・承認済みの属性）
function aiAttrHTML(ac, attr) {
  if (!ac) return '';
  if (ac.error) return `<div class="ai-attr warn">AI属性: 判定エラー</div>`;
  const sigs = Object.entries(ac.signals || {}).filter(([, v]) => v && v.pred).map(([k, v]) => `${AI_SIG_LABEL[k]}:${v.pred}`).join(' ');
  const mode = ac.mode === 'record' ? ' <small>（記録のみ）</small>' : '';
  if (!ac.pred) return `<div class="ai-attr warn">AI属性: ${AI_TIER_LABEL[ac.tier] || ac.tier}${sigs ? ` <small>${sigs}</small>` : ''}${mode}</div>`;
  const cls = ac.pred === attr ? 'ok' : 'ng';
  return `<div class="ai-attr ${cls}">AI属性: ${ac.pred}（${AI_TIER_LABEL[ac.tier] || ac.tier}）${cls === 'ng' ? ` ≠ ${attr}` : ''} <small>${sigs}</small>${mode}</div>`;
}
let _pendingById = {};
const PQ_PEN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const PQ_WARN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r="0.6" fill="currentColor"/></svg>';
// 投稿の日時（例：10/25 21:34）
const formatDateTime = d => { const x = new Date(d); return isNaN(x) ? '' : `${x.getMonth() + 1}/${x.getDate()} ${String(x.getHours()).padStart(2, '0')}:${String(x.getMinutes()).padStart(2, '0')}`; };

async function loadPending() {
  const el = document.getElementById('pending-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  try {
    const [items] = await Promise.all([apiFetch('/admin/pending'), loadScoreEvents()]);
    document.getElementById('pending-count').textContent = items.length > 0 ? `(${items.length})` : '';

    if (items.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + uiIcon('check') + '</div><p>承認待ちのスコアはありません</p></div>';
      return;
    }

    _pendingById = Object.fromEntries(items.map(i => [i.id, i]));
    el.innerHTML = items.map(item => {
      const diff = item.approved_score ? item.pending_score - item.approved_score : null;
      const warn = item.ai_note || item.dup_image_url || (item.attr_check && item.attr_check.pred && item.attr_check.pred !== item.attribute);
      return `
      <div class="pq${warn ? ' has-warn' : ''}" id="pending-${item.id}">
        <div class="pq-head">
          <span id="attr-display-${item.id}" style="display:inline-flex;align-items:center;gap:4px">
            ${attrBadge(item.attribute)}
            <button class="pq-icon-btn" onclick="startEditAttr(${item.id})" title="属性を修正" aria-label="属性を修正">${PQ_PEN}</button>
          </span>
          <span id="attr-edit-${item.id}" style="display:none;align-items:center;gap:4px">
            <select class="form-select" id="attr-input-${item.id}" style="width:auto;padding:3px 8px;font-size:0.85rem">
              ${ATTRIBUTES.map(a => `<option value="${a}" ${a === item.attribute ? 'selected' : ''}>${t('attr.' + a) || a}</option>`).join('')}
            </select>
            <button class="btn btn-secondary btn-sm" onclick="cancelEditAttr(${item.id})">戻す</button>
          </span>
          <a class="pq-user" href="/user.html?id=${item.user_id}" target="_blank">${escHtml(item.username)}</a>
          <span class="pq-event" id="event-display-${item.id}">
            第${item.event_number}回 ${escHtml(item.event_name)}
            <button class="pq-icon-btn" onclick="startEditEvent(${item.id})" title="イベントを修正" aria-label="イベントを修正">${PQ_PEN}</button>
          </span>
          <span id="event-edit-${item.id}" style="display:none;align-items:center;gap:4px">
            <select class="form-select" id="event-input-${item.id}" style="width:auto;max-width:260px;padding:3px 8px;font-size:0.82rem">
              ${_scoreEvents.map(e => `<option value="${e.id}" ${e.id === item.event_id ? 'selected' : ''}>第${e.event_number}回 ${escHtml(e.name)}</option>`).join('')}
            </select>
            <button class="btn btn-secondary btn-sm" onclick="cancelEditEvent(${item.id})">戻す</button>
          </span>
          <span class="pq-time">${formatDateTime(item.updated_at)}</span>
        </div>
        <div class="pq-body">
          ${item.pending_image_url
            ? `<a class="pq-img" href="${escHtml(item.pending_image_url)}" target="_blank" rel="noopener" title="画像を大きく開く"><img src="${escHtml(item.pending_image_url)}" alt="リザルト" loading="lazy"></a>`
            : '<div class="pq-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.8rem;cursor:default">画像なし</div>'}
          <div class="pq-info">
            <div id="score-display-${item.id}" class="pq-score-row">
              <span class="pending-score">${formatScore(item.pending_score)}</span>
              <button class="pq-icon-btn" onclick="startEditScore(${item.id})" title="スコアを修正" aria-label="スコアを修正">${PQ_PEN}</button>
            </div>
            <div id="score-edit-${item.id}" style="display:none;align-items:center;gap:6px">
              <input type="number" class="form-input" id="score-input-${item.id}" style="width:170px" value="${item.pending_score}">
              <button class="btn btn-secondary btn-sm" onclick="cancelEditScore(${item.id})">戻す</button>
            </div>
            ${item.approved_score ? `<div class="pq-prev">今の承認済み ${formatScore(item.approved_score)}　<b class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : '−'}${formatScore(Math.abs(diff))}</b></div>` : '<div class="pq-prev">初めての投稿</div>'}
            <div class="pq-flags">
              ${item.ai_note ? `<span class="pq-flag ng">${PQ_WARN}${escHtml(item.ai_note)}</span>` : ''}
              ${item.dup_image_url ? `<button class="pq-flag dup" onclick="openDupModal('${escHtml(item.pending_image_url||'')}','${escHtml(item.username)}','${escHtml(item.dup_image_url)}','${escHtml(item.dup_username||'')}')">${PQ_WARN}既存スコアと一致（比べる）</button>` : ''}
              ${item.attr_check ? aiAttrHTML(item.attr_check, item.attribute) : ''}
            </div>
            ${item.pending_youtube_url ? `<a class="pq-yt" href="${escHtml(item.pending_youtube_url)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1C4.5 20.5 12 20.5 12 20.5s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>YouTube動画を見る</a>` : ''}
          </div>
        </div>
        <div class="pq-foot">
          <input class="form-input" type="text" placeholder="却下理由（任意）" id="note-${item.id}">
          <button class="btn btn-sm pq-btn-ng" onclick="rejectScore(${item.id})">却下</button>
          ${item.pending_youtube_url ? `<button class="btn btn-sm pq-btn-ok2" onclick="approveScore(${item.id}, true)">動画なしで承認</button>` : ''}
          <button class="btn btn-sm pq-btn-ok" onclick="approveScore(${item.id})">承認</button>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

function startEditScore(id) {
  document.getElementById(`score-display-${id}`).style.display = 'none';
  const editEl = document.getElementById(`score-edit-${id}`);
  editEl.style.display = 'flex';
  const input = document.getElementById(`score-input-${id}`);
  input.focus();
  input.select();
}

function cancelEditScore(id) {
  document.getElementById(`score-edit-${id}`).style.display = 'none';
  document.getElementById(`score-display-${id}`).style.display = 'flex';
}

// イベントの付け替え用の一覧（新しい回が上）
let _scoreEvents = [];
async function loadScoreEvents() {
  if (_scoreEvents.length) return;
  try { _scoreEvents = await apiFetch('/admin/events'); } catch { _scoreEvents = []; }
}
function startEditEvent(id) {
  document.getElementById(`event-display-${id}`).style.display = 'none';
  document.getElementById(`event-edit-${id}`).style.display = 'inline-flex';
}
function cancelEditEvent(id) {
  document.getElementById(`event-edit-${id}`).style.display = 'none';
  document.getElementById(`event-display-${id}`).style.display = 'inline-flex';
}

function startEditAttr(id) {
  document.getElementById(`attr-display-${id}`).style.display = 'none';
  document.getElementById(`attr-edit-${id}`).style.display = 'inline-flex';
}

function cancelEditAttr(id) {
  document.getElementById(`attr-edit-${id}`).style.display = 'none';
  document.getElementById(`attr-display-${id}`).style.display = 'inline-flex';
}

async function approveScore(id, clearYoutube = false) {
  const body = { clear_youtube: clearYoutube };
  const editEl = document.getElementById(`score-edit-${id}`);
  if (editEl && editEl.style.display !== 'none') {
    const val = parseInt(document.getElementById(`score-input-${id}`).value, 10);
    if (!Number.isFinite(val) || val < 0) return showToast('スコアが不正です', 'error');
    body.score = val;
  }
  const attrEditEl = document.getElementById(`attr-edit-${id}`);
  if (attrEditEl && attrEditEl.style.display !== 'none') {
    body.attribute = document.getElementById(`attr-input-${id}`).value;
  }
  const eventEditEl = document.getElementById(`event-edit-${id}`);
  if (eventEditEl && eventEditEl.style.display !== 'none') {
    body.event_id = Number(document.getElementById(`event-input-${id}`).value);
  }
  // AIが「確定」で別の属性と判定しているのに、その属性以外で承認しようとしたら確認する
  const item = _pendingById[id];
  const ac = item && item.attr_check;
  const finalAttr = body.attribute || (item && item.attribute);
  if (ac && !ac.error && ac.tier === 'sure' && ac.pred && ac.pred !== finalAttr) {
    if (!await showConfirm(`AIは「${ac.pred}」と判定しています（確定）。\n「${finalAttr}」で承認しますか？`)) return;
  }
  try {
    const res = await apiFetch(`/admin/scores/${id}/approve`, {
      method: 'POST',
      body: JSON.stringify(body)
    });
    document.getElementById(`pending-${id}`)?.remove();
    showToast(res.message);
    const cnt = document.querySelectorAll('[id^="pending-"]').length;
    document.getElementById('pending-count').textContent = cnt > 0 ? `(${cnt})` : '';
  } catch (err) { showToast(err.message, 'error'); }
}

async function rejectScore(id) {
  const note = document.getElementById(`note-${id}`)?.value || '';
  try {
    await apiFetch(`/admin/scores/${id}/reject`, {
      method: 'POST',
      body: JSON.stringify({ note })
    });
    document.getElementById(`pending-${id}`)?.remove();
    showToast('却下しました');
    const cnt = document.querySelectorAll('[id^="pending-"]').length;
    document.getElementById('pending-count').textContent = cnt > 0 ? `(${cnt})` : '';
  } catch (err) { showToast(err.message, 'error'); }
}

// ===== 全スコア一覧 =====
async function populateEventFilter(selectId) {
  const sel = document.getElementById(selectId);
  if (sel.options.length > 1) return;
  try {
    const events = await apiFetch('/events');
    events.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = `第${e.event_number}回 ${e.name}`;
      sel.appendChild(opt);
    });
  } catch {}
}

async function loadAllScores() {
  const el = document.getElementById('all-scores-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const eventId = document.getElementById('filter-event').value;
  const status = document.getElementById('filter-status').value;
  let url = '/admin/scores';
  const params = [];
  if (eventId) params.push(`event_id=${eventId}`);
  if (status) params.push(`status=${status}`);
  if (params.length) url += '?' + params.join('&');

  try {
    const scores = await apiFetch(url);
    if (scores.length === 0) {
      el.innerHTML = '<div class="empty-state"><p>スコアがありません</p></div>';
      return;
    }
    el.innerHTML = `
      <table class="ranking-table all-scores-table">
        <thead><tr><th>ユーザー</th><th>回</th><th>属性</th><th>承認済み</th><th>承認待ち</th><th></th></tr></thead>
        <tbody>
          ${scores.map(s => `
            <tr>
              <td class="user-name-cell"><a href="/user.html?id=${s.user_id}" target="_blank">${escHtml(s.username)}</a></td>
              <td style="font-size:0.85rem;white-space:nowrap">${s.event_number}<span class="hide-mobile"> ${escHtml(s.event_name)}</span></td>
              <td>${attrBadge(s.attribute, true)}</td>
              <td>${formatScore(s.approved_score)}</td>
              <td>${s.status === 'pending' ? formatScore(s.pending_score) : '-'}</td>
              <td>${s.youtube_url ? `<a href="${escHtml(s.youtube_url)}" target="_blank" rel="noopener" title="YouTube動画"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ff4444"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1C4.5 20.5 12 20.5 12 20.5s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg></a>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

// 初期ロード
loadPending();
populateEventFilter('filter-event');

// ===== 属性チェック =====
async function loadReviewScores() {
  const el = document.getElementById('review-list');
  const eventId = document.getElementById('review-event-select').value;
  const status = document.getElementById('review-status').value;
  if (!eventId) { el.innerHTML = ''; return; }

  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  let url = `/admin/scores?event_id=${eventId}`;
  if (status) url += `&status=${status}`;

  try {
    const [allScores, ai] = await Promise.all([apiFetch(url), apiFetch(`/admin/attr-check/review?event_id=${eventId}`).catch(() => ({}))]);
    _reviewAi = ai;
    const isMismatch = s => ai[s.id] && ai[s.id].pred && ai[s.id].pred !== s.attribute;
    const mismatchCount = allScores.filter(isMismatch).length;
    document.getElementById('review-ai-summary').textContent = Object.keys(ai).length
      ? `AIで判定できた ${Object.values(ai).filter(a => a.pred).length} / ${allScores.length}件 ・ 食い違い ${mismatchCount}件`
      : 'AIの判定結果はまだありません';
    const aiOnly = document.getElementById('review-ai-only').checked;
    const scores = aiOnly ? allScores.filter(isMismatch) : allScores;
    if (scores.length === 0) {
      el.innerHTML = `<div class="empty-state"><p>${aiOnly ? 'AIと食い違うスコアはありません' : 'スコアがありません'}</p></div>`;
      return;
    }
    // 食い違いを上に並べる
    const groups = ATTRIBUTES.map(attr => ({ attr, items: scores.filter(s => s.attribute === attr).sort((a, b) => isMismatch(b) - isMismatch(a)) }))
      .filter(g => g.items.length > 0);

    el.innerHTML = groups.map(g => `
      <div class="review-group">
        <div class="review-group-title">${attrBadge(g.attr)}<span class="review-group-count">${g.items.length}件</span></div>
        <div class="review-grid">
          ${g.items.map(s => {
            const img = s.approved_image_url || s.pending_image_url;
            const score = s.status === 'pending' ? s.pending_score : s.approved_score;
            const a = ai[s.id];
            return `
            <div class="review-card${isMismatch(s) ? ' is-mismatch' : ''}${a && a.excluded ? ' is-excluded' : ''}">
              ${img ? `<img src="${escHtml(mediumUrl(img))}" alt="" onclick="window.open('${escHtml(img)}','_blank')">` : `<div style="width:100%;aspect-ratio:16/9;border-radius:6px;background:var(--bg-primary);margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.75rem">画像なし</div>`}
              <div class="rname"><a href="/user.html?id=${s.user_id}" target="_blank">${escHtml(s.username)}</a></div>
              <div class="rscore">${formatScore(score)} ${statusBadge(s.status)}</div>
              <div class="review-attr-fix">
                <select id="review-attr-${s.id}">
                  ${ATTRIBUTES.map(a => `<option value="${a}" ${a === s.attribute ? 'selected' : ''}>${a}</option>`).join('')}
                </select>
                <button class="btn btn-secondary btn-sm" style="padding:2px 8px;font-size:0.72rem" onclick="reviewFixAttr(${s.id})">修正</button>
              </div>
              ${a ? `<div style="margin-top:6px">${aiAttrHTML(a, s.attribute)}</div>
                <button type="button" class="review-ex" onclick="toggleExclude(${s.id})">${a.excluded ? 'お手本に戻す' : 'お手本にしない'}</button>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>`).join('');
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

let _reviewAi = {};
async function toggleExclude(id) {
  const a = _reviewAi[id];
  if (!a) return;
  try {
    await apiFetch('/admin/attr-check/exclude', { method: 'POST', body: JSON.stringify({ image_url: a.image_url, excluded: !a.excluded }) });
    showToast(a.excluded ? 'お手本に戻しました' : 'お手本から外しました');
    loadReviewScores();
  } catch (err) { showToast(err.message, 'error'); }
}

async function reviewFixAttr(id) {
  const newAttr = document.getElementById(`review-attr-${id}`).value;
  try {
    await apiFetch(`/admin/scores/${id}/approve`, {
      method: 'POST',
      body: JSON.stringify({ attribute: newAttr })
    });
    showToast('属性を修正しました');
    loadReviewScores();
  } catch (err) {
    showToast(err.message, 'error');
  }
}
</script>
