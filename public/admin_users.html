<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>ユーザー管理 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.us-tools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.us-tools .form-input { flex:1 1 220px; min-width:0; max-width:320px; padding:8px 12px; font-size:0.88rem; }
.us-tools .us-sort { flex:0 0 auto; width:auto; max-width:none; padding:7px 10px; font-size:0.82rem; }
.us-count { font-size:0.8rem; color:var(--text-muted); white-space:nowrap; }
.us-list { border-radius:12px; border:1px solid rgba(255,255,255,0.06); overflow:hidden; }
.us-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 14px; align-items:center; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.06); }
.us-row:last-child { border-bottom:none; }
.us-row:hover { background:rgba(255,255,255,0.025); }
.us-main { min-width:0; }
.us-name { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-weight:bold; }
.us-name a { color:var(--text-primary); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.us-id { font-size:0.72rem; font-weight:normal; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.us-tag { font-size:0.68rem; font-weight:bold; padding:2px 8px; border-radius:99px; white-space:nowrap; }
.us-tag.in { background:rgba(255,77,101,0.16); color:var(--accent-hover); }
.us-tag.out { background:rgba(255,255,255,0.07); color:var(--text-muted); }
.us-meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:0.76rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.us-meta b { color:var(--text-secondary); font-weight:bold; }
.us-meta .ti { color:var(--accent-hover); }
.us-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.us-del { background:transparent; color:#ff6b6b; border:1px solid rgba(231,76,60,0.65); }
.us-del:hover { background:rgba(231,76,60,0.14); color:#ff6b6b; }
.us-pw { grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:8px; background:var(--bg-primary); }
.us-pw .form-input { flex:1 1 200px; min-width:0; padding:6px 10px; font-size:0.85rem; }
@media (max-width:640px) {
  .us-row { grid-template-columns:minmax(0,1fr); }
  .us-actions { justify-content:flex-start; }
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="admin-head">
    <h1 class="page-title">ユーザー管理</h1>
    <div class="admin-nav" data-current="users"></div>
  </div>
  <div id="alert"></div>

  <div class="card">
    <div class="us-tools">
      <input class="form-input" id="list-search" type="search" placeholder="ユーザー名またはIDで検索" oninput="renderUsersList()">
      <div class="pill-tabs pill-sm" id="us-filter">
        <button class="on" data-v="" onclick="setUserFilter('')">すべて</button>
        <button data-v="in" onclick="setUserFilter('in')">内部</button>
        <button data-v="out" onclick="setUserFilter('out')">外部</button>
        <button data-v="admin" onclick="setUserFilter('admin')">管理者</button>
      </div>
      <select class="form-input us-sort" id="us-sort" onchange="renderUsersList()" aria-label="並べ替え">
        <option value="new">登録が新しい順</option>
        <option value="old">登録が古い順</option>
        <option value="points">ポイントが多い順</option>
        <option value="gp">GPが多い順</option>
        <option value="login">ログイン日数が多い順</option>
        <option value="name">名前順</option>
      </select>
      <span id="list-count" class="us-count"></span>
    </div>
    <div id="users-list"><div class="loading"><div class="spinner"></div></div></div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav();
if (!requireAdmin()) throw new Error('redirect');

// ===== ユーザー一覧（内部/外部の切り替え・パスワード変更もここで） =====
let _listUsers = [];
let _userFilter = '';
async function loadUsersList() {
  try {
    _listUsers = await apiFetch('/admin/users?t=' + Date.now());
    renderUsersList();
  } catch (err) {
    document.getElementById('users-list').innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}
function setUserFilter(v) {
  _userFilter = v;
  document.querySelectorAll('#us-filter > button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  renderUsersList();
}

// 検索欄の文字でユーザー名（部分一致・大文字小文字を区別しない）かID（数字のみのとき完全一致）を絞り込む
function renderUsersList() {
  const el = document.getElementById('users-list');
  const q = document.getElementById('list-search').value.trim().toLowerCase();
  const byFilter = u => !_userFilter || (_userFilter === 'in' && u.is_internal) || (_userFilter === 'out' && !u.is_internal) || (_userFilter === 'admin' && u.role === 'admin');
  const users = _listUsers.filter(u => byFilter(u) && (!q || u.username.toLowerCase().includes(q) || (/^\d+$/.test(q) && String(u.id) === q)));
  // 並べ替え（同じ値のときは登録が新しい順）
  const sortKey = document.getElementById('us-sort').value;
  const newer = (a, b) => new Date(b.created_at) - new Date(a.created_at);
  const SORTS = {
    new: newer,
    old: (a, b) => -newer(a, b),
    points: (a, b) => (b.points || 0) - (a.points || 0) || newer(a, b),
    gp: (a, b) => (b.gp || 0) - (a.gp || 0) || newer(a, b),
    login: (a, b) => (b.total_login_days || 0) - (a.total_login_days || 0) || newer(a, b),
    name: (a, b) => a.username.localeCompare(b.username, 'ja'),
  };
  users.sort(SORTS[sortKey] || newer);
  document.getElementById('list-count').textContent = users.length === _listUsers.length ? `全${_listUsers.length}人` : `${users.length}人 / 全${_listUsers.length}人`;
  if (users.length === 0) {
    el.innerHTML = `<div class="empty-state"><p>${_listUsers.length ? '該当するユーザーがいません' : 'ユーザーがいません'}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="us-list">${users.map(u => `
    <div class="us-row" id="us-${u.id}">
      <div class="us-main">
        <div class="us-name">
          <a href="/user.html?id=${u.id}" target="_blank">${escHtml(u.username)}</a>
          <span class="us-id">#${u.id}</span>
          ${u.role === 'admin' ? adminBadgeHtml() : ''}
          <span class="us-tag ${u.is_internal ? 'in' : 'out'}">${u.is_internal ? '内部' : '外部'}</span>
        </div>
        <div class="us-meta">
          <span><b>${Number(u.points || 0).toLocaleString()}</b>pt</span>
          <span><b>${Number(u.gp || 0).toLocaleString()}</b>GP</span>
          <span>ログイン <b>${u.total_login_days || 0}</b>日</span>
          ${u.equipped_title ? `<span class="ti">「${escHtml(u.equipped_title)}」</span>` : ''}
          <span>登録 ${formatDate(u.created_at)}</span>
        </div>
      </div>
      <div class="us-actions">
        <button class="btn btn-secondary btn-sm" onclick="setInternal(${u.id}, ${!u.is_internal})">${u.is_internal ? '外部にする' : '内部にする'}</button>
        <button class="btn btn-secondary btn-sm" onclick="togglePwForm(${u.id})">PW変更</button>
        <button class="btn btn-secondary btn-sm" onclick="toggleUserRole(${u.id}, '${u.role}')">${u.role === 'admin' ? '管理者解除' : '管理者にする'}</button>
        <button class="btn btn-sm us-del" onclick="deleteUser(${u.id}, '${escHtml(u.username).replace(/'/g, "\\'")}')">削除</button>
      </div>
      <div class="us-pw" id="pw-form-${u.id}" style="display:none">
        <input class="form-input" id="pw-input-${u.id}" type="text" placeholder="新しいパスワード（6文字以上）">
        <button class="btn btn-sm btn-primary" onclick="resetPassword(${u.id})">確定</button>
        <button class="btn btn-sm btn-secondary" onclick="togglePwForm(${u.id})">キャンセル</button>
      </div>
    </div>`).join('')}</div>`;
}

async function toggleUserRole(id, currentRole) {
  const newRole = currentRole === 'admin' ? 'user' : 'admin';
  const label = newRole === 'admin' ? '管理者にしますか？' : '管理者を解除しますか？';
  if (!await showConfirm(label)) return;
  try {
    const res = await apiFetch(`/admin/users/${id}/role`, { method: 'PATCH', body: JSON.stringify({ role: newRole }) });
    showToast(res.message);
    loadUsersList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteUser(id, name) {
  if (!await showConfirm(`「${name}」を削除しますか？スコアや称号履歴も全て削除されます。`, { danger: true })) return;
  try {
    const res = await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
    showToast(res.message);
    loadUsersList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function togglePwForm(userId) {
  const el = document.getElementById(`pw-form-${userId}`);
  el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  if (el.style.display === 'flex') document.getElementById(`pw-input-${userId}`).focus();
}

async function resetPassword(userId) {
  const pw = document.getElementById(`pw-input-${userId}`).value.trim();
  if (!pw) return;
  try {
    await apiFetch(`/admin/users/${userId}/password`, {
      method: 'PATCH',
      body: JSON.stringify({ new_password: pw })
    });
    showToast('パスワードを変更しました');
    togglePwForm(userId);
    document.getElementById(`pw-input-${userId}`).value = '';
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function setInternal(userId, val) {
  try {
    await apiFetch(`/admin/users/${userId}/internal`, {
      method: 'PATCH',
      body: JSON.stringify({ is_internal: val })
    });
    _listUsers = _listUsers.map(u => u.id === userId ? { ...u, is_internal: val } : u);
    renderUsersList();
    showToast(val ? '内部にしました' : '外部にしました');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// 初期ロード
loadUsersList();
</script>
</body>
</html>
