<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掲示板 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
#room-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
/* タブは選択中の1つだけ属性色を出し、それ以外は色に関係なく一律グレーにする */
#room-tabs .attr-btn { opacity:1; border-color:var(--border); color:var(--text-secondary); background:transparent; }
#room-tabs .attr-btn:hover { border-color:var(--border-light); color:var(--text-primary); }
#room-tabs .attr-btn.active.attr-火 { border-color:var(--fire); color:var(--fire); background:var(--fire-bg); }
#room-tabs .attr-btn.active.attr-氷 { border-color:var(--ice); color:var(--ice); background:var(--ice-bg); }
#room-tabs .attr-btn.active.attr-雷 { border-color:var(--thunder); color:var(--thunder); background:var(--thunder-bg); }
#room-tabs .attr-btn.active.attr-光 { border-color:var(--light); color:var(--light); background:var(--light-bg); }
#room-tabs .attr-btn.active.attr-闇 { border-color:var(--dark); color:var(--dark); background:var(--dark-bg); }
#room-tabs .attr-btn.active.attr-無 { border-color:var(--none); color:var(--none); background:var(--none-bg); }
#chat-box {
  display:flex; flex-direction:column;
  height:min(65vh, 560px);
  padding:0; overflow:hidden;
}
#chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
#chat-input-row { border-top:1px solid var(--border); padding:10px; display:flex; gap:8px; flex-shrink:0; }
#chat-input-row input { flex:1; }
.chat-msg { display:flex; flex-direction:column; max-width:78%; }
.chat-msg.mine { align-self:flex-end; align-items:flex-end; }
.chat-msg.theirs { align-self:flex-start; align-items:flex-start; }
.chat-msg-name { font-size:0.72rem; color:var(--text-muted); margin:0 4px 2px; }
.chat-msg-row { display:flex; align-items:flex-end; gap:6px; }
.chat-msg.mine .chat-msg-row { flex-direction:row-reverse; }
.chat-msg-content { display:flex; flex-direction:column; gap:6px; max-width:100%; }
.chat-msg.mine .chat-msg-content { align-items:flex-end; }
.chat-msg.theirs .chat-msg-content { align-items:flex-start; }
.chat-bubble {
  padding:8px 12px; border-radius:14px; font-size:0.88rem; line-height:1.5;
  word-break:break-word; white-space:pre-wrap;
}
.chat-msg.mine .chat-bubble { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.chat-msg.theirs .chat-bubble {
  background:var(--bg-card2); color:var(--text-primary); border-bottom-left-radius:4px;
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
}
.chat-img { max-width:200px; max-height:200px; border-radius:12px; cursor:pointer; display:block; object-fit:cover; }
.chat-msg-time { font-size:0.65rem; color:var(--text-muted); white-space:nowrap; }
.chat-msg-del { background:none; border:none; color:var(--text-muted); font-size:0.68rem; cursor:pointer; margin-top:2px; padding:0 4px; }
.chat-msg-del:hover { color:var(--danger); }
#chat-attach-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; padding:0 4px; flex-shrink:0; }
#chat-attach-btn:hover { color:var(--text-primary); }
#chat-image-preview { display:none; align-items:center; gap:8px; padding:8px 10px 0; }
#chat-image-preview img { width:48px; height:48px; object-fit:cover; border-radius:8px; }
#chat-image-preview button { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem; line-height:1; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1 class="page-title" data-i18n="chat.title">掲示板</h1>
  <p class="page-subtitle" data-i18n="chat.subtitle">属性ごとに相談できる掲示板です</p>
  <div id="alert"></div>

  <div id="room-tabs">
    <button class="attr-btn attr-火 active" data-room="火" data-i18n="attr.火" onclick="switchRoom('火')">火</button>
    <button class="attr-btn attr-氷" data-room="氷" data-i18n="attr.氷" onclick="switchRoom('氷')">氷</button>
    <button class="attr-btn attr-雷" data-room="雷" data-i18n="attr.雷" onclick="switchRoom('雷')">雷</button>
    <button class="attr-btn attr-光" data-room="光" data-i18n="attr.光" onclick="switchRoom('光')">光</button>
    <button class="attr-btn attr-闇" data-room="闇" data-i18n="attr.闇" onclick="switchRoom('闇')">闇</button>
    <button class="attr-btn attr-無" data-room="無" data-i18n="attr.無" onclick="switchRoom('無')">無</button>
  </div>

  <div class="card" id="chat-box">
    <div id="chat-messages"><div class="loading"><div class="spinner"></div></div></div>
    <div id="chat-image-preview">
      <img id="chat-image-preview-img" src="" alt="">
      <button type="button" onclick="clearChatImage()">×</button>
    </div>
    <div id="chat-input-row">
      <button type="button" id="chat-attach-btn" title="画像を添付">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>
      </button>
      <input type="file" id="chat-image-input" accept="image/*" style="display:none">
      <input class="form-input" id="chat-input" maxlength="300" data-i18n-ph="chat.placeholder" placeholder="メッセージを入力">
      <button class="btn btn-primary" onclick="sendChatMessage()" data-i18n="send">送信</button>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

const me = getUser();
const isAdmin = me?.role === 'admin';

let currentRoom = '火';
let lastId = 0;
let pollTimer = null;

function renderMessage(m) {
  const mine = m.user_id === me.id;
  const time = new Date(m.created_at).toLocaleTimeString(getLangLocale(), { hour: '2-digit', minute: '2-digit' });
  const imageHtml = m.image_url
    ? `<img src="${escHtml(m.image_url)}" class="chat-img" onclick="window.open('${escHtml(m.image_url)}','_blank')" alt="">`
    : '';
  const bodyHtml = m.body ? `<div class="chat-bubble">${escHtml(m.body)}</div>` : '';
  return `
    <div class="chat-msg ${mine ? 'mine' : 'theirs'}" data-msg-id="${m.id}">
      ${!mine ? `<div class="chat-msg-name">${escHtml(m.username)}${m.is_admin ? ' <span style="color:var(--accent)">★</span>' : ''}</div>` : ''}
      <div class="chat-msg-row">
        <div class="chat-msg-content">${imageHtml}${bodyHtml}</div>
        <div class="chat-msg-time">${time}</div>
      </div>
      ${isAdmin ? `<button class="chat-msg-del" onclick="deleteChatMessage(${m.id})">${t('chat.delete')}</button>` : ''}
    </div>`;
}

function isNearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

function scrollToBottom() {
  const el = document.getElementById('chat-messages');
  el.scrollTop = el.scrollHeight;
}

async function loadRoom(room) {
  currentRoom = room;
  lastId = 0;
  const el = document.getElementById('chat-messages');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const msgs = await apiFetch(`/chat/${encodeURIComponent(room)}`);
    el.innerHTML = msgs.length
      ? msgs.map(renderMessage).join('')
      : `<div class="empty-state"><p>${t('chat.empty')}</p></div>`;
    lastId = msgs.length ? msgs[msgs.length - 1].id : 0;
    scrollToBottom();
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

function switchRoom(room) {
  if (room === currentRoom) return;
  document.querySelectorAll('#room-tabs .attr-btn').forEach(b => b.classList.toggle('active', b.dataset.room === room));
  loadRoom(room);
}

async function pollNew() {
  try {
    const msgs = await apiFetch(`/chat/${encodeURIComponent(currentRoom)}?after_id=${lastId}`);
    if (msgs.length === 0) return;
    const el = document.getElementById('chat-messages');
    const wasEmpty = el.querySelector('.empty-state');
    const stayAtBottom = wasEmpty || isNearBottom(el);
    if (wasEmpty) el.innerHTML = '';
    msgs.forEach(m => {
      el.insertAdjacentHTML('beforeend', renderMessage(m));
      lastId = m.id;
    });
    if (stayAtBottom) scrollToBottom();
  } catch { /* ポーリング失敗時は次回に任せる */ }
}

let selectedChatImage = null;

document.getElementById('chat-attach-btn').addEventListener('click', () => {
  document.getElementById('chat-image-input').click();
});
document.getElementById('chat-image-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  selectedChatImage = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('chat-image-preview-img').src = ev.target.result;
    document.getElementById('chat-image-preview').style.display = 'flex';
  };
  reader.readAsDataURL(file);
});

function clearChatImage() {
  selectedChatImage = null;
  document.getElementById('chat-image-input').value = '';
  document.getElementById('chat-image-preview').style.display = 'none';
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const body = input.value.trim();
  const image = selectedChatImage;
  if (!body && !image) return;
  input.value = '';
  input.disabled = true;
  try {
    let m;
    if (image) {
      const formData = new FormData();
      formData.append('body', body);
      formData.append('image', image);
      m = await apiFormFetch(`/chat/${encodeURIComponent(currentRoom)}`, formData);
    } else {
      m = await apiFetch(`/chat/${encodeURIComponent(currentRoom)}`, {
        method: 'POST',
        body: JSON.stringify({ body }),
      });
    }
    clearChatImage();
    const el = document.getElementById('chat-messages');
    const wasEmpty = el.querySelector('.empty-state');
    if (wasEmpty) el.innerHTML = '';
    el.insertAdjacentHTML('beforeend', renderMessage(m));
    lastId = m.id;
    scrollToBottom();
  } catch (err) {
    showAlert('#alert', err.message);
    input.value = body;
  } finally {
    input.disabled = false;
    input.focus();
  }
}

async function deleteChatMessage(id) {
  try {
    await apiFetch(`/admin/chat/${id}`, { method: 'DELETE' });
    document.querySelector(`[data-msg-id="${id}"]`)?.remove();
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

loadRoom(currentRoom);
pollTimer = setInterval(pollNew, 4000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearInterval(pollTimer); }
  else { pollNew(); pollTimer = setInterval(pollNew, 4000); }
});
</script>
</body>
</html>
