<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー詳細 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main style="position:relative">
  <a class="back-link" href="javascript:history.back()" style="color:rgba(232,232,240,0.75);font-size:.85rem;display:inline-block;margin-bottom:16px" data-i18n="user.back">← 戻る</a>
  <div id="delete-btn-wrap" style="display:none;position:absolute;top:0;right:0;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <div id="google-link-btn-profile" style="display:none"></div>
    <button class="btn btn-sm" onclick="openDeleteModal()" style="background:rgba(200,50,50,0.15);color:#e57373;border:1px solid #e57373;font-size:0.78rem" data-i18n="user.delete">アカウント削除</button>
  </div>
  <div id="alert"></div>
  <div id="content">
    <div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div>
  </div>
</main>

<style>
/* ===== 戦績グラフ ===== */
.hist-card { padding:16px 14px 12px; margin-bottom:24px; scroll-margin-top:72px; }
.hist-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
.hist-title { font-weight:bold; font-size:1rem; }
.hist-sub { font-size:0.72rem; color:var(--text-secondary); }
.hist-title-wrap { position:relative; display:flex; align-items:center; gap:6px; }
/* 吹き出しの基準をタイトル側にして、カードの左端に揃える */
.hist-help.title-tooltip-wrap { position:static; }
.hist-help { display:inline-flex; color:var(--text-secondary); cursor:pointer; line-height:0; }
.hist-help:hover, .hist-help.tt-open { color:var(--text-primary); }
.hist-help:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:50%; }
/* 説明が長いので、ナビに隠れないようアイコンの下に左揃えで出す */
.hist-help .title-tooltip {
  top:calc(100% + 10px); bottom:auto; left:0; transform:none; width:min(300px, calc(100vw - 60px)); line-height:1.6; padding:10px 12px;
  background:rgba(16,14,30,0.98); z-index:20;
}
/* 矢印は「?」アイコンの真下（タイトル幅＋余白の位置）に */
.hist-help .title-tooltip::after { top:auto; bottom:100%; left:86px; transform:none; border-top-color:transparent; border-bottom-color:var(--border-light); }
.hist-help .title-tooltip::before { top:auto; bottom:100%; left:87px; transform:translateY(2px); border-width:5px; border-top-color:transparent; border-bottom-color:rgba(16,14,30,0.98); }
.hist-help-title { display:block; font-weight:bold; color:var(--text-primary); margin-bottom:4px; }
.hist-help-item { display:block; padding-left:10px; text-indent:-10px; margin-top:4px; }
.hist-help-item::before { content:'・'; }
.hist-legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:0.7rem; color:var(--text-secondary); margin-bottom:8px; }
.hist-legend span { display:inline-flex; align-items:center; gap:4px; }
.hist-graph { position:relative; }
.hist-scroll { overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.hist-svg { display:block; }
.hist-hit { cursor:pointer; fill:transparent; }
.hist-hit:focus { outline:none; }
.hist-tip {
  position:absolute; z-index:5; min-width:150px; max-width:190px; padding:8px 10px; border-radius:10px;
  background:rgba(14,12,28,0.96); border:1px solid var(--border-light); box-shadow:0 8px 24px rgba(0,0,0,0.5);
  font-size:0.74rem; line-height:1.5; pointer-events:none;
}
.hist-tip-ev { font-size:0.68rem; font-weight:bold; letter-spacing:0.04em; }
.hist-tip-name { font-weight:bold; font-size:0.82rem; margin-bottom:4px; word-break:break-word; }
.hist-tip-row { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--text-secondary); }
.hist-tip-row b { color:var(--text-primary); font-variant-numeric:tabular-nums; }
.hist-tip-best { display:inline-block; margin-top:6px; font-size:0.66rem; font-weight:800; padding:1px 8px; border-radius:4px; background:#ffd700; color:#241800; }
.hist-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.hist-summary > div { display:flex; flex-direction:column; justify-content:space-between; background:rgba(255,255,255,0.04); border-radius:8px; padding:6px 8px; }
.hist-summary .l { font-size:0.66rem; color:var(--text-secondary); }
.hist-summary .v { font-weight:bold; font-size:0.95rem; }

/* 過去のリザルト */
.res-head { display:flex; align-items:baseline; justify-content:space-between; margin:24px 2px 10px; }
.res-title { font-size:1rem; font-weight:bold; }
.res-count { font-size:0.75rem; color:var(--text-muted); }
.res-list { display:grid; gap:10px; }
@media (min-width:760px) { .res-list { grid-template-columns:1fr 1fr; align-items:start; } }
.res-card {
  position:relative; border-radius:12px; overflow:hidden; background:var(--bg-card); border:1px solid var(--border);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); --rt:var(--accent);
}
.res-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--rt); opacity:0.85; }
.res-card.is-podium { border-color:color-mix(in srgb, var(--pod) 45%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--pod) 18%, transparent); }
.res-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px 8px 16px; }
.res-card-info { min-width:0; display:flex; flex-direction:column; gap:3px; }
.res-type { align-self:flex-start; font-size:0.62rem; font-weight:800; letter-spacing:0.06em; padding:1px 7px; border-radius:4px; color:var(--rt); background:color-mix(in srgb, var(--rt) 16%, transparent); border:1px solid color-mix(in srgb, var(--rt) 45%, transparent); }
.res-name { font-size:0.92rem; font-weight:bold; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.res-name:hover { color:var(--accent); }
.res-rank { display:flex; align-items:baseline; gap:2px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:45%; }
.res-rank svg { align-self:center; margin-right:3px; }
.res-rank-num { font-family:"Bebas Neue","Zen Kaku Gothic New",sans-serif; font-size:1.7rem; line-height:1; font-variant-numeric:tabular-nums; color:var(--pod, var(--text-primary)); }
.res-rank-unit { font-size:0.75rem; font-weight:bold; color:var(--pod, var(--text-secondary)); }
.res-rank-total { font-size:0.7rem; color:var(--text-muted); margin-left:4px; }
.res-rank-int { flex-basis:100%; text-align:right; font-size:0.66rem; color:var(--accent); }
.res-rows { padding:0 14px 8px 16px; }
.res-row { display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(255,255,255,0.06); }
.res-score { font-weight:bold; font-size:1rem; font-variant-numeric:tabular-nums; }
.res-row:not(.is-best) .res-score { font-size:0.92rem; color:var(--text-secondary); }
.res-attr-rank { font-size:0.72rem; color:var(--text-muted); white-space:nowrap; text-align:right; display:flex; flex-direction:column; align-items:flex-end; }
.res-attr-rank b { color:var(--text-primary); font-size:0.85rem; }
.res-attr-rank small { font-size:0.62rem; }
.res-thumb { position:relative; width:64px; height:36px; padding:0; border:1px solid var(--border-light); border-radius:6px; overflow:hidden; background:var(--bg-primary); cursor:pointer; }
.res-thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.2s; }
.res-thumb:hover img { transform:scale(1.08); }
.res-thumb.is-empty { cursor:default; border-style:dashed; opacity:0.4; }
.res-yt { position:absolute; right:3px; bottom:3px; width:18px; height:13px; border-radius:3px; background:#ff0033; display:flex; align-items:center; justify-content:center; }
.res-yt svg { width:10px; height:10px; }
.res-more { display:block; width:100%; margin-top:10px; padding:10px; border-radius:10px; border:1px dashed var(--border-light); background:none; color:var(--text-secondary); font-family:inherit; font-size:0.85rem; font-weight:bold; cursor:pointer; }
.res-more:hover { color:var(--text-primary); border-color:var(--accent); }

.back-link { text-decoration:none; }
.back-link:hover { color:var(--text-primary) !important; }
.score-grid {
  display: grid;
  gap: 16px;
}
.event-score-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.event-score-header {
  padding: 12px 16px;
  background: var(--bg-card2);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.event-score-title { font-weight: bold; font-size: 0.95rem; }
.event-rank-badge {
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 12px;
}
.attr-score-list { padding: 12px 16px; display:flex; flex-wrap:wrap; gap:10px; }
.attr-score-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
}
.attr-score-val { font-weight: bold; font-variant-numeric: tabular-nums; }
.attr-score-img { width:32px; height:22px; object-fit:cover; border-radius:3px; cursor:pointer; border:1px solid var(--border); }
.attr-score-img.has-yt { border:2px solid #ff4444; }

.comp-rank-badge { display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.8rem;padding:2px 4px;letter-spacing:0.05em; }
.rank-C  { color:#aaa; }
.rank-B  { color:#5cb85c; }
.rank-A  { color:#5b9bd5; }
.rank-S  { color:#e6a028; }
.rank-X  { color:#f0c040; }
.rank-Ex { color:#a855f7; }
#img-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; flex-direction:column; padding:48px 16px 24px; }
#img-modal.open { display:flex; }
#img-modal img { max-width:90vw; max-height:75vh; border-radius:8px; }
#img-modal-close { position:fixed; top:16px; right:20px; background:none; border:none; color:white; font-size:2rem; cursor:pointer; }
</style>

<div id="img-modal">
  <button id="img-modal-close" onclick="closeModal()">×</button>
  <img id="modal-img" src="" alt="">
  <div id="modal-yt" style="display:none;margin-top:12px;text-align:center">
    <div id="modal-yt-score" style="font-size:0.8rem;color:rgba(255,255,255,0.6);margin-bottom:6px"></div>
    <a id="modal-yt-link" href="" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;color:#ff4444;font-size:0.95rem;font-weight:bold;text-decoration:underline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      YouTube動画を見る
    </a>
  </div>
</div>

<!-- アカウント削除モーダル -->
<div id="delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">
  <div class="card" style="width:min(360px,90vw);padding:24px;background:var(--bg-modal);border-color:var(--border-light)">
    <div style="font-weight:bold;font-size:1rem;color:#e57373;margin-bottom:8px" data-i18n="user.delete_title">アカウント削除</div>
    <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px" data-i18n="user.delete_warn">この操作は取り消せません。パスワードを入力して確認してください。</div>
    <div id="delete-alert"></div>
    <div class="form-group">
      <label class="form-label" data-i18n="login.password">パスワード</label>
      <div class="pw-wrap">
        <input class="form-input" id="delete-pw" type="password" data-i18n-ph="user.pw_ph" placeholder="パスワードを入力">
        <button type="button" class="pw-toggle" onclick="togglePw('delete-pw')" tabindex="-1"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeDeleteModal()" data-i18n="cancel">キャンセル</button>
      <button class="btn" style="flex:1;background:#c62828;color:#fff;border:none" onclick="doDeleteAccount()" data-i18n="user.delete_btn">削除する</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();

const userId = getParam('id');
if (!userId) location.href = '/index.html';

function compRankBadge(rank, sRate, xRate, exRank, legendRank) {
  const isLegend = rank === 'Legend';
  const r = (rank || 'C').toLowerCase();
  const img = isLegend
    ? `<img src="/img/legend${legendRank}.png" style="height:32px;width:auto;object-fit:contain;vertical-align:middle" alt="LEGEND ${legendRank}">`
    : `<img src="/img/rank_${r}.png" style="width:32px;height:32px;object-fit:contain;vertical-align:middle" alt="${rank || 'C'}">`;
  const rate = rank === 'S' ? sRate : xRate;
  const rateStr = rate != null ? `<span style="font-size:0.9rem;font-weight:bold;margin-left:4px">${Math.floor(rate)}</span>` : '';
  if (!rank || rank === 'C' || rank === 'B' || rank === 'A') return `<span class="comp-rank-badge rank-${rank || 'C'}">${img}</span>`;
  if (rank === 'Ex') {
    const exStr = exRank != null ? `<span style="font-size:0.9rem;font-weight:bold;margin-left:2px">${exRank}位</span>` : '';
    return `<span class="comp-rank-badge rank-Ex">${img}${exStr}${rateStr}</span>`;
  }
  return `<span class="comp-rank-badge rank-${rank}">${img}${rateStr}</span>`;
}

function rankProgressBar(rank, rankPoints, sRate) {
  const RANKS = {
    C: { min: 0, max: 400,  next: 'B' },
    B: { min: 0, max: 1300, next: 'A' },
    A: { min: 0, max: 3000, next: 'S' },
    S: { min: 0, max: 1000, next: 'X' },
  };
  const cfg = RANKS[rank];
  if (!cfg) return '';
  const val  = rank === 'S' ? (sRate || 0) : (rankPoints || 0);
  const pct  = Math.min(100, Math.max(0, ((val - cfg.min) / (cfg.max - cfg.min)) * 100));
  const colors = { C:'#aaa', B:'#5cb85c', A:'#5b9bd5', S:'#e6a028' };
  const col = colors[rank];
  const cur  = rank === 'S' ? Math.floor(sRate || 0) : (rankPoints || 0);
  return `
    <div style="margin-top:10px;max-width:280px">
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text-muted);margin-bottom:4px">
        <span>${rank}</span><span style="color:${col}">${cur} / ${cfg.max}</span><span>${cfg.next}</span>
      </div>
      <div style="height:6px;border-radius:3px;background:var(--bg-card2);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${col};border-radius:3px;transition:width 0.8s ease"></div>
      </div>
    </div>`;
}

async function load() {
  try {
    const currentUser = getUser();
    const isMe = currentUser && String(currentUser.id) === String(userId);
    const [data, meData] = await Promise.all([
      apiFetch(`/users/${userId}`),
      isMe ? apiFetch('/auth/me').catch(() => null) : Promise.resolve(null),
    ]);
    if (meData) Object.assign(currentUser, { has_google: meData.has_google });
    document.title = `${data.username} - HBR`;

    // イベントごとにスコアをグループ化
    const eventMap = {};
    data.scores.forEach(s => {
      if (!eventMap[s.event_id]) {
        eventMap[s.event_id] = {
          event_id: s.event_id,
          event_number: s.event_number,
          event_name: s.event_name,
          event_type: s.event_type,
          scores: []
        };
      }
      s.attr_rank_ext = data.attr_ranks[`${s.event_id}_${s.attribute}`] || null;
      s.attr_rank_int = data.attr_ranks_internal?.[`${s.event_id}_${s.attribute}`] || null;
      eventMap[s.event_id].scores.push(s);
    });

    const events = Object.values(eventMap).sort((a, b) => b.event_number - a.event_number);

    if (isMe) {
      document.getElementById('delete-btn-wrap').style.display = 'flex';
      if (meData && !meData.has_google) initGoogleLinkBtn();
    }

    document.getElementById('content').innerHTML = `
      <div class="user-header">
        <div class="user-avatar" style="${data.equipped_icon_url ? 'border:none' : ''}">${data.equipped_icon_url ? `<img src="${escHtml(thumbUrl(data.equipped_icon_url))}" alt="${escHtml(data.username)}" class="${data.equipped_icon_rarity ? `icon-rarity-${escHtml(data.equipped_icon_rarity)}` : ''}" style="width:100%;height:100%;object-fit:cover;border-radius:20%">` : escHtml(data.username.charAt(0))}</div>
        <div class="user-info">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <h2 style="margin:0">${escHtml(data.username)}</h2>
            ${compRankBadge(data.comp_rank, data.s_rate, data.x_rate, data.ex_rank, data.legend_rank)}
          </div>
          ${data.twitter_username ? `<div style="font-size:0.85rem;margin-top:2px"><a href="https://x.com/${escHtml(data.twitter_username)}" target="_blank" rel="noopener noreferrer" style="color:#1d9bf0;text-decoration:underline;display:inline-flex;align-items:center;gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@${escHtml(data.twitter_username)}</a></div>` : ''}
          ${data.youtube_channel ? `<div style="font-size:0.85rem;margin-top:2px"><a href="https://youtube.com/@${escHtml(data.youtube_channel)}" target="_blank" rel="noopener noreferrer" style="color:#ff4444;text-decoration:underline;display:inline-flex;align-items:center;gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>@${escHtml(data.youtube_channel)}</a></div>` : ''}
          ${rankProgressBar(data.comp_rank, data.rank_points, data.s_rate)}
          ${data.oshi_character
            ? `<div class="user-oshi">${t('user.oshi')}${escHtml(data.oshi_character)}</div>`
            : ''}
          ${data.equipped_title
            ? `<div style="font-size:0.85rem;margin-top:4px"><span style="color:rgba(232,232,240,0.75)">${t('user.title_label')}</span><span class="title-tooltip-wrap" style="color:var(--accent)">「${escHtml(data.equipped_title)}」${data.equipped_title_desc ? `<span class="title-tooltip">${escHtml(data.equipped_title_desc)}</span>` : ''}</span></div>`
            : ''}
          <div style="font-size:0.8rem;color:rgba(232,232,240,0.75);margin-top:2px">${t('user.joined')}${formatDate(data.created_at)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
            ${isMe ? `<button class="btn btn-secondary btn-sm" onclick="toggleEditForm()">${t('user.edit')}</button>` : ''}
            <a class="btn btn-secondary btn-sm" href="/videos.html?name=${encodeURIComponent(data.username)}" style="text-decoration:none">▶ ${escHtml(data.username)}${t('user.video_board') || 'の動画掲示板'}</a>
          </div>
        </div>
      </div>

      ${isMe ? `
      <div id="edit-form-wrap" class="card" style="display:none;margin-bottom:24px">
        <div style="font-weight:bold;margin-bottom:16px">${t('user.edit_title')}</div>
        <div id="edit-alert"></div>
        <div class="form-group">
          <label class="form-label">${t('user.username')}</label>
          <input class="form-input" id="edit-username" type="text" value="${escHtml(data.username)}" maxlength="12">
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;align-items:baseline">
            <span>${t('register.login_id')}</span>
            <span style="font-size:0.75rem;color:var(--text-muted)">${t('register.login_id_hint')}</span>
          </label>

// ===== 過去のリザルト =====
const RES_INITIAL = 5; // 最初に見せる回数（残りは「もっと見る」）
const RES_TYPES = {
  score_attack: { label: 'スコアタ', color: '#ff6b80' },
  seraph: { label: '遭遇戦', color: '#4fc3f7' },
  score_attack_ex: { label: 'EX', color: '#e0b84a' },
};
const RES_PODIUM = { 1: '#ffd700', 2: '#c0c0c0', 3: '#cd7f32' };
const RES_CROWN = c => `<svg width="16" height="13" viewBox="0 0 24 18" fill="${c}" aria-hidden="true"><path d="M2 16h20l1.5-11-6.5 5-5-8-5 8-6.5-5z"/></svg>`;
const RES_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

function resultCardHTML(e, data, hidden) {
  const type = RES_TYPES[e.event_type];
  const rank = data.ranks[e.event_id];
  const total = data.participants?.[e.event_id];
  const rankInt = data.ranks_internal?.[e.event_id];
  const podium = RES_PODIUM[rank];
  const rows = e.scores.map((s, k) => {
    const attrRank = data.ranks_internal ? s.attr_rank_int : s.attr_rank_ext;
    const thumb = s.approved_image_url
      ? `<button type="button" class="res-thumb" onclick="openModal('${escHtml(s.approved_image_url)}','${s.youtube_url ? escHtml(s.youtube_url) : ''}',${s.youtube_score ? s.youtube_score : 'null'})" aria-label="リザルト画像を見る">
          <img src="${escHtml(thumbUrl(s.approved_image_url))}" alt="" loading="lazy">${s.youtube_url ? `<span class="res-yt">${RES_PLAY}</span>` : ''}
        </button>`
      : '<span class="res-thumb is-empty"></span>';
    return `
      <div class="res-row${k === 0 ? ' is-best' : ''}">
        ${attrBadge(s.attribute, true)}
        <span class="res-score">${formatScore(s.approved_score)}</span>
        <span class="res-attr-rank">${attrRank ? `<span>属性 <b>${attrRank}</b>位</span>` : ''}${data.ranks_internal && s.attr_rank_ext ? `<small>外部${s.attr_rank_ext}位</small>` : ''}</span>
        ${thumb}
      </div>`;
  }).join('');
  return `
    <article class="res-card${podium ? ' is-podium' : ''}"${hidden ? ' hidden' : ''} style="${type ? `--rt:${type.color};` : ''}${podium ? `--pod:${podium};` : ''}">
      <header class="res-card-head">
        <div class="res-card-info">
          ${type ? `<span class="res-type">${type.label}</span>` : ''}
          <a href="/ranking.html?id=${e.event_id}" class="res-name">${escHtml(e.event_name)}</a>
        </div>
        ${rank ? `<div class="res-rank">
          ${podium ? RES_CROWN(podium) : ''}<span class="res-rank-num">${rank}</span><span class="res-rank-unit">位</span>
          ${total ? `<span class="res-rank-total">/ ${total}人</span>` : ''}
          ${rankInt ? `<span class="res-rank-int">内部 ${rankInt}位</span>` : ''}
        </div>` : ''}
      </header>
      <div class="res-rows">${rows}</div>
    </article>`;
}

async function saveProfile() {
  const username = document.getElementById('edit-username')?.value.trim();
  const oshi = document.getElementById('edit-oshi')?.value.trim();
  const twitterRaw = document.getElementById('edit-twitter')?.value.trim().replace(/^@/, '');
  const ytChannel = document.getElementById('edit-youtube')?.value.trim().replace(/^@/, '') || null;
  const currentPw = document.getElementById('edit-current-pw')?.value;
  const newPw = document.getElementById('edit-new-pw')?.value;
  const alertEl = document.getElementById('edit-alert');
  alertEl.innerHTML = '';

  if (twitterRaw && !/^[A-Za-z0-9_]{1,15}$/.test(twitterRaw)) {
    alertEl.innerHTML = `<div class="alert alert-error">${t('user.x_err')}</div>`;
    return;
  }

  const userCode = document.getElementById('edit-user-code')?.value.trim() || undefined;
  const body = { username, user_code: userCode || undefined, oshi_character: oshi || null, twitter_username: twitterRaw || null, youtube_channel: ytChannel };
  if (newPw) { body.current_password = currentPw; body.new_password = newPw; }

  try {
    const res = await apiFetch('/auth/me', { method: 'PUT', body: JSON.stringify(body) });
    setAuth(res.token, res.user);
    renderNav();
    alertEl.innerHTML = `<div class="alert alert-success">${t('user.saved')}</div>`;
    const avatar = document.querySelector('.user-avatar');
    if (avatar) avatar.textContent = res.user.username.charAt(0);
    document.querySelector('.user-info h2').textContent = res.user.username;
    const oshiEl = document.querySelector('.user-oshi');
    if (res.user.oshi_character) {
      if (oshiEl) oshiEl.textContent = t('user.oshi') + res.user.oshi_character;
    } else if (oshiEl) {
      oshiEl.remove();
    }
    if (newPw) {
      document.getElementById('edit-current-pw').value = '';
      document.getElementById('edit-new-pw').value = '';
    }
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

async function initGoogleLinkBtn() {
  const wrap = document.getElementById('google-link-btn-profile');
  if (!wrap) return;
  const { client_id } = await fetch('/api/auth/google/client-id').then(r => r.json()).catch(() => ({}));
  if (!client_id) return;
  wrap.style.display = '';
  const init = () => {
    if (!window.google) return;
    google.accounts.id.initialize({ client_id, callback: handleGoogleLinkProfile });
    google.accounts.id.renderButton(wrap, { theme: 'outline', size: 'small', text: 'signin_with', locale: 'ja' });
  };
  if (!document.querySelector('script[src*="accounts.google.com"]')) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = init;
    document.head.appendChild(s);
  } else if (window.google) {
    init();
  } else {
    document.querySelector('script[src*="accounts.google.com"]')?.addEventListener('load', init);
  }
}

// ===== 戦績グラフ =====
// 縦軸はpt換算（非公開）なので数値を出さず、APIもユーザー内で正規化した高さ(y)だけを返す
const HIST_TYPES = {
  score_attack: { label: 'スコアアタック', color: '#ff6b80', shape: 'circle' },
  seraph: { label: '遭遇戦', color: '#4fc3f7', shape: 'diamond' },
  score_attack_ex: { label: 'スコアアタックEX', color: '#e0b84a', shape: 'triangle' },
};
// 上位3位の王冠の色（ランキング表示の金・銀・銅と揃える）
const HIST_PODIUM = { 1: '#ffd700', 2: '#c0c0c0', 3: '#cd7f32' };
const histCrown = (x, y, color) => `<g transform="translate(${x},${y})"><path d="M-7 3L-7 -3L-3.5 0L0 -5L3.5 0L7 -3L7 3Z" fill="${color}" stroke="#241800" stroke-width="0.8"/></g>`;
const HIST_TREND = { up: ['上昇傾向', '#49d6a8'], flat: ['維持', 'var(--text-primary)'], down: ['下降傾向', '#ff8a80'] };
let _hist = null;

function histShape(shape, x, y, r, color, extra = '') {
  if (shape === 'diamond') return `<path d="M${x} ${y - r * 1.25}L${x + r * 1.25} ${y}L${x} ${y + r * 1.25}L${x - r * 1.25} ${y}Z" fill="${color}" ${extra}/>`;
  if (shape === 'triangle') return `<path d="M${x} ${y - r * 1.3}L${x + r * 1.2} ${y + r * 0.9}L${x - r * 1.2} ${y + r * 0.9}Z" fill="${color}" ${extra}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" ${extra}/>`;
}

async function loadHistory() {
  const card = document.getElementById('history-card');

  }
  if (!_hist.events.length) return;
  const sm = _hist.summary;
  const legend = Object.values(HIST_TYPES).map(t => `<span><svg width="12" height="12">${histShape(t.shape, 6, 6, 4, t.color)}</svg>${t.label}</span>`).join('')
    + '<span><svg width="14" height="10"><path d="M1 5H13" stroke="rgba(232,232,240,0.6)" stroke-width="1.6" stroke-dasharray="3 3"/></svg>不参加</span>'
    + `<span><svg width="50" height="12">${[1, 2, 3].map(r => histCrown(8 + (r - 1) * 17, 7, HIST_PODIUM[r])).join('')}</svg>1〜3位</span>`;
  const trend = HIST_TREND[sm.trend];
  card.className = 'card hist-card';

  card.innerHTML = `
    <div class="hist-head">
      <span class="hist-title-wrap">
        <span class="hist-title">戦績グラフ</span>
        <span class="title-tooltip-wrap hist-help" tabindex="0" role="button" aria-label="グラフの高さについて"
              onclick="event.stopPropagation(); this.classList.toggle('tt-open')"
              onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.classList.toggle('tt-open'); }">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.7"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
          <span class="title-tooltip">
            <span class="hist-help-title">戦績グラフの見方</span>
            <span class="hist-help-item">各回のベストスコア（いちばん高い属性）の推移です</span>
            <span class="hist-help-item">高さは、スコアアタック・遭遇戦・EXを同じ基準で比べられるように換算したスコアです。順位ではありません</span>
            <span class="hist-help-item">高さはこの人の中での高い・低いを表します。他の人のグラフとは比べられません</span>
            <span class="hist-help-item">点線は参加しなかった回です（直前の回の高さのまま横に伸ばしています）</span>
            <span class="hist-help-item">王冠は、その回に1〜3位を取った印です</span>
            <span class="hist-help-item">点をタップすると、イベント名・属性・スコア・順位が見られます</span>
            <span class="hist-help-item">開催中のイベントは、終了後に反映されます</span>
            <span class="hist-help-item">下の順位は公開ランキングの順位です。傾向は参加した直近5回のスコアの流れから判定しています</span>
          </span>
        </span>
      </span>
      <span class="hist-sub">参加 ${sm.joined_count} 回</span>
    </div>
    <div class="hist-legend">${legend}</div>
    <div class="hist-graph" id="hist-graph"></div>
    <div class="hist-summary">
      <div><div class="l">直近${sm.recent_rank_count || 5}回の平均順位</div><div class="v">${sm.recent_avg_rank != null ? sm.recent_avg_rank.toFixed(1) + '位' : '-'}</div></div>
      <div><div class="l">最高順位</div><div class="v">${sm.best_rank != null ? sm.best_rank + '位' : '-'}</div></div>
      <div><div class="l">直近5回の傾向</div><div class="v" style="color:${trend ? trend[1] : 'inherit'}">${trend ? trend[0] : '-'}</div></div>
    </div>`;
  renderHistoryGraph(null);
  if (location.hash === '#history') card.scrollIntoView({ behavior: 'smooth' });
}

function renderHistoryGraph(openIdx) {
  const el = document.getElementById('hist-graph');
  const evs = _hist.events;
  const prevScroll = el.querySelector('.hist-scroll')?.scrollLeft;
  const H = 220, padL = 12, padR = 16, padT = 26, padB = 30, step = 26;
  const W = Math.max(el.clientWidth, padL + padR + Math.max(1, evs.length - 1) * step);
  const X = i => evs.length === 1 ? W / 2 : padL + i * ((W - padL - padR) / (evs.length - 1));
  const Y = y => padT + (1 - (0.08 + y * 0.84)) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 4; k++) { const y = padT + k * (H - padT - padB) / 4; grid += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.06)"/>`; }
  const labelEvery = evs.length <= 10 ? 1 : 5;
  let xlab = '';
  evs.forEach((e, i) => { if (e.event_number % labelEvery === 0 || evs.length <= 10) xlab += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="rgba(232,232,240,0.55)">${e.event_number}</text>`; });
  // 参加回どうしは実線、不参加の回は直前の値から点線で真横に伸ばす
  let solid = '', dotted = '', last = null;
  evs.forEach((e, i) => {
    if (!e.joined) return;
    if (last) {
      if (last.i === i - 1) solid += `M${X(last.i)} ${Y(last.y)}L${X(i)} ${Y(e.y)}`;
      else { dotted += `M${X(last.i)} ${Y(last.y)}H${X(i - 1)}`; solid += `M${X(i - 1)} ${Y(last.y)}L${X(i)} ${Y(e.y)}`; }
    }
    last = { i, y: e.y };
  });
  if (last && last.i < evs.length - 1) dotted += `M${X(last.i)} ${Y(last.y)}H${X(evs.length - 1)}`;
  const joinedPts = evs.map((e, i) => (e.joined ? [X(i), Y(e.y)] : null)).filter(Boolean);
  const area = `M${joinedPts[0][0]} ${H - padB}` + joinedPts.map(p => `L${p[0]} ${p[1]}`).join('') + `L${joinedPts.at(-1)[0]} ${H - padB}Z`;
  let points = '', hits = '';
  evs.forEach((e, i) => {
    if (!e.joined) return;
    const t = HIST_TYPES[e.event_type] || HIST_TYPES.score_attack;
    points += histShape(t.shape, X(i), Y(e.y), i === openIdx ? 6.5 : 4.5, t.color, 'stroke="#0e0c1c" stroke-width="1.5"');
    hits += `<circle class="hist-hit" cx="${X(i)}" cy="${Y(e.y)}" r="13" tabindex="0" data-i="${i}" aria-label="${escHtml(e.name)}"/>`;
  });
  // 3位以内に入った回に王冠（金・銀・銅。何回でも付く）
  const crown = evs.map((e, i) => (HIST_PODIUM[e.rank] ? histCrown(X(i), Y(e.y) - 14, HIST_PODIUM[e.rank]) : '')).join('');
  el.innerHTML = `<div class="hist-scroll"><svg class="hist-svg" width="${W}" height="${H}">
    <defs><linearGradient id="hist-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,107,128,0.28)"/><stop offset="1" stop-color="rgba(255,107,128,0)"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#hist-area)"/>
    <path d="${dotted}" fill="none" stroke="rgba(232,232,240,0.45)" stroke-width="1.6" stroke-dasharray="3 4"/>
    <path d="${solid}" fill="none" stroke="#ff6b80" stroke-width="2" stroke-linejoin="round"/>
    ${crown}${points}${xlab}${hits}</svg></div>`;
  const sc = el.querySelector('.hist-scroll');
  sc.scrollLeft = prevScroll != null ? prevScroll : sc.scrollWidth; // 初回は最新の回が見える位置
  sc.querySelectorAll('.hist-hit').forEach(h => {
    const open = () => renderHistoryGraph(Number(h.dataset.i) === openIdx ? null : Number(h.dataset.i));
    h.addEventListener('click', e => { e.stopPropagation(); open(); });
    h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
  if (openIdx == null) return;
  const e = evs[openIdx], t = HIST_TYPES[e.event_type] || HIST_TYPES.score_attack;
  const tip = document.createElement('div');
  tip.className = 'hist-tip';
  tip.innerHTML = `
    <div class="hist-tip-ev" style="color:${t.color}">${t.label}</div>
    <div class="hist-tip-name">${escHtml(e.name)}</div>
    <div class="hist-tip-row">属性 ${attrBadge(e.attribute, true)}</div>
    <div class="hist-tip-row">スコア <b>${formatScore(e.score)}</b></div>
    <div class="hist-tip-row">順位 <b>${e.rank != null ? e.rank + '位' : '-'}</b></div>
    ${HIST_PODIUM[e.rank] ? `<span class="hist-tip-best" style="background:${HIST_PODIUM[e.rank]}">${e.rank}位獲得</span>` : ''}`;
  el.appendChild(tip);
  // 点の横（右に入らなければ左）に、縦はグラフ内に収まる位置で出す
  const px = X(openIdx) - sc.scrollLeft, py = Y(e.y), tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = px + 14 + tw > el.clientWidth ? px - 14 - tw : px + 14;
  tip.style.left = Math.max(0, left) + 'px';
  tip.style.top = Math.max(0, Math.min(py - th / 2, H - th)) + 'px';
}
// グラフの外をタップしたら吹き出しを閉じる
document.addEventListener('click', e => {
  if (_hist && document.querySelector('.hist-tip') && !e.target.closest('.hist-hit')) renderHistoryGraph(null);
  if (!e.target.closest('.hist-help')) document.querySelector('.hist-help.tt-open')?.classList.remove('tt-open');
});

load();
</script>
</body>
</html>
