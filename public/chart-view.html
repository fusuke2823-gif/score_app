<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャート - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.draft-badge { font-size:0.7rem; color:#ffd580; border:1px solid #ffd58088; border-radius:4px; padding:1px 6px; }
/* メンバー（スロットごとの色で、タイムラインの行と対応させる） */
.cv-members { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:14px 0 16px; }
@media (max-width:600px) { .cv-members { grid-template-columns:repeat(2,1fr); } }
.cv-member {
  position:relative; background:var(--bg-card); border:1px solid var(--border);
  border-radius:8px; padding:7px 10px 7px 14px; min-width:0; overflow:hidden;
}
.cv-member::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--mc); }
.cv-member.has-icon { display:flex; align-items:center; gap:9px; padding-left:10px; }
.cv-member.has-icon::before { display:none; }
.cv-member-body { min-width:0; flex:1; }
.cv-face { width:38px; height:38px; border-radius:20%; object-fit:cover; flex-shrink:0; background:var(--bg-secondary); }
.cv-member-name { font-weight:bold; font-size:0.86rem; display:flex; align-items:center; gap:6px; }
.cv-member-name > span:not(.cv-slot):not(.cv-refine), .cv-member-name { white-space:nowrap; }
.cv-member-name .cv-nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
@media (max-width:600px) {
  .cv-member.has-icon { gap:7px; padding:6px 8px; }
  .cv-face { width:32px; height:32px; }
  .cv-member.has-icon .cv-member-name { font-size:0.8rem; gap:4px; }
}
.cv-member-name .cv-slot { font-size:0.68rem; color:var(--mc); font-weight:bold; }
.cv-member-style { font-size:0.72rem; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cv-refine { margin-left:auto; font-size:0.68rem; font-weight:normal; color:var(--text-muted); border:1px solid var(--border); border-radius:4px; padding:0 5px; flex-shrink:0; }

/* 表示切り替え */
.cv-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.cv-bar-title { font-size:0.85rem; font-weight:bold; color:var(--text-muted); }
.cv-seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.cv-seg button { background:transparent; border:none; color:var(--text-muted); font-size:0.75rem; padding:4px 10px; cursor:pointer; }
.cv-seg button.on { background:var(--bg-secondary); color:var(--text-primary); font-weight:bold; }

/* タイムライン */
.cv-tl { position:relative; }
.cv-turn { display:grid; grid-template-columns:78px 1fr; gap:10px; position:relative; }
.cv-turn + .cv-turn { margin-top:6px; }
.cv-turn-label {
  align-self:start; text-align:center; font-size:0.74rem; font-weight:bold; line-height:1.25;
  border:1px solid var(--tc); color:var(--tc); border-radius:6px; padding:5px 2px;
  background:var(--bg-card); position:relative; z-index:1; word-break:break-all;
}
.cv-turn-label small { display:block; font-size:0.62rem; font-weight:normal; opacity:0.85; }
.cv-tl::before { content:''; position:absolute; left:39px; top:6px; bottom:6px; width:1px; background:var(--border); }
.cv-acts { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:4px 0; min-width:0; }
.cv-act { display:grid; grid-template-columns:16px 84px 1fr; align-items:center; gap:6px; padding:5px 10px; font-size:0.85rem; }
/* 全員アイコンありなら顔だけ出して技名を広く取る */
.cv-tl.faces .cv-act { grid-template-columns:16px 28px 1fr; gap:8px; }
.cv-act + .cv-act { border-top:1px solid var(--border); }
.cv-order { color:var(--accent); font-size:0.8rem; text-align:center; }
.cv-who { display:flex; align-items:center; gap:5px; font-size:0.76rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; }
.cv-who img { width:26px; height:26px; border-radius:20%; object-fit:cover; flex-shrink:0; }
.cv-who i { width:7px; height:7px; border-radius:50%; background:var(--mc); flex-shrink:0; }
.cv-skill { min-width:0; overflow-wrap:anywhere; }
.cv-skill.style { color:#ffd580; }
.cv-skill.char { color:#7ecfff; }
.cv-skill.special { color:#e0aaff; }
.cv-target { font-size:0.72rem; color:var(--text-muted); margin-left:6px; white-space:nowrap; }
.cv-target b { color:var(--mc); font-weight:normal; }
/* PCは1ターンの行動を横に並べる */
@media (min-width:900px) {
  .cv-acts { display:grid; grid-template-columns:repeat(3,1fr); padding:0; }
  .cv-act { padding:7px 12px; }
  .cv-act + .cv-act { border-top:none; border-left:1px solid var(--border); }
  .cv-acts .cv-empty { grid-column:1 / -1; }
}
.cv-empty { padding:6px 10px; font-size:0.78rem; color:var(--text-muted); }
.cv-legend { display:flex; gap:12px; justify-content:flex-end; font-size:0.68rem; color:var(--text-muted); margin-top:10px; flex-wrap:wrap; }
.cv-legend span::before { content:''; display:inline-block; width:8px; height:8px; border-radius:2px; background:currentColor; margin-right:4px; vertical-align:middle; }

/* 表 */
.chart-table-wrap { overflow-x:auto; }
.chart-table { border-collapse:separate; border-spacing:0; width:100%; min-width:640px; font-size:0.82rem; table-layout:fixed; }
.chart-table th img { width:30px; height:30px; border-radius:20%; object-fit:cover; display:block; margin:0 auto 3px; }
.chart-table th {
  background:var(--bg-secondary); padding:7px 8px; text-align:center;
  border-bottom:1px solid var(--border); border-right:1px solid var(--border); font-size:0.78rem; font-weight:bold;
  border-top:3px solid var(--mc, transparent);
}
.chart-table td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:5px 7px; vertical-align:middle; }
.chart-table tr > :first-child { position:sticky; left:0; background:var(--bg-secondary); z-index:1; border-left:1px solid var(--border); }
.turn-label { font-size:0.76rem; font-weight:bold; text-align:center; color:var(--tc); }
.action-cell { text-align:center; font-size:0.76rem; height:40px; line-height:1.3; }
.action-order { color:var(--accent); margin-right:2px; }
.action-target { font-size:0.68rem; color:var(--text-muted); display:block; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="container" style="padding-top:20px;padding-bottom:40px">
  <a href="/charts.html" style="color:var(--text-muted);font-size:0.85rem">← チャート掲示板</a>
  <div id="content"><div class="loading" style="margin-top:24px"><div class="spinner"></div></div></div>
</main>
<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

const chartId = new URLSearchParams(location.search).get('id');
if (!chartId) { location.href = '/charts.html'; throw new Error('no id'); }

const ORDER_LABELS = ['', '①', '②', '③'];
const SLOT_COLORS = ['', '#ff6b81', '#ffa94d', '#ffe066', '#69db9c', '#5cc8ff', '#b197fc'];
const OD_COLORS = ['', '#ff9ec4', '#a8e6a3', '#ffd580', '#5b8cff', '#b46cff'];
const odTurns = gauge => Math.min(gauge, 3);
let chartData = null;
let viewMode = 'timeline';
try { viewMode = localStorage.getItem('chartViewMode') === 'table' ? 'table' : 'timeline'; } catch (e) {}

// ターンの見出し（main は大きく出す部分、sub は補足）
function turnInfo(t, normalIdx) {
  switch (t.turn_type) {
    case 'normal': return { main: `${normalIdx}ターン`, color: 'var(--text-primary)' };
    case 'extra': return { main: '追加ターン', color: '#7ecfff' };
    case 'od_pre': return { main: `OD ${t.od_index}/${odTurns(t.od_total)}`, sub: `${t.od_total}ゲージ・前`, color: OD_COLORS[t.od_total] || '#ff9ec4' };
    case 'od_post': return { main: `OD ${t.od_index}/${odTurns(t.od_total)}`, sub: `${t.od_total}ゲージ・後`, color: OD_COLORS[t.od_total] || '#ff9ec4' };
    case 'special': return { main: '特殊技', color: '#e0aaff' };
  }
  return { main: '', color: 'var(--text-muted)' };
}

function memberOf(slot) { return chartData.members.find(m => m.slot === slot); }
function faceHTML(m, size) {
  return m?.character_icon_url ? `<img src="${escHtml(chartIconUrl(m.character_icon_url, size))}" alt="${escHtml(m.character_name)}" title="${escHtml(m.character_name)}" loading="lazy">` : '';
}
function shortName(m) { return m ? (m.character_abbreviation || m.character_name) : '?'; }

function actionsSorted(t) {
  // 順番指定のある行動を先に、残りは編成順
  return [...t.actions].sort((a, b) => (a.order_num || 9) - (b.order_num || 9) || a.member_slot - b.member_slot);
}

function renderTimeline() {
  let nIdx = 0;
  const turns = chartData.turns.map(t => {
    if (t.turn_type === 'normal') nIdx++;
    const info = turnInfo(t, nIdx);
    const acts = actionsSorted(t).map(a => {
      const m = memberOf(a.member_slot);
      const tm = a.target_slot ? memberOf(a.target_slot) : null;
      const target = a.target_slot
        ? `<span class="cv-target">→ <b style="--mc:${SLOT_COLORS[a.target_slot]}">${escHtml(shortName(tm))}</b></span>` : '';
      return `<div class="cv-act">
        <span class="cv-order">${a.order_num ? ORDER_LABELS[a.order_num] : ''}</span>
        <span class="cv-who" style="--mc:${SLOT_COLORS[a.member_slot]}">${faceHTML(m, 64) ? faceHTML(m, 64) : `<i></i>${escHtml(shortName(m))}`}</span>
        <span><span class="cv-skill ${escHtml(a.skill_type || '')}">${escHtml(a.abbreviation || a.skill_name)}</span>${target}</span>
      </div>`;
    }).join('');
    return `<div class="cv-turn">
      <div class="cv-turn-label" style="--tc:${info.color}">${info.main}${info.sub ? `<small>${info.sub}</small>` : ''}</div>
      <div class="cv-acts">${acts || '<div class="cv-empty">行動なし</div>'}</div>
    </div>`;
  }).join('');
  const faces = chartData.members.every(m => m.character_icon_url);
  return `<div class="cv-tl${faces ? ' faces' : ''}">${turns}</div>`;
}

function renderTable() {
  const members = chartData.members;
  const head = members.map(m => `<th style="--mc:${SLOT_COLORS[m.slot]};line-height:1.3">${faceHTML(m, 64)}${escHtml(shortName(m))}
    <div style="font-size:0.66rem;color:var(--text-muted);font-weight:normal;margin-top:1px">${escHtml(m.style_abbreviation || m.style_name)} ${m.refine_count}凸</div></th>`).join('');
  let nIdx = 0;
  const rows = chartData.turns.map(t => {
    if (t.turn_type === 'normal') nIdx++;
    const info = turnInfo(t, nIdx);
    const bySlot = {};
    for (const a of t.actions) bySlot[a.member_slot] = a;
    const cells = members.map(m => {
      const a = bySlot[m.slot];
      if (!a) return '<td class="action-cell"></td>';
      const order = a.order_num ? `<span class="action-order">${ORDER_LABELS[a.order_num]}</span>` : '';
      const target = a.target_slot ? `<span class="action-target">→${escHtml(shortName(memberOf(a.target_slot)))}</span>` : '';
      return `<td class="action-cell">${order}<span class="cv-skill ${escHtml(a.skill_type || '')}">${escHtml(a.abbreviation || a.skill_name)}</span>${target}</td>`;
    }).join('');
    return `<tr><td><div class="turn-label" style="--tc:${info.color}">${info.main}${info.sub ? `<br><small style="font-weight:normal">${info.sub}</small>` : ''}</div></td>${cells}</tr>`;
  }).join('');
  return `<div class="chart-table-wrap"><table class="chart-table">
    <thead><tr><th style="width:84px">ターン</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderChartBody() {
  document.getElementById('cv-body').innerHTML = viewMode === 'table' ? renderTable() : renderTimeline();
  document.querySelectorAll('.cv-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === viewMode));
}

function setViewMode(mode) {
  viewMode = mode;
  try { localStorage.setItem('chartViewMode', mode); } catch (e) {}
  renderChartBody();
}

async function load() {
  const el = document.getElementById('content');
  try {
    const data = await apiFetch(`/charts/${chartId}`);
    data.members.sort((a, b) => a.slot - b.slot);
    chartData = data;
    document.title = `${data.title} - HBR`;

    const user = getUser();
    const isOwner = user?.id === data.user_id;
    const ownerBtns = isOwner ? `
      <a href="/chart-editor.html?id=${data.id}" class="btn btn-secondary btn-sm">編集</a>
      <button class="btn btn-sm" style="background:rgba(200,50,50,0.15);color:#e57373;border:1px solid #e5737366" onclick="deleteChart(${data.id})">削除</button>` : '';

    const members = data.members.map(m => `
      <div class="cv-member${m.character_icon_url ? ' has-icon' : ''}" style="--mc:${SLOT_COLORS[m.slot]}">
        ${m.character_icon_url ? `<img class="cv-face" src="${escHtml(chartIconUrl(m.character_icon_url, 96))}" alt="">` : ''}
        <div class="cv-member-body">
          <div class="cv-member-name"><span class="cv-slot">${m.slot}</span><span class="cv-nm">${escHtml(m.character_name)}</span><span class="cv-refine">${m.refine_count}凸</span></div>
          <div class="cv-member-style" title="${escHtml(m.style_name)}">${escHtml(m.style_abbreviation || m.style_name)}</div>
        </div>
      </div>`).join('');

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:12px;flex-wrap:wrap;gap:8px">
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span class="attr-badge attr-${escHtml(data.attribute)} small">${t('attr.'+data.attribute)||data.attribute}</span>
            <h2 style="font-size:1.05rem;font-weight:bold;margin:0">${escHtml(data.title)}</h2>
            <span style="font-size:0.72rem;font-family:monospace;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text-muted)">${escHtml(data.chart_code)}</span>
            ${data.is_public ? '' : '<span class="draft-badge" title="自分だけに表示されています">下書き</span>'}
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted)">
            ${escHtml(data.event_name)} &nbsp;·&nbsp;
            <a href="/user.html?id=${data.user_id}" style="color:var(--accent)">${escHtml(data.username)}</a>
            &nbsp;·&nbsp; ${new Date(data.created_at).toLocaleDateString('ja-JP')}
          </div>
        </div>
        <div style="display:flex;gap:6px">${ownerBtns}</div>
      </div>
      ${data.description ? `<div style="font-size:0.84rem;margin-top:10px;padding:8px 12px;border-left:3px solid var(--border);color:var(--text-muted);white-space:pre-wrap">${escHtml(data.description)}</div>` : ''}

      <div class="cv-members">${members}</div>

      <div class="cv-bar">
        <span class="cv-bar-title">チャート（${data.turns.length}行）</span>
        <span class="cv-seg">
          <button data-mode="timeline" onclick="setViewMode('timeline')">ターン順</button>
          <button data-mode="table" onclick="setViewMode('table')">表</button>
        </span>
      </div>
      <div id="cv-body"></div>
      <div class="cv-legend"><span style="color:#ffd580">スタイル技</span><span style="color:#7ecfff">キャラ技</span><span style="color:#e0aaff">特殊技</span></div>`;
    renderChartBody();
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error" style="margin-top:16px">${escHtml(e.message)}</div>`;
  }
}

async function deleteChart(id) {
  if (!await showConfirm(t('chart.delete_confirm'), { okLabel: t('chart.delete'), danger: true })) return;
  try {
    await apiFetch(`/charts/${id}`, { method: 'DELETE' });
    location.href = '/charts.html';
  } catch(e) { showMessage(e.message); }
}

load();
</script>
</body>
</html>
