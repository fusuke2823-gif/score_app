<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集計 - 管理</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.stat-cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
.stat-card {
  background:var(--bg-modal); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--border-light); border-radius:10px;
  padding:14px 20px; min-width:140px; flex:1;
}
.stat-card-label { font-size:0.75rem; color:var(--text-muted); margin-bottom:6px; }
.stat-card-value { font-size:1.5rem; font-weight:bold; color:var(--text-primary); }
.stat-card-sub { font-size:0.78rem; color:var(--text-muted); margin-top:4px; }

.view-tabs { display:flex; gap:6px; margin-bottom:14px; }
.view-tab {
  padding:6px 16px; border-radius:6px; border:1px solid var(--border);
  background:transparent; color:var(--text-muted); font-size:0.88rem; cursor:pointer;
}
.view-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:bold; }

.metric-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.unit-toggle { display:flex; gap:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.unit-toggle button {
  padding:6px 14px; border:none; background:transparent; color:var(--text-muted); font-size:0.82rem; cursor:pointer;
}
.unit-toggle button.active { background:var(--accent); color:#fff; font-weight:bold; }
.chart-card {
  background:var(--bg-modal); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--border-light); border-radius:10px; padding:16px; margin-bottom:20px;
}

.analytics-wrap { overflow-x:auto; margin-bottom:24px; }
.analytics-table { border-collapse:collapse; font-size:0.78rem; min-width:600px; }
.analytics-table th, .analytics-table td {
  border:1px solid var(--border); padding:5px 8px; white-space:nowrap; text-align:right;
  background:var(--bg-modal); backdrop-filter:blur(12px) saturate(150%); -webkit-backdrop-filter:blur(12px) saturate(150%);
}
.analytics-table th { text-align:center; font-weight:bold; font-size:0.72rem; }
.analytics-table td.period-cell { text-align:left; font-weight:bold; color:var(--text-primary); }
.analytics-table td.page-cell { text-align:left; color:var(--text-muted); font-size:0.75rem; padding-left:12px; }
.col-int { color:#7ecfff; }
.col-ext { color:#ff9ec4; }
.col-tot { color:var(--text-primary); }
.zero { color:var(--border); }
.section-title { font-size:0.88rem; font-weight:bold; color:var(--text-muted); margin:16px 0 8px; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="container" style="padding-top:20px;padding-bottom:40px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <h1 class="page-title" style="margin:0">集計</h1>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <a href="/admin_scores.html" class="btn btn-sm btn-secondary">スコア</a>
      <a href="/admin_events.html" class="btn btn-sm btn-secondary">イベント</a>
      <a href="/admin_users.html" class="btn btn-sm btn-secondary">ユーザー</a>
      <a href="/admin_shop.html" class="btn btn-sm btn-secondary">ショップ</a>
      <a href="/admin_distribute.html" class="btn btn-sm btn-secondary">配布</a>
      <a href="/admin_settings.html" class="btn btn-sm btn-secondary">設定</a>
      <a href="/admin_pending_videos.html" class="btn btn-sm btn-secondary">動画</a>
      <a href="/admin_chart_data.html" class="btn btn-sm btn-secondary">チャート</a>
      <span class="btn btn-sm btn-primary" style="cursor:default">集計</span>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
    <div class="view-tabs" id="range-presets" style="margin-bottom:0">
      <button class="view-tab active" onclick="setRangePreset('3m')">3ヶ月</button>
      <button class="view-tab" onclick="setRangePreset('6m')">6ヶ月</button>
      <button class="view-tab" onclick="setRangePreset('1y')">1年</button>
      <button class="view-tab" onclick="setRangePreset('all')">全期間</button>
    </div>
    <input type="date" id="range-start" class="form-input" style="width:auto;padding:5px 8px;font-size:0.85rem">
    <span style="color:var(--text-muted)">〜</span>
    <input type="date" id="range-end" class="form-input" style="width:auto;padding:5px 8px;font-size:0.85rem">
    <button class="btn btn-sm btn-primary" onclick="applyCustomRange()">適用</button>
    <label style="display:flex;align-items:center;gap:5px;font-size:0.85rem;color:var(--text-muted);cursor:pointer;margin-left:4px">
      <input type="checkbox" id="exclude-admin-toggle" onchange="toggleExcludeAdmin()">
      管理者を除外
    </label>
  </div>
  <div style="margin-bottom:12px"><span id="period-label" style="font-size:0.8rem;color:var(--text-muted)"></span></div>

  <div class="stat-cards" id="stat-cards">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('daily')">日別</button>
    <button class="view-tab" onclick="switchView('weekly')">週間</button>
    <button class="view-tab" onclick="switchView('monthly')">月間</button>
  </div>

  <div class="metric-row">
    <select id="metric-select" class="form-input" style="width:auto;min-width:200px" onchange="onMetricChange()">
      <option value="">集計項目を選択してください</option>
    </select>
    <div id="unit-toggle" class="unit-toggle" style="display:none">
      <button class="active" onclick="setUnit('u')">人数</button>
      <button onclick="setUnit('h')">回数</button>
    </div>
    <div id="cumulative-toggle" class="unit-toggle" style="display:none">
      <button class="active" onclick="setCumulative(false)">期間ごと</button>
      <button onclick="setCumulative(true)">累計</button>
    </div>
  </div>

  <div id="metric-area">
    <div class="empty-state"><p>集計項目を選択すると、ここに折れ線グラフが表示されます</p></div>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
renderNav();
if (!requireAdmin()) throw new Error('redirect');

let data = null;
let currentView = 'daily';
let selectedMetric = '';
let selectedUnit = 'u';
let selectedCumulative = false;
let allPages = [];

const SERIES_DEFS = [
  { key: 'int', label: '内部', color: '#7ecfff' },
  { key: 'ext', label: '外部', color: '#ff9ec4' },
  { key: 'tot', label: '合計', color: '#e8e8f0' },
];

const PAGE_LABELS = {
  '/index.html': 'トップ', '/': 'トップ',
  '/submit.html': 'スコア投稿', '/videos.html': '動画掲示板',
  '/my-videos.html': '動画管理', '/charts.html': 'チャート掲示板',
  '/chart-editor.html': 'チャート作成', '/chart-manage.html': 'マイチャート',
  '/chart-view.html': 'チャート表示', '/shop.html': 'ショップ',
  '/feedback.html': 'お便り箱', '/user.html': 'ユーザー',
  '/login.html': 'ログイン', '/register.html': '新規登録',
  '/rate-ranking.html': 'レートランキング', '/ranking.html': 'ランキング',
  '/gacha.html': 'ガチャ', '/privacy.html': 'プライバシー', '/terms.html': '利用規約',
};
function pageLabel(p) { return PAGE_LABELS[p] || p.replace(/^\//, '').replace(/\.html$/, ''); }

function isoDate(d) { return d.toISOString().split('T')[0]; }

let currentStart, currentEnd;

function setRangePreset(preset) {
  document.querySelectorAll('#range-presets .view-tab').forEach((b, i) => {
    b.classList.toggle('active', ['3m', '6m', '1y', 'all'][i] === preset);
  });
  const end = isoDate(new Date());
  let start;
  if (preset === 'all') {
    start = 'all';
  } else {
    const d = new Date();
    if (preset === '3m') d.setMonth(d.getMonth() - 3);
    else if (preset === '6m') d.setMonth(d.getMonth() - 6);
    else if (preset === '1y') d.setFullYear(d.getFullYear() - 1);
    start = isoDate(d);
  }
  document.getElementById('range-start').value = start === 'all' ? '' : start;
  document.getElementById('range-end').value = end;
  load(start, end);
}

function applyCustomRange() {
  document.querySelectorAll('#range-presets .view-tab').forEach(b => b.classList.remove('active'));
  const start = document.getElementById('range-start').value || undefined;
  const end = document.getElementById('range-end').value || undefined;
  load(start, end);
}

function toggleExcludeAdmin() {
  load(currentStart, currentEnd);
}

async function load(start, end) {
  currentStart = start;
  currentEnd = end;
  try {
    const excludeAdmin = document.getElementById('exclude-admin-toggle').checked;
    const qs = [];
    if (start) qs.push(`start=${encodeURIComponent(start)}`);
    if (end) qs.push(`end=${encodeURIComponent(end)}`);
    if (excludeAdmin) qs.push('excludeAdmin=1');
    data = await apiFetch(`/analytics/summary${qs.length ? '?' + qs.join('&') : ''}`);
    document.getElementById('period-label').textContent =
      `${data.period.start} 〜 ${data.period.end}`;
    document.getElementById('range-start').value = data.period.start;
    document.getElementById('range-end').value = data.period.end;

    const u = data.users;
    document.getElementById('stat-cards').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-label">総ユーザー数</div>
        <div class="stat-card-value">${u.tot_n}</div>
        <div class="stat-card-sub">
          <span class="col-int">内部 ${u.int_n}</span> &nbsp;
          <span class="col-ext">外部 ${u.ext_n}</span>
        </div>
      </div>`;

    // 全期間のページ一覧を収集
    const pageSet = new Set();
    for (const key of ['daily','weekly','monthly'])
      for (const row of data[key]) Object.keys(row.pages).forEach(p => pageSet.add(p));
    allPages = [...pageSet].sort((a, b) => {
      const order = ['/index.html','/','/submit.html','/videos.html','/my-videos.html',
        '/charts.html','/chart-editor.html','/chart-manage.html','/chart-view.html',
        '/shop.html','/feedback.html','/user.html','/login.html','/register.html'];
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    renderMetricOptions();
    renderMetric();
  } catch (e) {
    document.getElementById('stat-cards').innerHTML =
      `<div class="alert alert-error">${escHtml(e.message)}</div>`;
  }
}

function renderMetricOptions() {
  const sel = document.getElementById('metric-select');
  const keepSelection = selectedMetric && (selectedMetric === '__newusers__' || allPages.includes(selectedMetric));
  sel.innerHTML = `
    <option value="">集計項目を選択してください</option>
    <option value="__newusers__">新規登録</option>
    ${allPages.map(p => `<option value="${escHtml(p)}">${escHtml(pageLabel(p))}のページビュー</option>`).join('')}
  `;
  sel.value = keepSelection ? selectedMetric : '';
  if (!keepSelection) selectedMetric = '';
}

function onMetricChange() {
  selectedMetric = document.getElementById('metric-select').value;
  const isNewUsers = selectedMetric === '__newusers__';
  document.getElementById('unit-toggle').style.display = (selectedMetric && !isNewUsers) ? 'flex' : 'none';
  document.getElementById('cumulative-toggle').style.display = isNewUsers ? 'flex' : 'none';
  renderMetric();
}

function setCumulative(v) {
  selectedCumulative = v;
  document.querySelectorAll('#cumulative-toggle button').forEach((b, i) => {
    b.classList.toggle('active', [false, true][i] === v);
  });
  renderMetric();
}

function setUnit(u) {
  selectedUnit = u;
  document.querySelectorAll('#unit-toggle button').forEach((b, i) => {
    b.classList.toggle('active', ['u', 'h'][i] === u);
  });
  renderMetric();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach((b, i) => {
    b.classList.toggle('active', ['daily','weekly','monthly'][i] === view);
  });
  renderMetric();
}

function fmt(n) {
  return n === 0 ? `<span class="zero">-</span>` : n.toLocaleString();
}

function periodLabel(period) {
  const d = new Date(period);
  if (currentView === 'daily') return `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  if (currentView === 'weekly') {
    const e = new Date(d); e.setUTCDate(e.getUTCDate() + 6);
    return `${d.getUTCMonth()+1}/${d.getUTCDate()}〜${e.getUTCMonth()+1}/${e.getUTCDate()}`;
  }
  return `${d.getUTCFullYear()}/${d.getUTCMonth()+1}月`;
}

// 期間キー（表示ラベルではなく一意なISO日付。月表示は年をまたぐと表示ラベルが重複するため）
function periodKey(period) {
  return new Date(period).toISOString().slice(0, 10);
}

// 表示範囲内の全期間（データが無い期間も0で埋めるために生成）
function getAllPeriods() {
  if (!data) return [];
  const start = new Date(data.period.start);
  const end = new Date(data.period.end);
  const periods = [];
  if (currentView === 'daily') {
    for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) periods.push(new Date(d));
  } else if (currentView === 'weekly') {
    const d = new Date(start);
    d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    for (; d <= end; d.setUTCDate(d.getUTCDate() + 7)) periods.push(new Date(d));
  } else {
    for (let d = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1)); d <= end; d.setUTCMonth(d.getUTCMonth() + 1))
      periods.push(new Date(d));
  }
  return periods;
}

function buildMetricSeries() {
  const periods = getAllPeriods();
  const rowMap = new Map(data[currentView].map(r => [periodKey(r.period), r]));
  const labels = periods.map(p => periodLabel(p.toISOString()));

  if (selectedMetric === '__newusers__') {
    const get = (p, k) => (rowMap.get(periodKey(p.toISOString())) || {})[k] || 0;
    if (selectedCumulative) {
      const baseline = data.baselineUsers || { int_n: 0, ext_n: 0, tot_n: 0 };
      return {
        labels,
        series: SERIES_DEFS.map(sd => {
          let running = Number(baseline[`${sd.key}_n`]) || 0;
          return {
            ...sd,
            values: periods.map(p => (running += get(p, `new_${sd.key}`))),
          };
        }),
      };
    }
    return {
      labels,
      series: SERIES_DEFS.map(sd => ({
        ...sd,
        values: periods.map(p => get(p, `new_${sd.key}`)),
      })),
    };
  }

  const unitKeys = selectedUnit === 'u' ? { int: 'iu', ext: 'eu', tot: 'tu' } : { int: 'ih', ext: 'eh', tot: 'th' };
  const get = (p, seriesKey) => {
    const row = rowMap.get(periodKey(p.toISOString()));
    const m = row ? row.pages[selectedMetric] : null;
    return m ? (m[unitKeys[seriesKey]] || 0) : 0;
  };
  return {
    labels,
    series: SERIES_DEFS.map(sd => ({
      ...sd,
      values: periods.map(p => get(p, sd.key)),
    })),
  };
}

function niceCeil(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  const nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return nice * mag;
}

function renderMetric() {
  const area = document.getElementById('metric-area');
  if (!data || !selectedMetric) {
    area.innerHTML = `<div class="empty-state"><p>集計項目を選択すると、ここに折れ線グラフが表示されます</p></div>`;
    return;
  }
  const { labels, series } = buildMetricSeries();
  const hasData = series.some(s => s.values.some(v => v > 0));

  area.innerHTML = `
    <div class="chart-card"><div id="chart-container"></div></div>
    <div class="analytics-wrap">
      <table class="analytics-table">
        <thead><tr>
          <th style="text-align:left">期間</th>
          <th class="col-int">内部</th><th class="col-ext">外部</th><th class="col-tot">合計</th>
        </tr></thead>
        <tbody>${labels.map((lb, i) => `
          <tr>
            <td class="period-cell">${escHtml(lb)}</td>
            <td>${fmt(series[0].values[i])}</td><td>${fmt(series[1].values[i])}</td><td>${fmt(series[2].values[i])}</td>
          </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:12px">データなし</td></tr>`}
        </tbody>
      </table>
    </div>`;

  if (hasData) {
    renderLineChart(document.getElementById('chart-container'), labels, series);
  } else {
    document.getElementById('chart-container').innerHTML =
      `<div class="empty-state" style="padding:32px"><p>この期間はデータがありません</p></div>`;
  }
}

function renderLineChart(container, labels, series) {
  const W = 760, H = 260, padL = 46, padR = 16, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = labels.length;
  const maxV = niceCeil(Math.max(1, ...series.flatMap(s => s.values)));
  const x = i => n <= 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
  const y = v => padT + plotH - (v / maxV) * plotH;

  let gridSvg = '', axisSvg = '';
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const v = maxV * s / steps;
    const yy = y(v);
    gridSvg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    axisSvg += `<text x="${padL - 8}" y="${(yy + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8888aa">${Math.round(v).toLocaleString()}</text>`;
  }

  const labelStep = Math.max(1, Math.ceil(n / 9));
  let xLabelsSvg = '';
  labels.forEach((lb, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return;
    xLabelsSvg += `<text x="${x(i).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="#8888aa">${escHtml(lb)}</text>`;
  });

  let linesSvg = '', pointsSvg = '';
  series.forEach(s => {
    const d = s.values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    linesSvg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => {
      pointsSvg += `<circle class="chart-pt" data-idx="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.color}" opacity="0"/>`;
    });
  });

  const legendHtml = series.map(s => `
    <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px">
      <span style="width:9px;height:9px;border-radius:50%;background:${s.color};display:inline-block"></span>
      <span style="font-size:0.78rem;color:var(--text-secondary)">${escHtml(s.label)}</span>
    </span>`).join('');

  container.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;margin-bottom:6px">${legendHtml}</div>
    <div style="position:relative">
      <svg id="chart-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
        ${gridSvg}
        <line x1="${padL}" y1="${(padT + plotH).toFixed(1)}" x2="${W - padR}" y2="${(padT + plotH).toFixed(1)}" stroke="var(--border-light)" stroke-width="1"/>
        ${axisSvg}
        ${xLabelsSvg}
        ${linesSvg}
        <line id="chart-guide" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="var(--border-light)" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>
        ${pointsSvg}
        <rect id="chart-hit" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>
      </svg>
      <div id="chart-tooltip" style="position:absolute;display:none;pointer-events:none;background:var(--bg-modal);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--border-light);border-radius:8px;padding:8px 10px;font-size:0.76rem;color:var(--text-primary);white-space:nowrap;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,0.4)"></div>
    </div>`;

  const svg = container.querySelector('#chart-svg');
  const hit = container.querySelector('#chart-hit');
  const guide = container.querySelector('#chart-guide');
  const tooltip = container.querySelector('#chart-tooltip');

  function handleMove(evt) {
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    if (clientX == null) return;
    const relX = ((clientX - rect.left) / rect.width) * W;
    let idx = n <= 1 ? 0 : Math.round(((relX - padL) / plotW) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    const xi = x(idx);
    guide.style.display = '';
    guide.setAttribute('x1', xi.toFixed(1));
    guide.setAttribute('x2', xi.toFixed(1));
    container.querySelectorAll('.chart-pt').forEach(c => {
      c.setAttribute('opacity', c.dataset.idx == idx ? '1' : '0');
    });
    const rows = series.map(s => `
      <div style="display:flex;justify-content:space-between;gap:14px">
        <span style="color:${s.color}">${escHtml(s.label)}</span>
        <span style="font-variant-numeric:tabular-nums">${s.values[idx].toLocaleString()}</span>
      </div>`).join('');
    tooltip.innerHTML = `<div style="font-weight:bold;margin-bottom:4px;color:var(--text-primary)">${escHtml(labels[idx])}</div>${rows}`;
    tooltip.style.display = 'block';
    const scale = rect.width / W;
    let left = xi * scale + 10;
    if (left + 140 > rect.width) left = xi * scale - 150;
    tooltip.style.left = Math.max(0, left) + 'px';
    tooltip.style.top = '2px';
  }
  function handleLeave() {
    guide.style.display = 'none';
    container.querySelectorAll('.chart-pt').forEach(c => c.setAttribute('opacity', '0'));
    tooltip.style.display = 'none';
  }
  hit.addEventListener('mousemove', handleMove);
  hit.addEventListener('mouseleave', handleLeave);
  hit.addEventListener('touchstart', handleMove, { passive: true });
  hit.addEventListener('touchmove', handleMove, { passive: true });
  hit.addEventListener('touchend', handleLeave);
}

load();
</script>
</body>
