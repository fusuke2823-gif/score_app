<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>ログイン - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<nav id="nav"></nav>
<div class="auth-wrap">
  <div class="auth-card card">
    <div id="auth-entry">
      <div class="auth-switch" role="navigation" aria-label="ログインと新規登録">
        <a href="/login.html" aria-current="page" data-i18n="login.title">ログイン</a>
        <a href="/register.html" data-i18n="register.title">新規登録</a>
      </div>
      <h1 class="auth-sr" data-i18n="login.title">ログイン</h1>
      <p class="auth-lead" data-i18n="auth.login_lead">スコアの投稿やガチャを楽しむにはログインしてください</p>
      <div id="alert" aria-live="polite"></div>
      <div class="auth-google" id="auth-google" hidden>
        <div class="auth-google-btn" id="google-btn-wrap"></div>
        <div class="auth-or" data-i18n="auth.or_id">またはIDとパスワードで</div>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username" data-i18n="login.username">ユーザー名またはログインID</label>
          <input class="form-input" type="text" id="username" required autocomplete="username" autocapitalize="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label class="form-label" for="password" data-i18n="login.password">パスワード</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle"></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-wide auth-submit" id="submit-btn" data-i18n="login.btn">ログイン</button>
      </form>
      <p class="auth-terms" id="auth-forgot" hidden><span class="auth-nb" data-i18n="auth.forgot_pre">パスワードを忘れた方は</span><span class="auth-nb"><span data-i18n="auth.forgot_x">Xの</span><a id="auth-forgot-link" target="_blank" rel="noopener noreferrer"></a><span data-i18n="auth.forgot_post">へご連絡ください</span></span></p>
    </div>
    <div id="auth-setup" hidden></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth-flow.js"></script>
<script>
if (getToken()) location.replace(authBackTo());
else {
  renderNav();
  applyI18n();
  initAuthPage('login');
}
</script>
</body>
</html>
