<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイチャート - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.event-group-header { font-size:0.85rem; font-weight:bold; color:var(--text-muted); margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
.event-group-header::after { content:''; flex:1; height:1px; background:var(--border); }
.event-group-header small { font-weight:normal; font-size:0.72rem; }
.chart-card-actions .danger { background:rgba(200,50,50,0.15); color:#e57373; border:1px solid #e5737366; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="container" style="padding-top:20px;padding-bottom:40px">
  <a onclick="history.back()" style="color:var(--text-muted);font-size:0.85rem;cursor:pointer">← 戻る</a>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;margin-top:12px">
    <h2 style="font-size:1.1rem;font-weight:bold;margin:0" data-i18n="chart.my_charts">マイチャート</h2>
    <a href="/chart-editor.html" class="btn btn-primary btn-sm" data-i18n="chart.new">+ 新規作成</a>
  </div>
  <div id="list"><div class="loading"><div class="spinner"></div></div></div>
</main>
<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

const user = getUser();

async function load() {
  const el = document.getElementById('list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const items = await apiFetch(`/charts?user_id=${user.id}`);
    if (!items.length) {
      el.innerHTML = `<p style="color:var(--text-muted);padding:8px 0">${t('chart.no_charts')}</p>`;
      return;
    }
    const groups = new Map();
    for (const c of items) {
      if (!groups.has(c.event_id)) groups.set(c.event_id, { name: c.event_name, items: [] });
      groups.get(c.event_id).items.push(c);
    }
    const actions = c => `
      <a href="/chart-editor.html?id=${c.id}" class="btn btn-secondary btn-sm">${t('chart.edit')}</a>
      <button class="btn btn-sm danger" onclick="deleteChart(${c.id})">${t('chart.delete')}</button>`;
    const html = [...groups.values()].map(g => `
      <div class="event-group-header">${escHtml(g.name)}<small>${g.items.length}</small></div>
      <div class="chart-list">${g.items.map(c => chartCardHTML(c, { actions: actions(c), showDraft: true })).join('')}</div>`).join('');
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(e.message)}</div>`;
  }
}

async function deleteChart(id) {
  if (!await showConfirm(t('chart.delete_confirm'), { okLabel: t('chart.delete'), danger: true })) return;
  try {
    await apiFetch(`/charts/${id}`, { method: 'DELETE' });
    load();
  } catch(e) { showMessage(e.message); }
}

load();
</script>
</body>
</html>
