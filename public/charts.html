<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャート掲示板 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.chart-list { display:grid; grid-template-columns:1fr; gap:8px; }
@media (min-width:860px) { .chart-list { grid-template-columns:1fr 1fr; } }
.chart-card {
  position:relative; display:block; background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px 10px 16px; color:var(--text-primary); text-decoration:none; overflow:hidden; min-width:0;
  transition:border-color 0.15s, background 0.15s;
}
.chart-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--ac); }
.chart-card:hover { border-color:var(--ac); background:var(--bg-secondary); text-decoration:none; color:var(--text-primary); }
.chart-card-top { display:flex; align-items:center; gap:8px; min-width:0; }
.chart-card-title { font-weight:bold; font-size:0.92rem; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chart-code-badge { font-size:0.68rem; font-family:monospace; letter-spacing:0.05em; background:var(--bg-secondary); border:1px solid var(--border); border-radius:4px; padding:1px 6px; color:var(--text-muted); flex-shrink:0; }
.chart-faces { display:flex; gap:5px; margin:8px 0 7px; }
.chart-face { display:flex; flex-direction:column; align-items:center; gap:2px; width:calc((100% - 25px) / 6); max-width:52px; min-width:0; }
.chart-face img, .chart-face .ph { width:100%; aspect-ratio:1; border-radius:20%; object-fit:cover; background:var(--bg-secondary); }
.chart-face .ph { display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:bold; color:var(--text-muted); border:1px dashed var(--border); }
.chart-face span { font-size:0.58rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.chart-card-meta { font-size:0.74rem; color:var(--text-muted); display:flex; gap:6px; align-items:center; min-width:0; }
.chart-card-meta > span { white-space:nowrap; flex-shrink:0; }
.chart-card-meta .user { color:var(--accent); }
.chart-card-meta .desc { flex-shrink:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.event-group-header { font-size:0.85rem; font-weight:bold; color:var(--text-muted); margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
.event-group-header::after { content:''; flex:1; height:1px; background:var(--border); }
.event-group-header small { font-weight:normal; font-size:0.72rem; }
.filter-bar { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.filter-bar .search { flex:1 1 220px; min-width:0; }
.filter-bar select { flex:1 1 180px; max-width:260px; min-width:0; }
@media (max-width:600px) { .filter-bar select { max-width:none; } }
.filter-attrs { display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
.filter-attrs .attr-btn { padding:4px 13px; font-size:0.82rem; }
.filter-reset { margin-left:auto; background:none; border:none; color:var(--text-muted); font-size:0.8rem; cursor:pointer; padding:4px; }
.filter-reset:hover { color:var(--text-primary); }
.result-count { font-size:0.75rem; color:var(--text-muted); }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="container" style="padding-top:20px;padding-bottom:40px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <h2 style="font-size:1.1rem;font-weight:bold;margin:0" data-i18n="chart.board">チャート掲示板</h2>
    <div style="display:flex;gap:6px">
      <a id="new-chart-btn" href="/chart-editor.html" class="btn btn-primary btn-sm" style="display:none">+ 新規作成</a>
      <a href="/chart-manage.html" class="btn btn-secondary btn-sm" data-i18n="chart.my_charts">マイチャート</a>
    </div>
  </div>

  <!-- フィルター -->
  <div class="filter-bar">
    <input id="q-input" class="form-input search" type="search" data-i18n-ph="chart.search_any" placeholder="ID・タイトル・ユーザー名で検索" maxlength="50">
    <select id="event-select" class="form-input" onchange="search()">
      <option value="" data-i18n="chart.all_events">全イベント</option>
    </select>
  </div>
  <div class="filter-attrs">
    <div style="display:flex;gap:5px;flex-wrap:wrap" id="attr-btns"></div>
    <button class="filter-reset" id="reset-btn" onclick="reset()" style="display:none" data-i18n="chart.reset">リセット</button>
  </div>

  <div id="list"><div class="loading"><div class="spinner"></div></div></div>
</main>
<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();

const user = getUser();
if (!user || user.role !== 'admin') {
  document.querySelector('main').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;gap:16px">
      <div style="color:var(--text-secondary)">${uiIcon('wrench')}</div>
      <div style="font-size:1.2rem;font-weight:bold;color:var(--text-primary)">準備中</div>
      <div style="font-size:0.88rem;color:var(--text-muted)">チャート掲示板およびチャート作成ツールは現在準備中です。<br>もうしばらくお待ちください。</div>
    </div>`;
  throw new Error('coming soon');
}
if (user) document.getElementById('new-chart-btn').style.display = '';

const ATTRS = ['火','氷','雷','光','闇','無'];
let selectedAttr = '';

// 属性ボタン
document.getElementById('attr-btns').innerHTML = ATTRS.map(a =>
  `<button class="attr-btn attr-${escHtml(a)}" data-attr="${escHtml(a)}" onclick="toggleAttr('${escHtml(a)}')">${t('attr.'+a)||a}</button>`
).join('');

function toggleAttr(a) {
  selectedAttr = selectedAttr === a ? '' : a;
  document.querySelectorAll('#attr-btns .attr-btn').forEach(b => b.classList.toggle('active', b.dataset.attr === selectedAttr));
  search();
}

async function loadEvents() {
  try {
    const events = await apiFetch('/events');
    const sel = document.getElementById('event-select');
    events.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id; opt.textContent = e.name;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

// 入力が止まってから検索する
let searchTimer = null;
document.getElementById('q-input').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 350); });

function search() {
  const q = document.getElementById('q-input').value.trim();
  const event_id = document.getElementById('event-select').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (event_id) params.set('event_id', event_id);
  if (selectedAttr) params.set('attribute', selectedAttr);
  document.getElementById('reset-btn').style.display = params.toString() ? '' : 'none';
  load(params.toString());
}

function reset() {
  document.getElementById('q-input').value = '';
  document.getElementById('event-select').value = '';
  selectedAttr = '';
  document.querySelectorAll('#attr-btns .attr-btn').forEach(b => b.classList.remove('active'));
  search();
}

const ATTR_COLOR = { '火': 'var(--fire)', '氷': 'var(--ice)', '雷': 'var(--thunder)', '光': 'var(--light)', '闇': 'var(--dark)', '無': 'var(--none)' };

function cardHTML(c) {
  const bySlot = {};
  (c.members || []).forEach(m => { bySlot[m.slot] = m; });
  const faces = [1, 2, 3, 4, 5, 6].map(slot => {
    const m = bySlot[slot];
    if (!m) return '<div class="chart-face"><div class="ph"></div><span>&nbsp;</span></div>';
    const short = m.abbreviation || m.name;
    const img = m.icon_url
      ? `<img src="${escHtml(chartIconUrl(m.icon_url, 104))}" alt="${escHtml(m.name)}" title="${escHtml(m.name)} / ${escHtml(m.style)} ${m.refine_count}凸" loading="lazy">`
      : `<div class="ph" title="${escHtml(m.name)}">${escHtml(short.charAt(0))}</div>`;
    return `<div class="chart-face">${img}<span>${escHtml(m.style || short)}</span></div>`;
  }).join('');
  return `
    <a class="chart-card" href="/chart-view.html?id=${c.id}" style="--ac:${ATTR_COLOR[c.attribute] || 'var(--border)'}">
      <div class="chart-card-top">
        <span class="attr-badge attr-${escHtml(c.attribute)} small" style="flex-shrink:0">${t('attr.' + c.attribute) || c.attribute}</span>
        <span class="chart-card-title">${escHtml(c.title)}</span>
        <span class="chart-code-badge">${escHtml(c.chart_code)}</span>
      </div>
      <div class="chart-faces">${faces}</div>
      <div class="chart-card-meta">
        <span class="user">${escHtml(c.username)}</span>
        <span>${new Date(c.created_at).toLocaleDateString('ja-JP')}</span>
        <span>${t('chart.turns').replace('{n}', c.turn_count || 0)}</span>
        ${c.description ? `<span class="desc">${escHtml(c.description)}</span>` : ''}
      </div>
    </a>`;
}

async function load(qs) {
  const el = document.getElementById('list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const items = await apiFetch('/charts' + (qs ? '?' + qs : ''));
    if (!items.length) {
      el.innerHTML = `<p style="color:var(--text-muted);padding:16px 0">${t('chart.no_charts')}</p>`;
      return;
    }
    // イベント別グループ
    const groups = new Map();
    for (const c of items) {
      if (!groups.has(c.event_id)) groups.set(c.event_id, { name: c.event_name, items: [] });
      groups.get(c.event_id).items.push(c);
    }
    el.innerHTML = [...groups.values()].map(g => `
      <div class="event-group-header">${escHtml(g.name)}<small>${g.items.length}</small></div>
      <div class="chart-list">${g.items.map(cardHTML).join('')}</div>`).join('');
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(e.message)}</div>`;
  }
}

loadEvents();
load('');
</script>
</body>
</html>
