<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>新規登録 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<nav id="nav"></nav>
<div class="auth-wrap">
  <div class="auth-card card">
    <div id="auth-entry">
      <div class="auth-switch" role="navigation" aria-label="ログインと新規登録">
        <a href="/login.html" data-i18n="login.title">ログイン</a>
        <a href="/register.html" aria-current="page" data-i18n="register.title">新規登録</a>
      </div>
      <h1 class="auth-sr" data-i18n="register.title">新規登録</h1>
      <span class="auth-badge" id="internal-badge" hidden data-i18n="register.internal_badge">内部メンバー登録</span>
      <p class="auth-lead" data-i18n="auth.register_lead">スコアを投稿してランキングに参加しましょう</p>
      <div id="alert" aria-live="polite"></div>
      <div class="auth-google" id="auth-google" hidden>
        <div class="auth-google-btn" id="google-btn-wrap"></div>
        <p class="auth-google-note" id="auth-google-note" data-i18n="auth.google_note">Googleならパスワードを覚えなくても始められます</p>
        <div class="auth-or" data-i18n="auth.or_id">またはIDとパスワードで</div>
      </div>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="user-code" data-i18n="register.login_id">ログインID</label>
          <input class="form-input" type="text" id="user-code" required maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false" aria-describedby="rule-id">
          <p class="auth-rule" id="rule-id"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg><span data-i18n="auth.rule_id">英数字と _ で4〜20文字（あとから変更できます）</span></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="password" data-i18n="register.password">パスワード</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="password" required autocomplete="new-password" aria-describedby="rule-pw">
            <button type="button" class="pw-toggle"></button>
          </div>
          <p class="auth-rule" id="rule-pw"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg><span data-i18n="register.password_hint">6文字以上</span></p>
        </div>
        <button type="submit" class="btn btn-primary btn-wide auth-submit" id="submit-btn" data-i18n="auth.next">次へ</button>
      </form>
      <p class="auth-terms"><span class="auth-nb"><span data-i18n="auth.terms_pre">登録すると</span><a href="/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">利用規約</a><span data-i18n="auth.terms_and">と</span></span><span class="auth-nb"><a href="/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">プライバシーポリシー</a><span data-i18n="auth.terms_post">に</span></span><span class="auth-nb" data-i18n="auth.terms_end">同意したものとみなします</span></p>
    </div>
    <div id="auth-setup" hidden></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth-flow.js"></script>
<script>
if (getToken()) location.replace(authBackTo());
else {
  renderNav();
  applyI18n();
  initAuthPage('register');
}
</script>
</body>
</html>
