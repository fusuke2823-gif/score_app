<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャート編集 - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.section-label { font-size:0.82rem; font-weight:bold; color:var(--text-muted); margin:22px 0 8px; display:flex; align-items:center; gap:8px; }
.pub-line { display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
.pub-line #save-btn { margin-left:auto; flex-shrink:0; white-space:nowrap; }
.pub-row { display:flex; align-items:center; gap:12px; cursor:pointer; min-width:0; }
.pub-row input { display:none; }
.pub-switch { width:40px; height:22px; border-radius:11px; background:var(--bg-secondary); border:1px solid var(--border); position:relative; flex-shrink:0; transition:background 0.15s; }
.pub-switch::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-muted); transition:transform 0.15s, background 0.15s; }
.pub-row input:checked + .pub-switch { background:var(--accent); border-color:var(--accent); }
.pub-row input:checked + .pub-switch::after { transform:translateX(18px); background:#fff; }
.pub-text { font-size:0.86rem; font-weight:bold; }
.pub-text small { display:block; font-weight:normal; font-size:0.72rem; color:var(--text-muted); margin-top:1px; }
.section-label small { font-weight:normal; font-size:0.72rem; }

/* 顔（アイコン、なければスロット色の四角に頭文字） */
.face { width:var(--fs,32px); height:var(--fs,32px); border-radius:20%; object-fit:cover; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-secondary); color:#fff; font-weight:bold; font-size:calc(var(--fs,32px) * 0.45); overflow:hidden; }
.face.ph { background:color-mix(in srgb, var(--mc, #666) 45%, #1a1a2e); }

/* メンバー */
.ce-members { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
@media (max-width:600px) { .ce-members { grid-template-columns:repeat(2,1fr); } }
.ce-member { display:flex; align-items:center; gap:9px; padding:8px 10px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; cursor:pointer; min-width:0; text-align:left; color:var(--text-primary); font:inherit; }
.ce-member:hover { border-color:var(--mc); }
.ce-member.empty { border-style:dashed; color:var(--text-muted); }
.ce-member-body { min-width:0; flex:1; }
.ce-member-name { font-weight:bold; font-size:0.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ce-member-sub { font-size:0.72rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

/* ターン */
.ce-turn { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:8px 10px 10px; }
.ce-turn + .ce-turn { margin-top:8px; }
.ce-turn-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ce-turn-label { font-size:0.76rem; font-weight:bold; color:var(--tc); border:1px solid var(--tc); border-radius:6px; padding:2px 8px; }
.ce-turn-count { font-size:0.7rem; color:var(--text-muted); }
.ce-turn-del { margin-left:auto; background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px 4px; display:flex; }
.ce-turn-del:hover { color:#e57373; }
.ce-tiles { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
.ce-tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px 5px; border-radius:7px; border:1px solid var(--border); background:var(--bg-secondary); cursor:pointer; min-width:0; color:var(--text-primary); font:inherit; }
.ce-tile:hover { border-color:var(--border-light); }
.ce-tile.on { background:rgba(255,255,255,0.06); }
.ce-tile.off { opacity:0.28; cursor:default; }
.ce-tile.off:hover { border-color:var(--border); }
.ce-tile .face { --fs:30px; }
.ce-tile:not(.on) .face { filter:grayscale(0.6); opacity:0.7; }
.ce-tile-text { display:flex; flex-direction:column; align-items:center; gap:2px; width:100%; min-width:0; }
.ce-tiles.full { grid-template-columns:repeat(3,1fr); }
/* 横並び（PCは常に、スマホは3人そろったターン） */
.ce-tiles.full .ce-tile { flex-direction:row; align-items:center; gap:7px; padding:6px 8px; }
.ce-tiles.full .ce-tile-text { align-items:flex-start; }
.ce-tiles.full .ce-tile-skill, .ce-tiles.full .ce-tile-target { text-align:left; }
.ce-tiles.full .ce-tile-skill { min-height:0; font-size:0.72rem; }
.ce-tile-skill { font-size:0.64rem; line-height:1.25; text-align:center; width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; min-height:1.6em; }
.ce-tile-skill.none { color:var(--text-muted); opacity:0.6; }
.ce-tile-target { font-size:0.58rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }
.ce-tile-order { position:absolute; top:3px; left:3px; display:flex; align-items:center; justify-content:center; box-sizing:border-box; width:17px; height:17px; border-radius:50%; border:1.5px solid #fff; color:#fff; font-size:0.66rem; font-weight:bold; line-height:1; background:rgba(0,0,0,0.35); }
/* スマホ：左上に小さく顔、その下に技名 */
@media (max-width:699px) {
  .ce-tile, .ce-tiles.full .ce-tile { flex-direction:column; align-items:flex-start; gap:4px; padding:5px 6px 6px; }
  .ce-tile .face { --fs:22px !important; }
  .ce-tile-text, .ce-tiles.full .ce-tile-text { align-items:flex-start; }
  .ce-tile-skill, .ce-tile-target { text-align:left; }
  .ce-tile-skill { font-size:0.66rem; min-height:0; -webkit-line-clamp:3; }
  .ce-tiles.full .ce-tile-skill { font-size:0.74rem; }
  .ce-tile-order { left:auto; right:4px; top:5px; }
  .ce-tile-skill.none { align-self:center; font-size:0.8rem; }
}
@media (min-width:700px) {
  .ce-tile { flex-direction:row; align-items:center; gap:8px; padding:7px 9px; }
  .ce-tile .face { --fs:34px; }
  .ce-tile-text { align-items:flex-start; }
  .ce-tile-skill, .ce-tile-target { text-align:left; }
  .ce-tile-skill { font-size:0.8rem; min-height:0; }
  .ce-tiles.full .ce-tile-skill { font-size:0.8rem; }
  .ce-tile-target { font-size:0.68rem; }
}
.sk-style, .sk-item.sk-style { color:#ffd580; } .sk-char, .sk-item.sk-char { color:#7ecfff; } .sk-special, .sk-item.sk-special { color:#e0aaff; }
.ce-empty { text-align:center; color:var(--text-muted); padding:20px; font-size:0.85rem; border:1px dashed var(--border); border-radius:10px; }

/* 下の固定バー */
.ce-bar { position:sticky; bottom:0; z-index:50; margin:16px -16px 0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px;
  background:rgba(12,11,24,0.88); backdrop-filter:blur(8px); border-top:1px solid var(--border); }
.ce-bar .btn { flex:1; justify-content:center; text-align:center; white-space:nowrap; padding-left:6px; padding-right:6px; min-width:0; font-size:0.84rem; }
#next-btn.od { color:var(--tc); border-color:var(--tc); }
#extra-btn { color:#7ecfff; }
/* 上の保存ボタンが見えないときだけ、下のバーの上に出す */
.ce-float-save { position:sticky; bottom:calc(66px + env(safe-area-inset-bottom)); z-index:51; float:right; margin:0 0 -40px; padding:7px 16px; border-radius:20px; font-size:0.84rem;
  box-shadow:0 4px 14px rgba(0,0,0,0.45); opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity 0.15s, transform 0.15s; }
.ce-float-save.show { opacity:1; transform:none; pointer-events:auto; }

/* シート（スマホは下から、PCは中央） */
.sheet { display:none; position:fixed; inset:0; z-index:600; background:rgba(0,0,0,0.6); }
.sheet.open { display:flex; align-items:flex-end; justify-content:center; }
.sheet-box { background:var(--bg-modal); backdrop-filter:var(--glass-blur); border:1px solid var(--border); border-bottom:none; border-radius:14px 14px 0 0; width:100%; max-width:560px; max-height:86vh; display:flex; flex-direction:column; animation:sheetUp 0.18s ease-out; }
@keyframes sheetUp { from { transform:translateY(30px); opacity:0; } to { transform:none; opacity:1; } }
@media (min-width:700px) {
  .sheet.open { align-items:center; }
  .sheet-box { border-radius:14px; border-bottom:1px solid var(--border); max-height:80vh; }
}
.sheet-head { display:flex; align-items:center; gap:10px; padding:12px 14px 10px; border-bottom:1px solid var(--border); }
.sheet-title { font-weight:bold; font-size:0.92rem; min-width:0; flex:1; }
.sheet-title small { display:block; font-weight:normal; font-size:0.72rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet-x { background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; display:flex; }
.sheet-body { overflow-y:auto; padding:10px 14px; flex:1; min-height:0; }
.sheet-foot { border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.sheet-search { width:100%; margin-bottom:8px; }
.text-btn { background:none; border:none; cursor:pointer; font-size:0.8rem; color:var(--text-muted); padding:4px 2px; }
.text-btn.danger { color:#e57373; }

/* キャラ選択 */
.char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; }
.char-pick { display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; border-radius:8px; border:1px solid transparent; background:none; cursor:pointer; color:var(--text-primary); font:inherit; }
.char-pick:hover { border-color:var(--border); background:var(--bg-secondary); }
.char-pick.cur { border-color:var(--accent); }
.char-pick:disabled { opacity:0.25; cursor:default; }
.char-pick .face { --fs:44px; }
.char-pick span { font-size:0.66rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.style-list { display:flex; flex-direction:column; gap:4px; }
.style-pick { display:flex; align-items:baseline; gap:8px; text-align:left; padding:9px 12px; border-radius:7px; border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); cursor:pointer; font:inherit; font-size:0.86rem; }
.style-pick:hover { border-color:var(--accent); }
.style-pick.cur { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--bg-secondary)); }
.style-pick small { color:var(--text-muted); font-size:0.72rem; margin-left:auto; white-space:nowrap; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
.seg button { background:transparent; border:none; color:var(--text-muted); font:inherit; font-size:0.8rem; padding:5px 11px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }
.seg button.on { background:var(--accent); color:#fff; }
.field-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:0.78rem; color:var(--text-muted); }

/* 技選択 */
.sk-top { padding:10px 14px 0; flex-shrink:0; }
.sk-filter { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
.sk-filter:empty { display:none; }
.sk-filter button { padding:4px 12px; border-radius:14px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font:inherit; font-size:0.78rem; cursor:pointer; }
.sk-filter button.on { border-color:currentColor; background:rgba(255,255,255,0.06); }
.sk-filter button.on.all { color:var(--text-primary); }
.sk-group { font-size:0.7rem; color:var(--text-muted); margin:10px 0 4px; display:flex; align-items:center; gap:6px; }
.sk-group:first-child { margin-top:0; }
.sk-group::after { content:''; flex:1; height:1px; background:var(--border); }
.sk-item { color:var(--text-primary); display:block; width:100%; text-align:left; padding:8px 12px; margin-bottom:3px; border-radius:7px; border:1px solid transparent; background:var(--bg-secondary); cursor:pointer; font:inherit; font-size:0.86rem; }
.sk-item:hover { border-color:var(--border); }
.sk-item.cur { border-color:var(--accent); }
.target-row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.target-pick { display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:1px solid transparent; border-radius:7px; padding:4px; cursor:pointer; color:var(--text-primary); font:inherit; font-size:0.62rem; width:52px; }
.target-pick .face { --fs:32px; }
.target-pick.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }
.foot-label { font-size:0.72rem; color:var(--text-muted); margin-right:4px; }
.need-target { color:var(--accent); font-size:0.75rem; margin-top:6px; }

/* ターン追加 */
.add-sec { margin-bottom:14px; }
.add-sec-title { font-size:0.74rem; color:var(--text-muted); margin-bottom:6px; }
.add-btns { display:flex; gap:6px; flex-wrap:wrap; }
.add-btn { padding:8px 14px; border-radius:8px; border:1px solid var(--tc, var(--border)); color:var(--tc, var(--text-primary)); background:var(--bg-secondary); cursor:pointer; font:inherit; font-size:0.84rem; }
.add-btns.od { display:grid; grid-template-columns:repeat(5,1fr); }
.add-btns.od .add-btn { padding:8px 2px; font-size:0.8rem; white-space:nowrap; }
.add-btn:disabled { opacity:0.25; cursor:default; }
.add-btn small { display:block; font-size:0.66rem; opacity:0.8; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main class="container" style="padding-top:20px;padding-bottom:0">
  <a href="/charts.html" style="color:var(--text-muted);font-size:0.85rem">← チャート掲示板</a>
  <h2 id="page-title" style="font-size:1.1rem;font-weight:bold;margin:12px 0 4px">チャート作成</h2>
  <div id="alert"></div>

  <div class="section-label">基本情報</div>
  <div class="card" style="padding:14px 16px">
    <div class="form-group">
      <label class="form-label">イベント</label>
      <select class="form-input" id="event-select"><option value="">選択してください</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">属性</label>
      <div id="attr-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="form-group">
      <label class="form-label">タイトル</label>
      <input class="form-input" type="text" id="title-input" placeholder="チャートのタイトル" maxlength="100">
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">説明（任意）</label>
      <textarea class="form-input" id="desc-input" placeholder="備考・注意点など" rows="2" style="resize:vertical"></textarea>
    </div>
    <div class="pub-line">
      <label class="pub-row">
        <input type="checkbox" id="public-input" onchange="updatePublicUI()">
        <span class="pub-switch"></span>
        <span class="pub-text" id="pub-text"></span>
      </label>
      <button class="btn btn-primary" id="save-btn" onclick="saveChart()">下書き保存</button>
    </div>
  </div>

  <div class="section-label">メンバー編成 <small>押して変更</small></div>
  <div class="ce-members" id="members-area"></div>

  <div class="section-label">チャート <small id="turn-summary"></small></div>
  <div id="turns-area" style="padding-bottom:48px"></div>

  <button class="btn btn-primary ce-float-save" id="float-save" onclick="saveChart()" aria-hidden="true" tabindex="-1">下書き保存</button>
  <div class="ce-bar">
    <button class="btn btn-secondary" id="next-btn" onclick="addNext()">次ターン</button>
    <button class="btn btn-secondary" id="extra-btn" onclick="addTurn('extra')">追加ターン</button>
    <button class="btn btn-secondary" id="add-btn" onclick="openAddSheet()">OD開始・その他</button>
  </div>
</main>

<!-- メンバー選択 -->
<div class="sheet" id="member-sheet" onclick="if(event.target===this)closeSheet('member-sheet')">
  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title" id="member-sheet-title"></div>
      <button class="sheet-x" onclick="closeSheet('member-sheet')" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="member-sheet-body"></div>
  </div>
</div>

<!-- 技選択 -->
<div class="sheet" id="skill-sheet" onclick="if(event.target===this)closeSheet('skill-sheet')">
  <div class="sheet-box">
    <div class="sheet-head">
      <span id="skill-sheet-face"></span>
      <div class="sheet-title" id="skill-sheet-title"></div>
      <button class="text-btn danger" onclick="clearAction()">外す</button>
      <button class="sheet-x" onclick="closeSheet('skill-sheet')" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sk-top">
      <input class="form-input sheet-search" id="skill-search" type="text" placeholder="技名で検索" oninput="renderSkillList()">
      <div class="sk-filter" id="sk-filter"></div>
    </div>
    <div class="sheet-body" style="padding-top:0">
      <div id="skill-list"></div>
    </div>
    <div class="sheet-foot">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="foot-label">順番</span>
        <span class="seg" id="order-seg">
          <button data-n="0" onclick="selectOrder(0)">なし</button><button data-n="1" onclick="selectOrder(1)">①</button><button data-n="2" onclick="selectOrder(2)">②</button><button data-n="3" onclick="selectOrder(3)">③</button>
        </span>
      </div>
      <div id="target-section" style="display:none">
        <div class="need-target" id="need-target">対象を選んでください</div>
        <div class="target-row" id="target-btns"></div>
      </div>
    </div>
  </div>
</div>

<!-- ターン追加 -->
<div class="sheet" id="add-sheet" onclick="if(event.target===this)closeSheet('add-sheet')">
  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title">OD開始・その他</div>
      <button class="sheet-x" onclick="closeSheet('add-sheet')" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="add-sheet-body"></div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

const ORDER_LABELS = ['', '①', '②', '③'];
const ATTRS = ['火','氷','雷','光','闇','無'];
const SLOT_COLORS = ['', '#ff6b81', '#ffa94d', '#ffe066', '#69db9c', '#5cc8ff', '#b197fc'];
const OD_COLORS = ['', '#ff9ec4', '#a8e6a3', '#ffd580', '#5b8cff', '#b46cff'];
// ODのターン数はゲージ数と同じ。ただし3ゲージ以上は3ターンまで
const odTurns = gauge => Math.min(gauge, 3);
const TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const editId = new URLSearchParams(location.search).get('id');

// ゲームデータ
let gameData = { characters: [], styles: [], skills: [] };
let charMap = {}, styleMap = {}, skillMap = {};

// チャート状態
const state = {
  event_id: '', attribute: '', title: '', description: '',
  members: Array.from({ length: 6 }, (_, i) => ({ slot: i + 1, character_id: null, style_id: null, refine_count: 0 })),
  turns: [],
};
let selectedAttr = '';

// ---- 初期化 ----
async function init() {
  try {
    [gameData] = await Promise.all([apiFetch('/charts/game-data'), loadEvents()]);
    for (const c of gameData.characters) charMap[c.id] = c;
    for (const s of gameData.styles) styleMap[s.id] = s;
    for (const s of gameData.skills) skillMap[s.id] = s;
    renderAttrBtns();
    renderMembers();
    renderTurns();
    if (editId) await loadExisting();
  } catch (e) { showAlert('#alert', e.message); }
}

let eventMap = {};
// 4・5ゲージのODはスコアタEXだけ
function maxGauge() {
  const e = eventMap[document.getElementById('event-select').value];
  return e && (e.event_type === 'score_attack_ex' || e.display_type === 'score_attack_ex') ? 5 : 3;
}

async function loadEvents() {
  const events = await apiFetch('/events');
  for (const e of events) eventMap[e.id] = e;
  const sel = document.getElementById('event-select');
  events.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id; opt.textContent = e.name;
    sel.appendChild(opt);
  });
}

async function loadExisting() {
  document.getElementById('page-title').textContent = 'チャート編集';
  try {
    const data = await apiFetch(`/charts/${editId}`);
    if (data.user_id !== getUser()?.id) { showAlert('#alert', '編集権限がありません'); return; }
    document.getElementById('event-select').value = data.event_id;
    selectAttr(data.attribute);
    document.getElementById('title-input').value = data.title;
    document.getElementById('desc-input').value = data.description || '';
    document.getElementById('public-input').checked = !!data.is_public;
    updatePublicUI();
    for (const m of data.members) {
      Object.assign(state.members[m.slot - 1], { character_id: m.character_id, style_id: m.style_id, refine_count: m.refine_count });
    }
    state.turns = data.turns.map(t => {
      const turn = { turn_type: t.turn_type, od_index: t.od_index, od_total: t.od_total, note: t.note || '', actions: {} };
      for (const a of t.actions) turn.actions[a.member_slot] = { skill_id: a.skill_id, skill_name: a.skill_name, target_slot: a.target_slot, order_num: a.order_num };
      return turn;
    });
    renderMembers();
    renderTurns();
  } catch (e) { showAlert('#alert', e.message); }
}

// ---- 共通 ----
function faceHTML(charId, slot, size) {
  const c = charId && charMap[charId];
  const style = `--fs:${size}px;--mc:${SLOT_COLORS[slot] || 'transparent'}`;
  if (c?.icon_url) return `<img class="face" style="${style}" src="${escHtml(chartIconUrl(c.icon_url, size * 2))}" alt="${escHtml(c.name)}" title="${escHtml(c.name)}">`;
  const ch = c ? (c.abbreviation || c.name).charAt(0) : (slot || '?');
  return `<span class="face ph" style="${style}">${escHtml(String(ch))}</span>`;
}
function shortName(slot) {
  const c = charMap[state.members[slot - 1]?.character_id];
  return c ? (c.abbreviation || c.name) : `${slot}`;
}
function skillClass(sk) {
  if (!sk) return '';
  if (sk.is_special) return 'sk-special';
  if (sk.style_id !== null) return 'sk-style';
  if (sk.character_id !== null) return 'sk-char';
  return '';
}
function openSheet(id) { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet.open').forEach(el => el.classList.remove('open')); });

// ---- 属性 ----
function renderAttrBtns() {
  document.getElementById('attr-btns').innerHTML = ATTRS.map(a =>
    `<button class="attr-btn attr-${escHtml(a)}" data-attr="${escHtml(a)}" onclick="selectAttr('${escHtml(a)}')">${t('attr.' + a) || a}</button>`
  ).join('');
}
function selectAttr(a) {
  selectedAttr = a;
  state.attribute = a;
  document.querySelectorAll('#attr-btns .attr-btn').forEach(b => b.classList.toggle('active', b.dataset.attr === a));
}

// ---- メンバー ----
function renderMembers() {
  document.getElementById('members-area').innerHTML = state.members.map((m, i) => {
    const slot = i + 1;
    const c = charMap[m.character_id], st = styleMap[m.style_id];
    if (!c) return `<button class="ce-member empty" style="--mc:${SLOT_COLORS[slot]}" onclick="openMemberSheet(${i})">
      ${faceHTML(null, slot, 36)}<div class="ce-member-body"><div class="ce-member-name">メンバー${slot}</div><div class="ce-member-sub">未選択</div></div></button>`;
    return `<button class="ce-member" style="--mc:${SLOT_COLORS[slot]}" onclick="openMemberSheet(${i})">
      ${faceHTML(c.id, slot, 36)}
      <div class="ce-member-body">
        <div class="ce-member-name">${escHtml(c.name)}</div>
        <div class="ce-member-sub">${st ? escHtml(st.abbreviation || st.name) : '<span style="color:var(--accent)">スタイル未選択</span>'} ・ ${m.refine_count}凸</div>
      </div></button>`;
  }).join('');
}

let memberCtx = { idx: 0, charId: null, refine: 0, step: 'char' };

function openMemberSheet(idx) {
  const m = state.members[idx];
  memberCtx = { idx, charId: m.character_id, refine: m.refine_count, step: m.character_id ? 'style' : 'char' };
  renderMemberSheet();
  openSheet('member-sheet');
}

function renderMemberSheet() {
  const { idx, charId, refine, step } = memberCtx;
  const slot = idx + 1;
  const m = state.members[idx];
  const body = document.getElementById('member-sheet-body');
  if (step === 'char') {
    document.getElementById('member-sheet-title').innerHTML = `メンバー${slot}のキャラ`;
    const used = new Set(state.members.filter((_, i) => i !== idx).map(x => x.character_id).filter(Boolean));
    body.innerHTML = `
      <input class="form-input sheet-search" id="char-search" type="text" placeholder="キャラ名で検索" oninput="filterChars(this.value)">
      <div class="char-grid" id="char-grid">${gameData.characters.map(c => `
        <button class="char-pick${c.id === m.character_id ? ' cur' : ''}" data-q="${escHtml((c.name + ' ' + (c.abbreviation || '')).toLowerCase())}"
          ${used.has(c.id) ? 'disabled title="他の枠で使用中"' : ''} onclick="pickChar(${c.id})">
          ${faceHTML(c.id, slot, 44)}<span>${escHtml(c.abbreviation || c.name)}</span></button>`).join('')}</div>
      ${m.character_id ? `<div style="margin-top:12px;text-align:right"><button class="text-btn danger" onclick="clearMember()">この枠を空にする</button></div>` : ''}`;
    return;
  }
  const c = charMap[charId];
  document.getElementById('member-sheet-title').innerHTML = `${escHtml(c.name)}<small>スタイルを選ぶと決定します</small>`;
  const styles = gameData.styles.filter(s => s.character_id === charId);
  const curStyle = charId === m.character_id ? m.style_id : null;
  body.innerHTML = `
    <div class="field-row">
      <button class="text-btn" onclick="memberCtx.step='char';renderMemberSheet()">← キャラを変える</button>
    </div>
    <div class="field-row"><span>凸</span><span class="seg">${[0, 1, 2, 3, 4].map(n => `<button class="${n === refine ? 'on' : ''}" onclick="memberCtx.refine=${n};renderMemberSheet()">${n}</button>`).join('')}</span></div>
    <div class="style-list">${styles.map(st => `
      <button class="style-pick${st.id === curStyle ? ' cur' : ''}" onclick="pickStyle(${st.id})">${escHtml(st.name)}${st.abbreviation ? `<small>${escHtml(st.abbreviation)}</small>` : ''}</button>`).join('') || '<div style="color:var(--text-muted);font-size:0.85rem">スタイルが登録されていません</div>'}
    </div>`;
}

function filterChars(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('#char-grid .char-pick').forEach(b => { b.style.display = !q || b.dataset.q.includes(q) ? '' : 'none'; });
}

function pickChar(charId) {
  memberCtx.charId = charId;
  memberCtx.step = 'style';
  renderMemberSheet();
}

// そのメンバーの行動のうち、新しい編成で使えなくなるものを数える
function invalidActions(slot, charId, styleId) {
  const bad = [];
  state.turns.forEach(t => {
    const a = t.actions[slot];
    if (!a) return;
    const sk = skillMap[a.skill_id];
    if (!sk) return;
    const ok = (sk.character_id === null && sk.style_id === null) || (sk.character_id === charId && (sk.style_id === null || sk.style_id === styleId));
    if (!ok) bad.push(t);
  });
  return bad;
}

async function pickStyle(styleId) {
  const { idx, charId, refine } = memberCtx;
  const slot = idx + 1;
  const bad = invalidActions(slot, charId, styleId);
  if (bad.length && !await showConfirm(`このメンバーの行動のうち${bad.length}件が使えなくなるので外します。よろしいですか？`)) return;
  bad.forEach(t => delete t.actions[slot]);
  Object.assign(state.members[idx], { character_id: charId, style_id: styleId, refine_count: refine });
  closeSheet('member-sheet');
  renderMembers();
  renderTurns();
}

async function clearMember() {
  const slot = memberCtx.idx + 1;
  const n = state.turns.filter(t => t.actions[slot]).length;
  if (n && !await showConfirm(`このメンバーの行動${n}件も外します。よろしいですか？`)) return;
  state.turns.forEach(t => delete t.actions[slot]);
  Object.assign(state.members[memberCtx.idx], { character_id: null, style_id: null, refine_count: 0 });
  closeSheet('member-sheet');
  renderMembers();
  renderTurns();
}

// ---- ターン ----
function turnInfo(t, normalIdx) {
  switch (t.turn_type) {
    case 'normal': return { label: `${normalIdx}ターン`, color: 'var(--text-primary)' };
    case 'extra': return { label: '追加ターン', color: '#7ecfff' };
    case 'od_pre': return { label: `OD ${t.od_index}/${odTurns(t.od_total)}（${t.od_total}ゲージ・ターン前）`, color: OD_COLORS[t.od_total] };
    case 'od_post': return { label: `OD ${t.od_index}/${odTurns(t.od_total)}（${t.od_total}ゲージ・ターン後）`, color: OD_COLORS[t.od_total] };
    case 'special': return { label: '特殊技', color: '#e0aaff' };
  }
  return { label: '', color: 'var(--text-muted)' };
}

function canAct(turn, slot) {
  const m = state.members[slot - 1];
  if (!m.character_id || !m.style_id) return false;
  if (turn.turn_type === 'special') return !!styleMap[m.style_id]?.has_special_skill;
  if (turn.actions[slot]) return true;
  return Object.keys(turn.actions).length < 3;
}

// 途中のODターンを消すと段数がずれるので、ODは最後の行だけ消せる
function canDelete(idx) {
  const t = state.turns[idx];
  return idx === state.turns.length - 1 || (t.turn_type !== 'od_pre' && t.turn_type !== 'od_post');
}

function renderTurns() {
  let nIdx = 0;
  const html = state.turns.map((turn, tIdx) => {
    if (turn.turn_type === 'normal') nIdx++;
    const info = turnInfo(turn, nIdx);
    const n = Object.keys(turn.actions).length;
    // 3人行動したターンは、行動した3人だけを出す
    const full = turn.turn_type !== 'special' && n >= 3;
    const tiles = state.members.map((m, i) => {
      const slot = i + 1;
      const a = turn.actions[slot];
      if (full && !a) return '';
      const ok = canAct(turn, slot);
      const sk = a && skillMap[a.skill_id];
      const name = a ? (sk?.abbreviation || a.skill_name || sk?.name) : (m.character_id ? '' : '');
      return `<button class="ce-tile${a ? ' on' : ''}${!ok && !a ? ' off' : ''}" style="--mc:${SLOT_COLORS[slot]}"
          ${ok || a ? `onclick="openSkillSheet(${tIdx},${slot})"` : 'disabled'}>
        ${a?.order_num ? `<span class="ce-tile-order">${a.order_num}</span>` : ''}
        ${faceHTML(m.character_id, slot, 34)}
        <span class="ce-tile-text">
          <span class="ce-tile-skill ${a ? skillClass(sk) : 'none'}">${a ? escHtml(name) : (ok ? '＋' : '')}</span>
          ${a?.target_slot ? `<span class="ce-tile-target">→${escHtml(shortName(a.target_slot))}</span>` : ''}
        </span>
      </button>`;
    }).join('');
    return `<div class="ce-turn" id="turn-${tIdx}">
      <div class="ce-turn-head">
        <span class="ce-turn-label" style="--tc:${info.color}">${info.label}</span>
        ${turn.turn_type !== 'special' ? `<span class="ce-turn-count">行動 ${n}/3</span>` : ''}
        ${canDelete(tIdx) ? `<button class="ce-turn-del" onclick="deleteTurn(${tIdx})" title="このターンを消す" aria-label="このターンを消す">${TRASH}</button>` : ''}
      </div>
      <div class="ce-tiles${full ? ' full' : ''}">${tiles}</div>
    </div>`;
  }).join('');
  updateNextBtn();
  document.getElementById('turns-area').innerHTML = html || '<div class="ce-empty">下の「次ターン」でターンを追加してください</div>';
  document.getElementById('turn-summary').textContent = state.turns.length ? `${state.turns.length}行` : '';
}

async function deleteTurn(idx) {
  const t = state.turns[idx];
  if (Object.keys(t.actions).length && !await showConfirm('このターンを消しますか？')) return;
  state.turns.splice(idx, 1);
  renderTurns();
}

function getCurrentODState() {
  // specialとextraを飛ばして最後のODターンを返す
  for (let i = state.turns.length - 1; i >= 0; i--) {
    const t = state.turns[i];
    if (t.turn_type === 'special' || t.turn_type === 'extra') continue;
    if (t.turn_type === 'od_pre' || t.turn_type === 'od_post') return { type: t.turn_type, index: t.od_index, total: t.od_total };
    break;
  }
  return null;
}

function getLastRealTurn() {
  for (let i = state.turns.length - 1; i >= 0; i--) {
    if (state.turns[i].turn_type !== 'special') return state.turns[i];
  }
  return null;
}

function odInProgress() {
  const od = getCurrentODState();
  return od && od.index < odTurns(od.total) ? od : null;
}

function pushTurn(turn) {
  state.turns.push({ od_index: null, od_total: null, note: '', actions: {}, ...turn });
  renderTurns();
  closeSheet('add-sheet');
  document.getElementById(`turn-${state.turns.length - 1}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function addTurn(type) {
  if (type === 'normal' && odInProgress()) return;
  pushTurn({ turn_type: type });
}

// ターン後のODは、通常ターンの後（間に追加ターンが挟まってもよい）だけ始められる
// 例：通常→後OD、通常→追加→後OD はOK。先OD→追加→後OD はNG
function canStartPostOD() {
  for (let i = state.turns.length - 1; i >= 0; i--) {
    const t = state.turns[i].turn_type;
    if (t === 'special' || t === 'extra') continue;
    return t === 'normal';
  }
  return false;
}

function addOD(type, total) {
  const od = odInProgress();
  if (od && (od.type !== type || od.total !== total)) return;
  if (!od && type === 'od_post' && !canStartPostOD()) return;
  pushTurn({ turn_type: type, od_index: od ? od.index + 1 : 1, od_total: total });
}

function addSpecialTurn(slot, skillId) {
  const sk = skillMap[skillId];
  pushTurn({ turn_type: 'special', actions: { [slot]: { skill_id: skillId, skill_name: sk.name, target_slot: null, order_num: null } } });
}


// 下のバーの「次ターン」：2ゲージ以上のODの途中なら、ODの次のターンになる
function addNext() {
  const od = odInProgress();
  if (od) addOD(od.type, od.total); else addTurn('normal');
}
function updateNextBtn() {
  const od = odInProgress();
  const btn = document.getElementById('next-btn');
  btn.textContent = od ? `OD ${od.index + 1}/${odTurns(od.total)}` : '次ターン';
  btn.classList.toggle('od', !!od);
  btn.style.setProperty('--tc', od ? OD_COLORS[od.total] : '');
}

function openAddSheet() {
  const od = odInProgress();
  const postOk = canStartPostOD();
  const odBtn = (type, total) => {
    const cont = od && od.type === type && od.total === total;
    const ok = cont || (!od && (type === 'od_pre' || postOk));
    const label = cont ? `${total}ゲージ<small>${od.index + 1}/${odTurns(total)}ターン目</small>` : `${total}ゲージ`;
    return `<button class="add-btn" style="--tc:${OD_COLORS[total]}" ${ok ? `onclick="addOD('${type}',${total})"` : 'disabled'}>${label}</button>`;
  };
  const specials = [];
  state.members.forEach((m, i) => {
    if (!m.style_id || !styleMap[m.style_id]?.has_special_skill) return;
    const sk = gameData.skills.find(s => s.style_id === m.style_id && s.is_special);
    if (sk) specials.push(`<button class="add-btn" style="--tc:#e0aaff" onclick="addSpecialTurn(${i + 1},${sk.id})">${escHtml(sk.abbreviation || sk.name)}<small>${escHtml(shortName(i + 1))}</small></button>`);
  });
  document.getElementById('add-sheet-body').innerHTML = `
    ${od ? `<div class="add-sec-title" style="color:var(--accent);margin-bottom:12px">OD（${od.total}ゲージ）の途中です。続きは下の「OD ${od.index + 1}/${odTurns(od.total)}」で追加できます</div>` : ''}
    <div class="add-sec"><div class="add-sec-title">OD（ターン前に発動）</div><div class="add-btns od">${Array.from({ length: maxGauge() }, (_, k) => odBtn('od_pre', k + 1)).join('')}</div></div>
    <div class="add-sec"><div class="add-sec-title">OD（ターン後に発動）</div><div class="add-btns od">${Array.from({ length: maxGauge() }, (_, k) => odBtn('od_post', k + 1)).join('')}</div></div>
    ${specials.length ? `<div class="add-sec"><div class="add-sec-title">特殊技</div><div class="add-btns">${specials.join('')}</div></div>` : ''}`;
  openSheet('add-sheet');
}

// ---- 技選択 ----
let modalCtx = { turnIdx: null, slot: null, action: {} };
let allSkillsForModal = [];
let skillFilter = 'all';
const SKILL_KINDS = [
  ['special', '特殊技', 'sk-special', s => s.is_special],
  ['style', 'スタイル', 'sk-style', s => !s.is_special && s.style_id !== null],
  ['char', 'キャラ', 'sk-char', s => s.style_id === null && s.character_id !== null],
  ['common', '共通', '', s => s.character_id === null],
];
function setSkillFilter(f) { skillFilter = f; renderSkillList(); }

function getAvailableSkills(slot, turnType) {
  const m = state.members[slot - 1];
  if (!m?.character_id || !m?.style_id) return [];
  const charId = m.character_id, styleId = m.style_id;
  if (turnType === 'special') return gameData.skills.filter(s => s.style_id === styleId && s.is_special);
  const hasShikiBehavior = gameData.skills.some(s => s.style_id === styleId && s.name === '指揮行動');
  return gameData.skills.filter(s => {
    if (s.is_special) return false;
    if (hasShikiBehavior && s.name === '通常攻撃') return false;
    if (s.character_id === null && s.style_id === null) return true;
    if (s.character_id === charId && (s.style_id === null || s.style_id === styleId)) return true;
    return false;
  });
}

function openSkillSheet(turnIdx, slot) {
  const turn = state.turns[turnIdx];
  const m = state.members[slot - 1];
  const existing = turn.actions[slot] || {};
  modalCtx = { turnIdx, slot, action: { ...existing } };
  const c = charMap[m.character_id], st = styleMap[m.style_id];
  document.getElementById('skill-sheet-face').innerHTML = faceHTML(m.character_id, slot, 36);
  document.getElementById('skill-sheet-title').innerHTML = `${escHtml(c?.name || '')}<small>${escHtml(st?.name || '')}</small>`;
  document.getElementById('skill-search').value = '';
  skillFilter = 'all';
  allSkillsForModal = getAvailableSkills(slot, turn.turn_type);
  renderSkillList();
  document.querySelectorAll('#order-seg button').forEach(b => b.classList.toggle('on', +b.dataset.n === (existing.order_num || 0)));
  updateTargetSection();
  openSheet('skill-sheet');
  document.querySelector('#skill-list .sk-item.cur')?.scrollIntoView({ block: 'center' });
}

function renderSkillList() {
  // 絞り込みのボタン（その人が使える種類だけ。2種類以上あるときに出す）
  const kinds = SKILL_KINDS.filter(([, , , fn]) => allSkillsForModal.some(fn));
  document.getElementById('sk-filter').innerHTML = kinds.length < 2 ? '' :
    [['all', 'すべて', 'all'], ...kinds.map(([k, label, cls]) => [k, label, cls])]
      .map(([k, label, cls]) => `<button class="${cls}${skillFilter === k ? ' on' : ''}" onclick="setSkillFilter('${k}')">${label}</button>`).join('');
  const q = document.getElementById('skill-search').value.trim().toLowerCase();
  const list = allSkillsForModal.filter(s => !q || s.name.toLowerCase().includes(q));
  const groups = SKILL_KINDS.filter(([k]) => skillFilter === 'all' || skillFilter === k)
    .map(([, label, , fn]) => [label === '特殊技' ? label : `${label}の技`, list.filter(fn)]);
  const cur = modalCtx.action.skill_id;
  const html = groups.filter(([, arr]) => arr.length).map(([label, arr]) => `
    <div class="sk-group">${label}</div>
    ${arr.map(s => `<button class="sk-item ${skillClass(s)}${s.id === cur ? ' cur' : ''}" onclick="selectSkill(${s.id})">${escHtml(s.name)}</button>`).join('')}`).join('');
  document.getElementById('skill-list').innerHTML = html || '<div style="padding:8px;color:var(--text-muted);font-size:0.82rem">技がありません</div>';
}

function selectSkill(skillId) {
  const skill = skillMap[skillId];
  modalCtx.action.skill_id = skillId;
  modalCtx.action.skill_name = skill.name;
  if (!skill.has_target) modalCtx.action.target_slot = null;
  if (!applyAction()) return;
  if (!skill.has_target) { closeSheet('skill-sheet'); return; }
  renderSkillList();
  updateTargetSection();
}

function updateTargetSection() {
  const skill = skillMap[modalCtx.action.skill_id];
  const sec = document.getElementById('target-section');
  if (!skill?.has_target) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  const current = modalCtx.action.target_slot;
  document.getElementById('need-target').style.display = current ? 'none' : '';
  document.getElementById('target-btns').innerHTML = state.members.map((m, i) => !m.character_id ? '' : `
    <button class="target-pick${current === i + 1 ? ' on' : ''}" onclick="selectTarget(${i + 1})">${faceHTML(m.character_id, i + 1, 32)}${escHtml(shortName(i + 1))}</button>`).join('');
}

function selectTarget(slot) {
  modalCtx.action.target_slot = slot;
  applyAction();
  closeSheet('skill-sheet');
}

function selectOrder(n) {
  modalCtx.action.order_num = n || null;
  document.querySelectorAll('#order-seg button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  if (modalCtx.action.skill_id) applyAction();
}

function applyAction() {
  const { turnIdx, slot, action } = modalCtx;
  if (!action.skill_id) return false;
  const turn = state.turns[turnIdx];
  if (turn.turn_type !== 'special' && !turn.actions[slot] && Object.keys(turn.actions).length >= 3) {
    showMessage('1ターンに行動できるのは3キャラまでです');
    return false;
  }
  turn.actions[slot] = { ...action };
  renderTurns();
  return true;
}

function clearAction() {
  const { turnIdx, slot } = modalCtx;
  if (turnIdx !== null) delete state.turns[turnIdx].actions[slot];
  renderTurns();
  closeSheet('skill-sheet');
}

// ---- 公開 ----
function updatePublicUI() {
  const on = document.getElementById('public-input').checked;
  document.getElementById('pub-text').innerHTML = on
    ? '公開する<small>チャート掲示板に表示され、誰でも見られます</small>'
    : '公開しない（下書き）<small>自分だけが見られます。マイチャートから開けます</small>';
  document.getElementById('save-btn').textContent = on ? '保存して公開' : '下書き保存';
  document.getElementById('float-save').textContent = on ? '保存して公開' : '下書き保存';
}
updatePublicUI();

// 上の保存ボタンが画面外に出たら、固定の保存ボタンを出す
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([e]) => {
    const f = document.getElementById('float-save');
    f.classList.toggle('show', !e.isIntersecting);
    f.setAttribute('aria-hidden', e.isIntersecting);
    f.tabIndex = e.isIntersecting ? -1 : 0;
  }).observe(document.getElementById('save-btn'));
}

// ---- 保存 ----
async function saveChart() {
  state.event_id = document.getElementById('event-select').value;
  state.title = document.getElementById('title-input').value.trim();
  state.description = document.getElementById('desc-input').value.trim();
  state.attribute = selectedAttr;

  const fail = msg => { showAlert('#alert', msg); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (!state.event_id) return fail('イベントを選択してください');
  if (!state.attribute) return fail('属性を選択してください');
  if (!state.title) return fail('タイトルを入力してください');
  if (!state.members.some(m => m.character_id && m.style_id)) return fail('メンバーを設定してください');
  if (state.members.some(m => m.character_id && !m.style_id)) return fail('スタイルが未選択のメンバーがいます');
  if (state.turns.some(t => t.od_total > maxGauge())) return fail('4・5ゲージのODはスコアタEXのイベントでのみ使えます');

  const payload = {
    event_id: parseInt(state.event_id),
    attribute: state.attribute,
    title: state.title,
    description: state.description,
    is_public: document.getElementById('public-input').checked,
    members: state.members.filter(m => m.character_id && m.style_id),
    turns: state.turns.map((t, i) => ({
      seq_order: i + 1,
      turn_type: t.turn_type,
      od_index: t.od_index,
      od_total: t.od_total,
      note: t.note,
      actions: Object.entries(t.actions).map(([slot, a]) => ({
        member_slot: parseInt(slot),
        skill_id: a.skill_id,
        target_slot: a.target_slot || null,
        order_num: a.order_num || null,
      })),
    })),
  };

  const btn = document.getElementById('save-btn');
  const fbtn = document.getElementById('float-save');
  btn.disabled = fbtn.disabled = true;
  try {
    const url = editId ? `/charts/${editId}` : '/charts';
    const res = await apiFetch(url, { method: editId ? 'PUT' : 'POST', body: JSON.stringify(payload) });
    showMessage(payload.is_public ? '保存して公開しました' : '下書きを保存しました');
    if (!editId && res.id) setTimeout(() => location.href = `/chart-view.html?id=${res.id}`, 800);
  } catch (e) {
    fail(e.message);
  } finally {
    btn.disabled = fbtn.disabled = false;
  }
}

init();
</script>
