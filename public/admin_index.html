<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>管理メニュー - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.admin-nav-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
.admin-nav-card { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; text-decoration:none;
  background:var(--bg-card2); backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--border-light); transition:border-color 0.15s, transform 0.15s; }
.admin-nav-card:hover { border-color:var(--accent); transform:translateY(-2px); text-decoration:none; }
.admin-nav-icon { flex-shrink:0; width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:#ff7a8c; line-height:0;
  background:radial-gradient(circle at 50% 30%, rgba(255,255,255,0.1), rgba(20,18,40,0.6) 75%); border:1px solid rgba(255,255,255,0.1); }
.admin-nav-icon svg { width:24px; height:24px; }
.admin-nav-text { min-width:0; }
.admin-nav-card:has(.admin-nav-badge) { padding-right:48px; }
.admin-nav-title { font-size:0.95rem; font-weight:bold; color:var(--text-primary); }
.admin-nav-desc { font-size:0.74rem; color:var(--text-muted); margin-top:2px; }
.admin-nav-badge { position:absolute; top:50%; right:14px; transform:translateY(-50%); min-width:22px; height:22px; line-height:22px; padding:0 7px; border-radius:11px;
  background:#ef5350; color:#fff; font-size:0.74rem; font-weight:bold; text-align:center; }
@media (max-width:480px) {
  .admin-nav-grid { grid-template-columns:minmax(0, 1fr); gap:8px; }
  .admin-nav-card { padding:12px 14px; }
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1 class="page-title" style="margin-bottom:14px">管理メニュー</h1>
  <div class="admin-nav-grid" id="admin-nav-grid"></div>
</main>
<script src="/js/common.js"></script>
<script>
renderNav();
if (!requireAdmin()) throw new Error('redirect');
// 並びと名前は上の管理ナビ（ADMIN_PAGES）と同じ
document.getElementById('admin-nav-grid').innerHTML = ADMIN_PAGES.map(pg => `
  <a href="${pg.href}" class="admin-nav-card" id="card-${pg.key}">
    <div class="admin-nav-icon">${uiIcon(pg.icon, 32)}</div>
    <div class="admin-nav-text">
      <div class="admin-nav-title">${pg.label}</div>
      <div class="admin-nav-desc">${pg.desc}</div>
    </div>
  </a>`).join('');
// 承認待ちのスコア・動画とお便りの未読を数で出す
apiFetch('/feedback/admin-unread-count').then(d => {
  const put = (key, n) => { if (n > 0) document.getElementById('card-' + key).insertAdjacentHTML('beforeend', `<span class="admin-nav-badge">${n}</span>`); };
  put('scores', d.scores || 0);
  put('settings', d.feedback || 0);
  put('videos', d.videos || 0);
}).catch(() => {});
</script>
</body>
</html>
