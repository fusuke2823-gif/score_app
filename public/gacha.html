<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガチャ - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 所持ポイント・GP（このページだけ右上に固定表示） */
.gacha-wallet {
  position:fixed; top:66px; right:max(16px, calc((100vw - 1100px) / 2 + 24px)); z-index:90;
  display:flex; align-items:center; gap:10px; padding:6px 14px; border-radius:99px;
  background:rgba(18,16,34,0.78); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
  border:1px solid var(--border-light); box-shadow:0 4px 16px rgba(0,0,0,0.4);
  font-size:0.9rem; font-weight:800; font-variant-numeric:tabular-nums;
}
.gacha-mute {
  display:flex; align-items:center; justify-content:center; width:24px; height:24px; margin:-2px 0 -2px -6px; padding:0;
  border:none; border-radius:50%; background:none; color:var(--text-secondary); cursor:pointer;
}
.gacha-mute:hover { color:var(--text-primary); background:rgba(255,255,255,0.08); }
.gacha-mute:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.gacha-mute.is-muted { color:#ff8a80; }
.gacha-wallet-item { display:flex; align-items:baseline; gap:5px; }
.gacha-wallet-label { font-size:0.62rem; font-weight:800; letter-spacing:0.1em; color:var(--text-secondary); }
#my-points { color:#ff6b80; }
#my-gp { color:#7fd3ff; }
.gacha-wallet-sep { width:1px; height:14px; background:var(--border-light); }
.gacha-wallet-dup {
  position:absolute; top:calc(100% + 6px); right:6px; white-space:nowrap;
  font-size:0.78rem; font-weight:bold; color:#4fc3f7; text-shadow:0 1px 6px rgba(0,0,0,0.8);
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
/* 右上の固定表示と最初のコンテンツが重ならないように */
.gacha-top-spacer { height:40px; }

/* 通常 / 特殊 の切り替え（選択中の側に背景がスライドする） */
.gacha-type-tabs {
  position:relative; width:fit-content; margin:0 auto 18px; padding:4px; gap:0;
  border-radius:14px; background:rgba(18,16,34,0.7); border:1px solid var(--border-light);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.gacha-type-indicator {
  position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:10px;
  background:linear-gradient(135deg, #ff5470, #c2185b); box-shadow:0 4px 14px rgba(230,57,80,0.45);
  transition:transform 0.3s cubic-bezier(.4,1.3,.5,1), background 0.3s, box-shadow 0.3s;
}
.gacha-type-tabs[data-active="special"] .gacha-type-indicator {
  transform:translateX(100%);
  background:linear-gradient(135deg, #7b3fe4, #c79a2e); box-shadow:0 4px 14px rgba(160,100,230,0.45);
}
.gacha-type-btn {
  position:relative; z-index:1; flex:1; min-width:132px; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 18px; border:none; background:none; border-radius:10px; cursor:pointer;
  font-family:inherit; font-size:0.9rem; font-weight:800; letter-spacing:0.04em; color:var(--text-secondary);
  transition:color 0.2s;
}
.gacha-type-btn:hover { color:var(--text-primary); }
.gacha-type-btn.active { color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.35); }
.gacha-type-btn:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
@media (prefers-reduced-motion: reduce) { .gacha-type-indicator { transition:none; } }
.gacha-pull-btns { display:flex; gap:16px; justify-content:center; flex-wrap:nowrap; margin:20px 0 28px; }
/* 討伐ガチャ：引いている間はボタンを畳んでカードを敵のすぐ下に出し、引けるようになったら戻す */
.gacha-pull-btns.sg-collapsible { max-height:260px; overflow:hidden; transition:max-height 0.35s ease, margin 0.35s ease, opacity 0.25s ease; }
.gacha-pull-btns.sg-collapsible.is-collapsed { max-height:0; margin:14px 0 0; opacity:0; pointer-events:none; }
@media (prefers-reduced-motion: reduce) { .gacha-pull-btns.sg-collapsible { transition:none; } }
.gacha-btn {
  padding:0; margin:0; font-size:0.88rem; font-weight:bold;
  border:none; cursor:pointer; background:transparent;
  transition:transform 0.15s, opacity 0.15s;
  display:flex; flex-direction:column; align-items:center; gap:0;
}
.gacha-btn:hover:not(:disabled) { transform:translateY(-3px); }
.gacha-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
.gacha-btn-single { color:#fff; }
.gacha-btn-multi { color:#ffd700; }
.gacha-btn img { width:160px; max-width:38vw; height:auto; display:block; }
.gacha-btn .gcost { font-size:0.88rem; font-weight:bold; }
.g-card { opacity:0; transform:scale(0.8); transition:opacity 0.18s, transform 0.18s; }
.g-card.card-visible { opacity:1; transform:scale(1); }

/* カードステージ */
.gacha-stage {
  min-height:200px; display:flex; align-items:center; justify-content:center;
  margin-bottom:16px;
}
.gacha-cards { display:flex; flex-wrap:wrap; column-gap:8px; row-gap:36px; justify-content:center; width:calc(5*88px + 4*8px); max-width:100%; margin:0 auto; }

/* カード */
.g-card { width:88px; height:122px; perspective:700px; flex-shrink:0; }
.g-card-inner {
  width:100%; height:100%; position:relative;
  transform-style:preserve-3d;
  transition:transform 0.65s cubic-bezier(.4,2,.55,1);
}
.g-card-inner.flipped { transform:rotateY(180deg); }
.g-card-front, .g-card-back {
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;
}
.g-card-front {
  background:#201c3a; border:2px solid var(--border-light);
  transition: box-shadow 0.4s;
}
.g-card-back { transform:rotateY(180deg); background:#201c3a; padding:4px; overflow:visible; }
.g-card-back img { width:52px; height:52px; border-radius:20%; object-fit:cover; }
.g-new {
  position:absolute; top:-9px; right:-6px; z-index:2; padding:1px 6px; border-radius:99px;
  background:linear-gradient(90deg, #ff5470, #ff8a3d); color:#fff; font-size:0.58rem; font-weight:900; letter-spacing:0.04em;
  box-shadow:0 2px 6px rgba(230,57,80,0.5);
}
.g-card-back .g-name { font-size:0.62rem; color:var(--text-primary); text-align:center; word-break:break-all; line-height:1.2; max-width:80px; }
.g-rarity-tag { position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:0.65rem; font-weight:bold; padding:1px 7px; border-radius:4px; }

/* レアリティ枠 */
.rarity-SS .g-card-back {
  border:2px solid transparent;
  background:linear-gradient(#201c3a,#201c3a) padding-box,
             linear-gradient(135deg,#ffd700,#ff66cc,#00eeff,#ffd700) border-box;
  animation:ssGlow 1.8s linear infinite;
}
.rarity-S .g-card-back { border:2px solid #ffd700; box-shadow:0 0 12px rgba(255,215,0,0.65); }
.rarity-A .g-card-back { border:2px solid #4fc3f7; box-shadow:0 0 8px rgba(79,195,247,0.4); }
.g-rarity-tag.r-SS { background:#ffd700; color:#000; }
.g-rarity-tag.r-S  { background:#e0c060; color:#000; }
.g-rarity-tag.r-A  { background:#4fc3f7; color:#000; }

@keyframes ssGlow {
  0%   { box-shadow:0 0 18px #ffd700; }
  33%  { box-shadow:0 0 18px #ff66cc; }
  66%  { box-shadow:0 0 18px #00eeff; }
  100% { box-shadow:0 0 18px #ffd700; }
}

/* 結果サマリー */

/* 所持アイコン */
.icon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:12px; }
.icon-item { text-align:center; padding:4px; }
.icon-item img {
  width:58px; height:58px; border-radius:20%; object-fit:cover;
  border:2px solid var(--border); cursor:pointer;
  transition:border-color 0.2s, box-shadow 0.2s;
  display:block; margin:0 auto 4px;
}
.icon-item img:hover { border-color:var(--accent); }
.icon-item img.equipped { border-color:var(--accent); box-shadow:0 0 10px var(--accent); }
.icon-none-btn {
  width:58px; height:58px; border-radius:20%; border:2px solid var(--border); cursor:pointer;
  display:flex; align-items:center; justify-content:center; margin:0 auto 4px;
  font-size:1.4rem; color:var(--text-muted); background:var(--bg-primary);
  transition:border-color 0.2s, box-shadow 0.2s;
}
.icon-none-btn:hover { border-color:var(--accent); }
.icon-none-btn.equipped { border-color:var(--accent); box-shadow:0 0 10px var(--accent); }
.icon-item .iname { font-size:0.68rem; color:var(--text-secondary); word-break:break-all; line-height:1.2; }
.irarity { font-size:0.62rem; font-weight:bold; padding:1px 5px; border-radius:3px; display:inline-block; margin-bottom:3px; }
.irarity-SS { background:#ffd700; color:#000; }
.irarity-S  { background:#e0c060; color:#000; }
.irarity-A  { background:#4fc3f7; color:#000; }

/* めくる前カード裏面の表示レアリティ演出 */
.display-rarity-SS .g-card-front {
  border:2px solid transparent;
  background:linear-gradient(#201c3a,#201c3a) padding-box,
             linear-gradient(135deg,#ffd700,#ff66cc,#00eeff,#ffd700) border-box;
  animation:ssGlow 1.8s linear infinite;
}
.display-rarity-S .g-card-front {
  border:2px solid #ffd700;
  box-shadow:0 0 12px rgba(255,215,0,0.65);
}
/* S・SS レアリティ変更演出 */
@keyframes sRevealAnim {
  0%   { box-shadow:0 0 10px rgba(255,215,0,0.5); filter:brightness(1); transform:scale(1); }
  30%  { box-shadow:0 0 32px rgba(255,215,0,1), 0 0 64px rgba(255,180,0,0.5); filter:brightness(1.5); transform:scale(1.08); }
  55%  { box-shadow:0 0 20px rgba(255,215,0,0.8); filter:brightness(1.2); transform:scale(1.02); }
  78%  { box-shadow:0 0 38px rgba(255,215,0,1), 0 0 72px rgba(255,215,0,0.4); filter:brightness(1.45); transform:scale(1.06); }
  100% { box-shadow:0 0 12px rgba(255,215,0,0.65); filter:brightness(1); transform:scale(1); }
}
@keyframes ssRevealAnim {
  0%   { filter:brightness(1); transform:scale(1) translateX(0); box-shadow:none; }
  12%  { filter:brightness(1.6); transform:scale(1.06) translateX(-4px); box-shadow:0 0 30px #ffd700, 0 0 60px rgba(255,215,0,0.4); }
  24%  { filter:brightness(1.3); transform:scale(1.03) translateX(4px);  box-shadow:0 0 36px #ff88cc, 0 0 72px rgba(255,100,200,0.35); }
  38%  { filter:brightness(1.8); transform:scale(1.10) translateX(-3px); box-shadow:0 0 44px #00eeff, 0 0 88px rgba(0,200,255,0.4); }
  52%  { filter:brightness(2.1); transform:scale(1.13) translateX(0);    box-shadow:0 0 55px #ffd700, 0 0 90px #ff66cc, 0 0 130px rgba(0,230,255,0.35); }
  68%  { filter:brightness(1.5); transform:scale(1.06) translateX(0);    box-shadow:0 0 40px #ff66cc, 0 0 75px #00eeff; }
  85%  { filter:brightness(1.2); transform:scale(1.02); }
  100% { filter:brightness(1);   transform:scale(1) translateX(0); }
}
.reveal-S  .g-card-front { animation:sRevealAnim  0.95s ease-in-out forwards; }
.reveal-SS .g-card-front { animation:ssRevealAnim 1.25s ease-in-out forwards; }

.section-title { font-size:1rem; font-weight:bold; margin-bottom:14px; color:var(--text-primary); }
.rate-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
.rate-row:last-child { border-bottom:none; }

/* ===== 通常ガチャ：選んだガチャのバナー・開閉式の欄 ===== */
.gx-back {
  display:inline-flex; align-items:center; gap:4px; margin:0 0 8px; padding:4px 10px 4px 6px;
  border:1px solid var(--border-light); border-radius:99px; background:rgba(0,0,0,0.3);
  color:var(--text-secondary); font-family:inherit; font-size:0.78rem; font-weight:bold; cursor:pointer;
}
.gx-back:hover { color:var(--text-primary); border-color:var(--accent); }
.gx-hero { max-width:560px; margin:0 auto; }
.gx-hero .pool-banner { cursor:default; pointer-events:none; aspect-ratio:2.2 / 1; }
.gx-fold {
  margin-bottom:12px; border-radius:12px; background:var(--bg-card); border:1px solid var(--border);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
}
.gx-fold summary {
  display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; list-style:none;
  font-weight:bold; font-size:0.95rem;
}
.gx-fold summary::-webkit-details-marker { display:none; }
.gx-fold-sub { font-size:0.75rem; font-weight:normal; color:var(--text-muted); }
.gx-fold-arrow { margin-left:auto; color:var(--text-muted); transition:transform 0.2s; flex-shrink:0; }
.gx-fold[open] .gx-fold-arrow { transform:rotate(180deg); }
.gx-fold-body { padding:0 16px 16px; }

/* ===== 通常ガチャ：全画面の演出 ===== */
.gx-overlay {
  position:fixed; inset:0; z-index:2500; display:flex; flex-direction:column; align-items:center;
  background:radial-gradient(ellipse at 50% 40%, #1d1648 0%, #0b0920 55%, #04030a 100%);
  opacity:0; transition:opacity 0.25s; overflow:hidden;
  --gx-tint:79,195,247;
}
.gx-overlay.open { opacity:1; }
.gx-overlay[hidden] { display:none; }
.gx-overlay.tint-S { --gx-tint:255,215,0; }
.gx-overlay.tint-SS { --gx-tint:255,140,220; }
/* 背景の光の筋（ゆっくり回る） */
.gx-rays {
  position:absolute; left:50%; top:42%; width:180vmax; height:180vmax; transform:translate(-50%,-50%); pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(var(--gx-tint),0.10) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 60%); mask:radial-gradient(circle, #000 0%, transparent 60%);
  animation:gxSpin 40s linear infinite; opacity:0.8; transition:opacity 0.6s;
}
.gx-overlay.tint-SS .gx-rays { animation:gxSpin 40s linear infinite, gxHue 4s linear infinite; }
@keyframes gxSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }
@keyframes gxHue { to { filter:hue-rotate(360deg); } }
/* 引いた直後の光（溜め） */
.gx-charge {
  position:absolute; left:50%; top:42%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, #fff 0%, rgba(var(--gx-tint),0.9) 35%, transparent 70%);
  opacity:0; transform:scale(0.2);
}
.gx-overlay.charging .gx-charge { animation:gxCharge 0.75s ease-in forwards; }
@keyframes gxCharge {
  0% { opacity:0; transform:scale(0.2); }
  60% { opacity:1; transform:scale(3); }
  100% { opacity:0; transform:scale(16); }
}
.gx-top {
  position:relative; z-index:2; width:100%; max-width:640px; display:flex; align-items:center; gap:10px;
  padding:14px 16px 0; box-sizing:border-box;
}
.gx-title { font-size:0.8rem; font-weight:bold; letter-spacing:0.08em; color:rgba(255,255,255,0.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gx-skip {
  margin-left:auto; padding:6px 14px; border-radius:99px; border:1px solid rgba(255,255,255,0.3);
  background:rgba(0,0,0,0.35); color:#fff; font-family:inherit; font-size:0.78rem; font-weight:800; letter-spacing:0.1em; cursor:pointer;
}
.gx-skip[hidden] { display:none; }
.gx-stage { position:relative; z-index:1; flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:0 8px; box-sizing:border-box; }
.gx-stage .gacha-cards { --cw:min(16.2vw, 104px); width:calc(5 * var(--cw) + 4 * 9px); max-width:none; column-gap:9px; row-gap:30px; }
.gx-stage .g-card { width:var(--cw); height:calc(var(--cw) * 1.39); opacity:0; transform:translateY(-60px) scale(0.5) rotate(-10deg); transition:opacity 0.3s, transform 0.4s cubic-bezier(.2,1.2,.4,1); }
.gx-stage .g-card.card-visible { opacity:1; transform:none; }
.gx-stage .g-card-back img { width:62%; height:auto; aspect-ratio:1; }
.gx-stage .g-card-back .g-name { max-width:92%; font-size:0.64rem; }
.gx-stage .g-card.single { --cw:min(34vw, 150px); }
/* SSのアップ */
.gx-closeup {
  position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:rgba(4,3,12,0.88); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); cursor:pointer; opacity:0; transition:opacity 0.25s;
}
.gx-closeup.show { opacity:1; }
.gx-closeup[hidden] { display:none; }
.gx-cu-rank {
  font-family:"Bebas Neue","Zen Kaku Gothic New",sans-serif; font-size:3rem; line-height:1; letter-spacing:0.08em;
  background:linear-gradient(90deg,#ffd700,#ff66cc,#00eeff,#ffd700); background-size:300% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:gxRankShine 2.4s linear infinite; filter:drop-shadow(0 0 12px rgba(255,200,255,0.6));
}
@keyframes gxRankShine { to { background-position:300% 0; } }
.gx-cu-icon { position:relative; width:min(52vw, 220px); aspect-ratio:1; }
.gx-cu-icon::before {
  content:''; position:absolute; inset:-14px; border-radius:26%;
  background:conic-gradient(#ffd700, #ff66cc, #00eeff, #7cff8a, #ffd700); filter:blur(10px); opacity:0.9;
  animation:gxSpinPlain 3s linear infinite;
}
@keyframes gxSpinPlain { to { transform:rotate(360deg); } }
.gx-cu-icon img { position:relative; width:100%; height:100%; object-fit:cover; border-radius:22%; border:3px solid #fff; box-shadow:0 0 40px rgba(255,255,255,0.5); }
.gx-closeup.show .gx-cu-icon { animation:gxPop 0.6s cubic-bezier(.2,1.5,.4,1) both; }
.gx-closeup.show .gx-cu-rank { animation:gxRankShine 2.4s linear infinite, gxDrop 0.5s 0.15s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes gxPop { from { transform:scale(0.2) rotate(-12deg); filter:brightness(3) blur(6px); } to { transform:none; filter:none; } }
@keyframes gxDrop { from { opacity:0; transform:translateY(-24px) scale(1.4); } to { opacity:1; transform:none; } }
.gx-cu-name { font-size:1.15rem; font-weight:900; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.8); text-align:center; padding:0 20px; }
.gx-cu-new { padding:2px 12px; border-radius:99px; background:linear-gradient(90deg,#ff5470,#ff8a3d); color:#fff; font-size:0.8rem; font-weight:900; letter-spacing:0.06em; }
.gx-cu-hint { font-size:0.72rem; color:rgba(255,255,255,0.55); margin-top:6px; }
/* 結果のボタン */
.gx-actions {
  position:relative; z-index:2; width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:0 20px calc(22px + env(safe-area-inset-bottom)); box-sizing:border-box;
  opacity:0; transform:translateY(16px); transition:opacity 0.3s, transform 0.3s;
}
.gx-actions.show { opacity:1; transform:none; }
.gx-actions[hidden] { display:none; }
.gx-actions-row { display:flex; gap:10px; width:100%; }
.gx-actions-row .btn { flex:1; justify-content:center; padding:10px; font-weight:800; min-height:52px; }
.gx-actions-row .btn.gx-again { flex:1.4; flex-direction:column; gap:1px; line-height:1.2; }
.gx-again small { font-size:0.7rem; font-weight:bold; opacity:0.85; }
.gx-points { font-size:0.75rem; color:rgba(255,255,255,0.6); }
.gx-points b { color:#fff; }
.gx-loading { color:rgba(255,255,255,0.7); }
@media (prefers-reduced-motion: reduce) {
  .gx-rays, .gx-cu-icon::before, .gx-cu-rank { animation:none !important; }
  .gx-overlay.charging .gx-charge { animation:none; }
}

/* ===== 討伐ガチャ ===== */
.sg-boss-card {
  position:relative; padding:12px 14px 12px; text-align:center; overflow:hidden; isolation:isolate;
  border-radius:14px; border:1px solid rgba(255,84,112,0.35);
  /* 暗い赤紫のパネル＋うっすら斜線 */
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, rgba(46,14,40,0.88) 0%, rgba(16,12,32,0.92) 55%, rgba(10,9,22,0.94) 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 0 24px rgba(255,84,112,0.18), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -20px 40px rgba(0,0,0,0.35);
}
/* 四隅の金のL字飾り */
.sg-boss-card::after {
  content:''; position:absolute; inset:5px; z-index:0; pointer-events:none; border-radius:10px;
  --c:rgba(224,184,74,0.85); --l:14px; --w:2px;
  background:

.pool-banner:hover .pool-banner-bg { transform:scale(1.05); }
/* 文字を読ませるための下側の暗幕 */
.pool-banner::before { content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(6,6,16,0) 35%, rgba(6,6,16,0.9) 100%); }
/* 期間限定は金枠＋光が横切る演出 */
.pool-banner.is-limited { border-color:rgba(255,215,0,0.4); box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 16px rgba(255,190,60,0.08); }
.pool-banner.is-limited::after {
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,0.07), transparent); transform:skewX(-20deg);
  animation:poolShine 6s ease-in-out infinite;
}
@keyframes poolShine { 0%, 75% { left:-60%; } 100% { left:130%; } }
/* 画像なしプールの背景：ピックアップを扇状に並べる */
.pool-fan { position:absolute; left:0; right:0; top:9%; height:60%; z-index:-2; }
.pool-fan img {
  position:absolute; left:50%; top:0; height:78%; aspect-ratio:1; object-fit:cover;
  border-radius:20%; border:2px solid #ffd700; box-shadow:0 0 6px rgba(255,215,0,0.25), 0 6px 14px rgba(0,0,0,0.6);
}
.pool-mark { position:absolute; right:-14px; top:50%; transform:translateY(-58%); z-index:-2; color:rgba(255,255,255,0.1); line-height:0; }
.pool-ribbon {
  position:absolute; top:10px; left:10px; font-size:0.64rem; font-weight:800; letter-spacing:0.14em;
  padding:3px 10px; border-radius:4px; background:linear-gradient(90deg, #ffd700, #ffb300); color:#241800;
}
.pool-chip {
  position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:4px;
  font-size:0.72rem; font-weight:bold; padding:3px 9px; border-radius:99px;
  background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2); color:#fff;
}
.pool-chip.is-hot { color:#ffb74d; border-color:rgba(255,152,0,0.6); }
.pool-bottom { position:absolute; left:14px; right:14px; bottom:12px; display:flex; align-items:flex-end; gap:10px; }
.pool-name { font-size:1.2rem; font-weight:800; line-height:1.3; text-shadow:0 2px 8px rgba(0,0,0,0.8); }

.pool-pus { display:flex; align-items:center; margin-left:auto; flex-shrink:0; }
.pool-pus img { width:40px; height:40px; object-fit:cover; border-radius:20%; border:2px solid #ffd700; margin-left:-12px; box-shadow:0 2px 8px rgba(0,0,0,0.6); }
.pool-pus img:first-child { margin-left:0; }

<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

// 通常ガチャ / 討伐ガチャの切り替え（このページはログイン必須なので全員に表示）
document.getElementById('gacha-type-tabs').style.display = 'flex';
document.getElementById('tab-btn-special').style.display = '';

let gSettings = null;
let isPulling = false;
let currentPoints = 0;
let currentGp = 0;

let selectedPoolId = null;
let gPools = [];

async function init() {
  ['/sounds/turn.mp3','/sounds/ss_sound.mp3','/sounds/s_sound.mp3','/sounds/kakutei.mp3','/sounds/putcard.mp3','/sounds/gauge_hit.mp3'].forEach(_sePreload);
  try {
    const [settings, myData, pools] = await Promise.all([
      apiFetch('/gacha/settings'),
      apiFetch('/gacha/my'),
      apiFetch('/gacha/pools')
    ]);
    gSettings = settings;
    gPools = pools;
    currentPoints = myData.points;
    currentGp = myData.gp || 0;
    updatePointsDisplay(currentPoints);
    updateGpDisplay(currentGp);
    renderPoolSelector(pools);
    loadExchangeList();

    // GP移行（未移行の場合のみ）
    try {
      const migRes = await apiFetch('/gacha/gp-migrate', { method: 'POST' });
      if (!migRes.already_done && migRes.gp_awarded > 0) {
        currentGp = migRes.new_gp;
        updateGpDisplay(currentGp);
        showGpToast(t('gacha.gp_migrated', migRes.gp_awarded));
      }
    } catch (_) {}

    updateRateInfo(settings, []);

    document.getElementById('btn-single').disabled = false;
    document.getElementById('btn-multi').disabled = false;

    renderMyIcons(myData.icons);
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

function updateRateInfo(settings, pickupIcons) {
  const ssRate = settings.ss_rate;
  const puCount = pickupIcons.length;
  let ssDetail = '';
  if (puCount > 0) {
    const puTotalRate = (puCount * 0.75).toFixed(2);
    const normalRate = Math.max(0, ssRate - puCount * 0.75);
    const puNote = getLang() === 'zh'
      ? `★PickUp各0.75%｜通常SS：${normalRate.toFixed(2)}%（均等）`
      : `★PickUp各0.75%｜通常SS：${normalRate.toFixed(2)}%（均等）`;
    ssDetail = `
      <div style="margin:4px 0 0 16px;font-size:0.75rem;color:var(--text-muted)">
        <span style="color:#ffd700">★PickUp</span>：${pickupIcons.map(p => escHtml(p.name)).join('・')}（各0.75%）<br>
        ${getLang() === 'zh' ? '通常SS' : '通常SS'}：${normalRate.toFixed(2)}%（${getLang() === 'zh' ? '均等' : '均等'}）
      </div>`;
  }
  const rateNote = getLang() === 'zh'
    ? `${puCount > 0 ? 'PickUpSSは各0.75%。' : ''}稀度內機率均等。十連最後1枚A→S保底。`
    : `${puCount > 0 ? 'PickUpSSは各0.75%。' : ''}レアリティ内の確率は均等。10連最後の1枚はAがSに変換。`;
  document.getElementById('rate-info').innerHTML = `
    <div class="rate-row">
      <span><span class="irarity irarity-SS">SS</span></span>
      <span style="font-weight:bold;color:#ffd700">${ssRate}%</span>
    </div>
    ${ssDetail}
    <div class="rate-row" style="margin-top:${puCount>0?'6px':'0'}">
      <span><span class="irarity irarity-S">S</span></span>
      <span style="font-weight:bold;color:#e0c060">${settings.s_rate}%</span>
    </div>
    <div class="rate-row">
      <span><span class="irarity irarity-A">A</span></span>
      <span style="font-weight:bold;color:#4fc3f7">${settings.a_rate}%</span>
    </div>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;text-align:center">${rateNote}</p>`;
}

function updatePointsDisplay(pts) {
  document.getElementById('my-points').textContent = Number(pts).toLocaleString('ja-JP');
}
function updateGpDisplay(gp) {
  document.getElementById('my-gp').textContent = Number(gp).toLocaleString('ja-JP');
}

function poolDaysLabel(end_at) {
  if (!end_at) return '';
  const now = Date.now();
  const end = new Date(end_at).getTime();
  const diff = end - now;
  if (diff <= 0) return '';
  const totalHours = diff / (1000 * 60 * 60);
  if (totalHours < 24) {
    const h = Math.ceil(totalHours);
    return `<span style="font-size:0.72rem;font-weight:bold;color:#ff9800">${t('gacha.hours_left', h)}</span>`;
  }
  const days = Math.ceil(totalHours / 24);
  const color = days <= 3 ? '#ff9800' : 'var(--text-muted)';
  return `<span style="font-size:0.72rem;font-weight:bold;color:${color}">${t('gacha.days_left', days)}</span>`;
}

// 画像のないプールの背景色（プールごとに色を変えて並んだときに単調にならないように）
const POOL_FALLBACK_BG = [
  'linear-gradient(135deg, #2a1d55 0%, #162447 55%, #0b1a33 100%)',
  'linear-gradient(135deg, #4a1433 0%, #2a1240 55%, #120b2a 100%)',
  'linear-gradient(135deg, #0e3b4d 0%, #14305a 55%, #0b1a33 100%)',
  'linear-gradient(135deg, #3d2a10 0%, #3a1630 55%, #140b24 100%)',
];

function poolTimeChip(end_at) {
  if (!end_at) return '';
  const hours = (new Date(end_at).getTime() - Date.now()) / (1000 * 60 * 60);
  if (hours <= 0) return '';
  const text = hours < 24 ? t('gacha.hours_left', Math.ceil(hours)) : t('gacha.days_left', Math.ceil(hours / 24));
  const clock = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  return `<span class="pool-chip${hours <= 72 ? ' is-hot' : ''}">${clock}${text}</span>`;
}

// ピックアップを扇状に並べる（画像のないプールの背景用）。右に行くほど上に重ねる
function poolFanHTML(pickups) {
  const icons = pickups.slice(0, 5);
  const mid = (icons.length - 1) / 2;
  return `<div class="pool-fan">${icons.map((pu, i) => {
    const d = i - mid;
    const style = `transform:translateX(${-50 + d * 62}%) translateY(${Math.abs(d) * 9}%) rotate(${d * 7}deg);z-index:${10 + i}`;
    return `<img src="${escHtml(thumbUrl(pu.image_url))}" alt="" style="${style}">`;
  }).join('')}</div>`;
}

function poolBannerHTML(p, idx) {
  const pickups = p.pickup_icons || [];
  const isLimited = !!p.end_at;
  let visual;
  if (p.image_url) {
    visual = `<div class="pool-banner-bg" style="background-image:url('${escHtml(mediumUrl(p.image_url))}')"></div>`;
  } else {
    visual = `<div class="pool-banner-bg" style="background-image:${POOL_FALLBACK_BG[idx % POOL_FALLBACK_BG.length]}"></div>`

async function loadExchangeList(pickupIds = null) {
  const container = document.getElementById('exchange-ss-list');
  try {
    const iconUrl = selectedPoolId ? `/gacha/pools/${selectedPoolId}/icons` : '/gacha/icons';
    const [icons, myData] = await Promise.all([apiFetch(iconUrl), apiFetch('/gacha/my')]);
    const ownedIds = new Set((myData.icons || []).map(i => i.id));
    let ss = icons.filter(i => i.rarity === 'SS' && !ownedIds.has(i.id));
    if (pickupIds && pickupIds.length > 0) {
      const pickupSet = new Set(pickupIds);
      ss = ss.filter(i => pickupSet.has(i.id));
    }
    if (ss.length === 0) { container.innerHTML = `<div style="color:var(--text-muted);font-size:0.85rem">${t('gacha.no_exchange')}</div>`; return; }
    container.innerHTML = ss.map(i => `
      <div style="text-align:center;cursor:pointer" onclick="askExchange(${i.id}, '${escHtml(i.name).replace(/'/g, "\\'")}', '${escHtml(thumbUrl(i.image_url)).replace(/'/g, "\\'")}')">
        <img src="${escHtml(thumbUrl(i.image_url))}" style="width:64px;height:64px;object-fit:contain;border-radius:20%;border:2px solid #ffd700;display:block;margin:0 auto 4px">
        <div style="font-size:0.7rem;color:#ffd700;word-break:break-all">${escHtml(i.name)}</div>
      </div>
    `).join('');

    container.innerHTML = `<div style="color:var(--text-muted);font-size:0.85rem">${t('error')}</div>`;
  }
}

let _pendingExchange = null;

function askExchange(iconId, iconName, iconImg) {
  if (isPulling) return;
  if (currentGp < 200) {
    showGpToast(t('gacha.gp_short', currentGp, 200), true);
    return;
  }
  _pendingExchange = { iconId, iconName };
  document.getElementById('exchange-modal-img').src = iconImg;
  document.getElementById('exchange-modal-name').textContent = `【SS】${iconName}`;
  const modal = document.getElementById('exchange-modal');
  if (modal.style.display !== 'flex') lockBodyScroll();
  modal.style.display = 'flex';
}

function closeExchangeModal() {
  const modal = document.getElementById('exchange-modal');
  if (modal.style.display !== 'none') unlockBodyScroll();
  modal.style.display = 'none';
  _pendingExchange = null;
}

async function confirmExchange() {
  if (!_pendingExchange) return;
  const { iconId } = _pendingExchange;
  closeExchangeModal();
  isPulling = true;
  updateGpDisplay(currentGp);
  try {
    const res = await apiFetch('/gacha/exchange', { method: 'POST', body: JSON.stringify({ icon_id: iconId }) });
    currentGp = res.new_gp;
    updateGpDisplay(currentGp);
    const r = res.result;
    await animatePull([r], { title: 'GP交換' });
    closeGxOverlay();
    if (r.is_dup && r.dup_pts > 0) showGpToast(`<span style="color:#ffd700">【SS】${escHtml(r.name)}</span>（${t('gacha.dup_return', r.dup_pts)}）`);
    const myData = await apiFetch('/gacha/my');
    renderMyIcons(myData.icons);
    loadExchangeList();
  } catch (err) {
    showGpToast(err.message || 'エラーが発生しました', true);
  } finally {
    isPulling = false;
    updateGpDisplay(currentGp);
  }
}

function animateCount(from, to, duration) {
  return new Promise(resolve => {
    const start = performance.now();
    const diff = to - from;
    function step(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
      updatePointsDisplay(Math.round(from + diff * ease));
      if (t < 1) requestAnimationFrame(step);
      else { updatePointsDisplay(to); resolve(); }
    }
    requestAnimationFrame(step);
  });
}

async function doPull(type) {
  if (isPulling) return;
  isPulling = true;
  _getAudioCtx(); // ユーザー操作中にAudioContextをアンロック
  const btnS = document.getElementById('btn-single');
  const btnM = document.getElementById('btn-multi');
  btnS.disabled = true;
  btnM.disabled = true;
  clearAlert('#alert');

  let next = 'close';
  const overlayOpen = !!document.getElementById('gx-overlay') && !document.getElementById('gx-overlay').hidden;
  const title = (gPools.find(p => p.id === selectedPoolId) || {}).name || t('gacha.title') || '';
  try {
    // 「もう一度引く」のときは演出の画面のまま通信中を出す
    if (overlayOpen) openGxOverlay(title);
    const body = selectedPoolId ? JSON.stringify({ pool_id: selectedPoolId }) : '{}';
    const res = await apiFetch(`/gacha/pull/${type}`, { method: 'POST', body });
    // コスト分を即座に減らす
    const dupTotal = res.results.reduce((s, r) => s + (r.dup_pts || 0), 0);
    const afterCost = res.new_points - dupTotal;
    animateCount(currentPoints, afterCost, 350);
    currentPoints = res.new_points;
    if (res.new_gp != null) { currentGp = res.new_gp; updateGpDisplay(currentGp); }

    next = await animatePull(res.results, { againType: type, title });

    // 重複補償を返却
    if (dupTotal > 0) await showDupReturn(afterCost, res.new_points, dupTotal);

    apiFetch('/gacha/my').then(myData => renderMyIcons(myData.icons)).catch(() => {});
  } catch (err) {
    next = 'close';
    closeGxOverlay();
    showAlert('#alert', err.message);
  } finally {
    isPulling = false;
    btnS.disabled = false;
    btnM.disabled = false;
  }
  if (next === 'again') doPull(type);
  else closeGxOverlay();
}

let _audioCtx = null;
const _audioBuffers = {};

function _getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

async function _sePreload(src) {
  if (_audioBuffers[src]) return;
  try {
    const buf = await fetch(src).then(r => r.arrayBuffer());
    const ctx = _getAudioCtx();
    _audioBuffers[src] = await ctx.decodeAudioData(buf);
  } catch (e) {}
}

const GACHA_MUTE_KEY = 'hbr_gacha_muted';
let _gachaMuted = false;
try { _gachaMuted = localStorage.getItem(GACHA_MUTE_KEY) === '1'; } catch (_) {}
function renderGachaMute() {

    ? '<path d="M16 9l5 6M21 9l-5 6"/>'
    : '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'}</svg>`;

  renderGachaMute();
}
renderGachaMute();

function _sePlay(src) {
  if (_gachaMuted) return null;
  const ctx = _getAudioCtx();
  const buf = _audioBuffers[src];
  if (!buf) return null;
  const src_ = ctx.createBufferSource();
  src_.buffer = buf;
  src_.connect(ctx.destination);
  src_.start(0);
  return src_;
}

function _seStop(node) {
  if (!node) return;
  try { node.stop(); } catch (e) {}
}

// 演出の画面を開く（開いていれば中身だけ入れ替える）。引く通信中はくるくるを出す

// SSを大きく見せる。タップか一定時間で閉じる
function _gxCloseup(icon) {
  const cu = document.getElementById('gx-closeup');
  cu.innerHTML = `
    <div class="gx-cu-rank">SS</div>
    <div class="gx-cu-icon"><img src="${escHtml(icon.image_url)}" alt="${escHtml(icon.name)}"></div>

    ${icon.is_dup ? '' : '<div class="gx-cu-new">NEW</div>'}
    <div class="gx-cu-hint">タップで次へ</div>`;
  cu.hidden = false;
  requestAnimationFrame(() => cu.classList.add('show'));
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      cu.removeEventListener('click', finish);
      cu.classList.remove('show');
      setTimeout(() => { cu.hidden = true; resolve(); }, 220);
    };
    setTimeout(() => cu.addEventListener('click', finish), 400); // 出た直後の誤タップで飛ばさない
    setTimeout(finish, 3200);
  });
}

// カードを配ってめくる演出。最後に結果とボタンを出し、押されたボタン（'again' / 'close'）を返す。
// againType: 「もう一度引く」の種類（'single' / 'multi'）。null ならボタンを出さない（GP交換など）
async function animatePull(results, { againType = null, title = '' } = {}) {
  const ov = openGxOverlay(title);
  const stage = document.getElementById('gx-stage');
  stage.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'gacha-cards';
  stage.appendChild(wrap);

  // めくる前のカードに見せるレアリティ（たまに低く見せてから化けさせる）
  const dispRarities = results.map(icon => {
    if (icon.rarity === 'SS') {
      const r = Math.random();
      if (r < 0.70) return 'SS';
      if (r < 0.90) return 'S';
      return 'A';
    }
    if (icon.rarity === 'S') return Math.random() < 0.75 ? 'S' : 'A';
    return 'A';
  });
  const tint = dispRarities.includes('SS') ? 'SS' : dispRarities.includes('S') ? 'S' : 'A';
  ov.classList.add(`tint-${tint}`);

  const cardEls = results.map((icon, i) => {
    const card = document.createElement('div');
    card.className = `g-card rarity-${icon.rarity} display-rarity-${dispRarities[i]}${results.length === 1 ? ' single' : ''}`;
    card.innerHTML = `
      <div class="g-card-inner" id="gc-${i}">
        <div class="g-card-front"><img src="/img/logo.png" alt="" style="width:70%;height:70%;object-fit:contain;opacity:0.7"></div>
        <div class="g-card-back">
          <img src="${escHtml(thumbUrl(icon.image_url))}" alt="${escHtml(icon.name)}">
          <div class="g-name">${escHtml(icon.name)}</div>
          ${icon.is_dup ? '' : '<span class="g-new">NEW</span>'}
        </div>
      </div>`;
    wrap.appendChild(card);
    return card;
  });

  // SKIP：SS以外の演出を飛ばす（SSのアップは必ず見せる）
  let skip = false;
  const skipBtn = document.getElementById('gx-skip');
  skipBtn.hidden = false;
  skipBtn.onclick = () => { skip = true; skipBtn.hidden = true; cardEls.forEach(c => c.classList.add('card-visible')); };

  // 溜め：虹（SS確定）なら確定音
  let kakuteiAudio = null;
  if (tint === 'SS') kakuteiAudio = _sePlay('/sounds/kakutei.mp3');
  ov.classList.remove('charging'); void ov.offsetWidth; ov.classList.add('charging');
  await _gxWait(tint === 'SS' ? 900 : 650);

  // 配る
  for (const card of cardEls) {
    if (skip) break;
    _sePlay('/sounds/putcard.mp3');
    card.classList.add('card-visible');
    await _gxWait(130);
  }
  cardEls.forEach(c => c.classList.add('card-visible'));
  if (!skip) await _gxWait(600);
  _seStop(kakuteiAudio);

  // めくる
  for (let i = 0; i < results.length; i++) {
    const icon = results[i];
    const actual = icon.rarity;
    const isFakeout = dispRarities[i] !== actual;
    const card = cardEls[i];
    if (i > 0 && !skip) await _gxWait(results.length === 1 ? 0 : 260);

    if (actual === 'SS' || (!skip && (isFakeout || actual === 'S'))) {
      if (isFakeout) {
        card.classList.remove(`display-rarity-${dispRarities[i]}`);
        card.classList.add(`display-rarity-${actual}`);
      }
      const audio = actual === 'SS' ? _sePlay('/sounds/ss_sound.mp3') : actual === 'S' ? _sePlay('/sounds/s_sound.mp3') : null;
      await _gxWait(80);
      card.classList.add(`reveal-${actual}`);
      await _gxWait(actual === 'SS' ? 1250 : 950);
      _seStop(audio);
      card.classList.remove(`reveal-${actual}`);
    }

    _sePlay('/sounds/turn.mp3');
    document.getElementById(`gc-${i}`).classList.add('flipped');
    if (actual === 'SS') {
      await _gxWait(450);
      await _gxCloseup(icon);
    }
  }
  skipBtn.hidden = true;
  await _gxWait(skip ? 500 : 700);

  // 結果のボタン
  const actions = document.getElementById('gx-actions');
  const cost = againType === 'single' ? gSettings?.single_cost : againType === 'multi' ? gSettings?.multi_cost : null;
  const againLabel = `<span>もう一度引く</span><small>${againType === 'single' ? '単発' : '10連'} ${cost}pt</small>`;
  const canAgain = againType && cost != null && currentPoints >= cost;
  actions.innerHTML = `
    <div class="gx-points">所持 <b>${Number(currentPoints).toLocaleString('ja-JP')}</b> pt</div>
    <div class="gx-actions-row">
      <button type="button" class="btn btn-secondary" data-act="close">閉じる</button>
      ${againType ? `<button type="button" class="btn btn-primary gx-again" data-act="again"${canAgain ? '' : ' disabled'}>${againLabel}</button>` : ''}
    </div>`;
  actions.hidden = false;
  requestAnimationFrame(() => actions.classList.add('show'));

  return new Promise(resolve => {
    const onKey = e => { if (e.key === 'Escape') done('close'); };
    function done(act) {
      document.removeEventListener('keydown', onKey);
      actions.querySelectorAll('button').forEach(b => { b.onclick = null; });
      resolve(act);
    }
    actions.querySelectorAll('button[data-act]').forEach(b => { b.onclick = () => done(b.dataset.act); });
    document.addEventListener('keydown', onKey);
  });
}

};

function renderSgEffects(progress) {
  const row = document.getElementById('sg-effects-row');
  row.innerHTML = Object.keys(SG_EFFECT_LABELS)
    .filter(k => progress[k] > 0)
    .map(k => {
      const cls = k.startsWith('enemybuff') ? 'unfav' : 'fav';
      // 文字の代わりにカードと同じ絵柄＋残り回数。効果名は title（長押し・マウスオーバー）と読み上げで補う
      const [base, badge] = SG_ICON_MAP[k];
      const label = `${SG_EFFECT_LABELS[k]} 残り${progress[k]}`;
      return `<span class="sg-eff-badge ${cls}" title="${label}" aria-label="${label}"><span class="sg-icon-stack" aria-hidden="true">${sgSvg(base)}${badge ? sgBadgeSvg(badge) : ''}</span>${progress[k]}</span>`;

function updateSgDefeatedUi(defeated) {
  document.getElementById('sg-defeated-banner').hidden = !defeated;

let sgMaxDestruction = 999.0;
function renderSgDestructionRate(rate) {
  document.getElementById('sg-destruction-rate').textContent = `${Number(rate).toFixed(1)}/${sgMaxDestruction.toFixed(1)}%`;
}

function renderSgHp(hp, maxHp) {
  const pct = Math.max(0, hp / maxHp * 100);
  const ghost = document.getElementById('sg-hp-ghost');
  // 回復で増えたときは残像を即座に合わせ、減ったときだけ遅れて縮める
  if (pct > parseFloat(ghost.style.width || '100')) {
    ghost.style.transition = 'none';
    ghost.style.width = pct + '%';
    void ghost.offsetWidth;
    ghost.style.transition = '';
  } else {
    ghost.style.width = pct + '%';
  }
  document.getElementById('sg-hp-bar').style.width = pct + '%';
}

// ボスの被弾リアクション（揺れ＋ダメージ数字）
function sgBossReact(r) {
  const wrap = document.getElementById('sg-boss-portrait-wrap');
  let cls = null, text = null, popCls = '';
  if (r.category === 'damage' && r.blocked) { cls = 'is-blocked'; text = r.blocked_dmg; popCls = 'blocked'; }
  else if (r.category === 'damage' && r.dmg > 0) { const big = r.key === 'ultra'; cls = big ? 'is-hit-big' : 'is-hit'; text = r.dmg.toLocaleString('ja-JP'); popCls = big ? 'big' : ''; }
  else if (r.dmg < 0 && !r.overkill) { text = '+' + (-r.dmg).toLocaleString('ja-JP'); popCls = 'heal'; }
  if (cls) {
    wrap.classList.remove('is-hit', 'is-hit-big', 'is-blocked');
    void wrap.offsetWidth; // 連続ヒットでもアニメーションをやり直す
    wrap.classList.add(cls);
  }
  if (text != null) {
    const pop = document.createElement('span');
    pop.className = 'sg-dmg-pop ' + popCls;
    pop.textContent = text;
    wrap.appendChild(pop);
    setTimeout(() => pop.remove(), 1300);
  }
}

// 討伐の瞬間：ボスが光って砕けるように消えてから結果を出す
async function sgPlayDefeat() {
  const wrap = document.getElementById('sg-boss-portrait-wrap');
  wrap.classList.remove('is-hit', 'is-hit-big', 'is-blocked');

  flash.className = 'sg-defeat-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 800);
  _sePlay('/sounds/ss_sound.mp3');

  await new Promise(r => setTimeout(r, 950));

  wrap.classList.add('is-defeated');
}

// シールドギミックの敵だけ表示。0になっても復活しうるので、バーは消さずに「BREAK」表示にする
let sgMaxShield = 0;
let sgShieldNow = 0;
function renderSgShield(shield, animate = false) {
  const row = document.getElementById('sg-shield-row');
  row.hidden = !sgMaxShield;
  if (!sgMaxShield) return;
  const broken = shield <= 0;
  row.classList.toggle('is-broken', broken);
  document.getElementById('sg-shield-state').textContent = broken ? 'SHIELD BREAK' : 'SHIELD';
  document.getElementById('sg-shield-num').textContent = `${Math.max(0, shield)}/${sgMaxShield}`;
  document.getElementById('sg-shield-bar').style.width = Math.max(0, shield / sgMaxShield * 100) + '%';
  if (animate && (sgShieldNow > 0) !== (shield > 0)) {
    const card = document.querySelector('.sg-boss-card');
    const cls = broken ? 'sg-shield-break' : 'sg-shield-up';
    card.classList.remove('sg-shield-break', 'sg-shield-up');
    void card.offsetWidth; // 連続で発生してもアニメーションをやり直す
    card.classList.add(cls);
  }
  sgShieldNow = shield;
}

// ===== ゲージアクション =====
let sgGaugeTiers = null; // ギミックがゲージアクションのときだけ入る（[{ name, min, mult }]）
let sgGaugeAuto = 0.45;
const SG_GAUGE_COLORS = { PERFECT: '#ffd700', GREAT: '#49d6a8', GOOD: '#4fc3f7', MISS: '#8888aa' };
// バーの帯は重ねて描くので、半透明にすると色が混ざる。暗めの不透明色で描く
const SG_GAUGE_ZONE_COLORS = { PERFECT: '#c9a21c', GREAT: '#237a63', GOOD: '#1f4d66' };

// 判定幅（精度 = 1 - |位置|）をバーの色帯として描く
function renderSgGaugeZones() {
  const bar = document.getElementById('sg-gauge-bar');
  bar.querySelectorAll('.sg-gauge-zone').forEach(z => z.remove());
  [...sgGaugeTiers].reverse().forEach(t => {
    if (t.min <= 0) return;
    const half = (1 - t.min) * 50; // 位置|x|<=1-min の範囲を%に
    const z = document.createElement('div');
    z.className = 'sg-gauge-zone';
    z.style.cssText = `left:${50 - half}%;width:${half * 2}%;background:${SG_GAUGE_ZONE_COLORS[t.name] || SG_GAUGE_COLORS[t.name]}`;
    bar.insertBefore(z, document.getElementById('sg-gauge-marker')); // 外側(GOOD)から順に描き、内側を上に重ねる
  });
}

// マーカーが左右に往復するのをタップで止める。精度(0〜1)を返す。一定時間で自動（GOOD相当）
function playSgGauge(index, total) {
  return new Promise(resolve => {
    const overlay = document.getElementById('sg-gauge-overlay');
    const marker = document.getElementById('sg-gauge-marker');
    const result = document.getElementById('sg-gauge-result');
    const hint = document.getElementById('sg-gauge-hint');
    document.getElementById('sg-gauge-count').textContent = total > 1 ? `${index + 1}/${total}` : '';
    result.textContent = '';
    result.className = 'sg-gauge-result';
    const dmgEl = document.getElementById('sg-gauge-dmg');
    dmgEl.textContent = '';
    dmgEl.className = 'sg-gauge-dmg';
    hint.textContent = '中心に近いところでタップ！';
    renderSgGaugeZones();
    overlay.hidden = false;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const period = reduced ? 2400 : 1200;
    const start = performance.now();
    let pos = -1, raf = 0, done = false;
    const tick = now => {
      pos = -Math.cos(((now - start) / period) * Math.PI * 2);
      marker.style.left = ((pos + 1) / 2 * 100) + '%';
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const finish = (accuracy, auto) => {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      clearTimeout(autoTimer);
      overlay.removeEventListener('pointerdown', onTap);
      document.removeEventListener('keydown', onKey);
      hint.textContent = auto ? '時間切れ（自動発動）' : '';
      resolve(accuracy);
    };
    const onTap = e => { e.preventDefault(); finish(1 - Math.abs(pos), false); };
    const onKey = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); finish(1 - Math.abs(pos), false); } };
    const autoTimer = setTimeout(() => finish(sgGaugeAuto, true), 6000);
    // 直前のカードめくりのタップが誤って入らないよう少し待ってから受け付ける
    setTimeout(() => { if (!done) { overlay.addEventListener('pointerdown', onTap); document.addEventListener('keydown', onKey); } }, 250);
  });
}

// 発動待ちのゲージ攻撃を順に遊んでダメージを確定する
async function runSgGauges(tokens) {
  const out = { defeated: false, awarded_icon: null, progress: null, total: 0 };
  const overlay = document.getElementById('sg-gauge-overlay');
  for (let i = 0; i < tokens.length; i++) {
    const accuracy = await playSgGauge(i, tokens.length);
    let res;
    try {
      res = await apiFetch('/special-gacha/gauge', { method: 'POST', body: JSON.stringify({ token: tokens[i], accuracy }) });
    } catch (err) {
      overlay.hidden = true;
      showAlert('#alert', err.message);
      break;
    }
    const result = document.getElementById('sg-gauge-result');
    result.textContent = `${res.tier}  ×${res.mult}`;
    result.style.color = SG_GAUGE_COLORS[res.tier];
    void result.offsetWidth;
    result.classList.add('pop');
    const dmgEl = document.getElementById('sg-gauge-dmg');
    dmgEl.textContent = res.dmg.toLocaleString('ja-JP');
    dmgEl.classList.add('pop');
    _sePlay('/sounds/gauge_hit.mp3'); // 判定に関係なく同じ打撃音
    sgBossReact({ category: 'damage', key: res.tier === 'PERFECT' ? 'ultra' : 'crit', dmg: res.dmg, overkill: res.overkill });
    renderSgHp(res.progress.current_hp, sgCurrentEnemy.max_hp);
    out.total += res.overkill ? 0 : res.dmg;
    out.progress = res.progress;
    if (res.defeated) { out.defeated = true; out.awarded_icon = res.awarded_icon; }
    await new Promise(r => setTimeout(r, 1100));
    overlay.hidden = true;
    await new Promise(r => setTimeout(r, 250));
  }
  overlay.hidden = true;
  return out;
}

// ページを開いたときに発動待ちが残っていたら、その場で発動できるようにする
async function resumeSgGauges() {
  const btn = document.getElementById('sg-pull-btn');
  const pending = (sgLastProgress && sgLastProgress.pending_gauge) || [];
  if (!pending.length) return;
  btn.disabled = true;
  const g = await runSgGauges(pending.map(p => p.token));
  document.getElementById('sg-battle-log').innerHTML = `ゲージ攻撃で <b>${g.total.toLocaleString('ja-JP')}</b> ダメージ`;
  await finishSgTurn(g.progress || sgLastProgress, g.defeated, g.awarded_icon);
}

let sgLastProgress = null;
// 1回分（10連＋ゲージ）の最後に画面を最新の状態にそろえる
async function finishSgTurn(progress, defeated, awardedIcon) {
  sgLastProgress = progress;
  if (defeated) await sgPlayDefeat();
  renderSgHp(progress.current_hp, sgCurrentEnemy.max_hp);
  renderSgShield(progress.shield);
  renderSgDestructionRate(progress.destruction_rate);
  renderSgEffects(progress);
  updateSgDefeatedUi(!!progress.defeated_at);
  document.getElementById('sg-pull-btn').disabled = !!progress.defeated_at;
  if (!progress.defeated_at) setSgPullCollapsed(false);
  if (defeated && awardedIcon) {
    document.getElementById('sg-ssr-icon-img').src = awardedIcon.image_url;
    document.getElementById('sg-ssr-name').textContent = `限定アイコン「${awardedIcon.name}」を獲得！`;
    document.getElementById('sg-defeat-overlay').classList.add('show');
  }
}

async function toggleSgRates() {
  const panel = document.getElementById('sg-rates-panel');

  const opening = !panel.classList.contains('open');

  if (opening && !sgRatesLoaded) {

        ? `<div class="sg-rates-group"><div class="sg-rates-group-title">ギミック: ${escHtml(data.gimmick.label)}</div><div class="sg-rates-group-p">${escHtml(data.gimmick.description)}</div></div>`
        : '';
      panel.innerHTML = gimmickNote + data.categories.map(cat => `

          <div class="sg-rates-group-title">${escHtml(cat.label)}</div>
          <div class="sg-rates-group-p">1段階目の抽選率: ${(cat.p * 100).toFixed(0)}%</div>
          ${cat.items.map(it => `

function sgSvg(name) {
  return `<svg viewBox="0 0 24 24" fill="currentColor" class="sg-svg-icon">${SG_SVG_BASE[name]}</svg>`;
}
function sgBadgeSvg(name) {
  return `<svg viewBox="0 0 24 24" class="sg-svg-badge">${SG_SVG_BADGE[name]}</svg>`;
}

function sgCardVisual(r) {
  if (r.category === 'damage' && r.blocked) {
    return { icon: sgSvg('barrier'), val: `<span class="sg-dmg-num${String(r.blocked_dmg).length >= 5 ? ' is-long' : ''}">${r.blocked_dmg}</span><span class="sg-dmg-label">防がれた</span>` };
  }
  if (r.category === 'gauge') {
    return { icon: sgSvg('target'), val: 'ゲージ攻撃' };
  }
  if (r.category === 'damage' && r.overkill) {
    return { icon: sgSvg('sword'), val: `<span class="sg-dmg-num${String(r.dmg).length >= 5 ? ' is-long' : ''}">${r.dmg}</span><span class="sg-dmg-label">オーバーキル</span>` };
  }
  if (r.category === 'damage') {
    return { icon: sgSvg('sword'), val: `<span class="sg-dmg-num${String(r.dmg).length >= 5 ? ' is-long' : ''}">${r.dmg}</span><span class="sg-dmg-label">ダメージ</span>` };
  }
  const label = r.label.replace(/[()]/g, '');
  if (r.category === 'destruction') {
    return { icon: sgSvg('burst'), val: `破壊率<br>+${r.amount}%` };
  }
  const [base, badge] = SG_ICON_MAP[r.key] || ['star', null];
  const iconHtml = sgSvg(base) + (badge ? sgBadgeSvg(badge) : '');
  // シールドの増減は量が大事なので数字で見せる（破壊率カードと同じ形）
  if (r.key && r.key.startsWith('shield_')) {
    const sign = r.key.startsWith('shield_regen') ? '+' : '-';
    return { icon: `<span class="sg-icon-stack">${iconHtml}</span>`, val: `シールド<br>${sign}${r.amount}` };
  }
  return { icon: `<span class="sg-icon-stack">${iconHtml}</span>`, val: label };
}

// 通常ガチャのanimatePull()と同じ演出(カード出現→タップでスキップ→めくり音→フリップ)を流用し、
// レアリティ判定・フェイクアウト・SS/S演出だけを省いたもの。
async function animateSpecialPull(results) {
  const stage = document.getElementById('sg-stage');
  stage.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'gacha-cards';
  stage.appendChild(wrap);

  const cardEls = [];
  results.forEach((r, i) => {
    const isBigDamage = r.category === 'damage' && r.key === 'ultra' && !r.blocked;
    const isLargeEffect = (r.key && r.key.endsWith('_large')) || r.key === 'destruction_100';
    const cls = `cat-${r.category}` + (r.blocked ? ' is-blocked' : '') + ((isBigDamage || isLargeEffect) ? ' sg-glow' : '');
    const { icon, val } = sgCardVisual(r);
    const card = document.createElement('div');
    card.className = 'g-card';
    card.innerHTML = `
      <div class="g-card-inner" id="sg-gc-${i}">
        <div class="g-card-front"><img src="/img/logo.png" alt="" style="width:70%;height:70%;object-fit:contain;opacity:0.7"></div>
        <div class="g-card-back sg-card-back ${cls}">
          ${r.overkill ? '<span class="sg-overkill-tag">OVERKILL</span>' : ''}
          <div class="sg-card-icon">${icon}</div>
          ${val ? `<div class="sg-card-val">${val}</div>` : ''}
        </div>
      </div>`;
    wrap.appendChild(card);
    cardEls.push(card);
  });

  // フェーズ1: カードを1枚ずつ表示（タップで即時全表示）
  await new Promise(resolve => {
    let idx = 0;
    let timer = null;
    let done = false;

    const showAll = () => {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      cardEls.forEach(c => c.classList.add('card-visible'));
      stage.style.cursor = '';
      stage.removeEventListener('click', onTap);
      setTimeout(resolve, 1000);
    };
    const showNext = () => {
      if (done) return;
      _sePlay('/sounds/putcard.mp3');
      cardEls[idx].classList.add('card-visible');
      idx++;
      if (idx >= results.length) {
        done = true;
        stage.style.cursor = '';
        stage.removeEventListener('click', onTap);
        setTimeout(resolve, 1000);
      } else {
        timer = setTimeout(showNext, 220);
      }
    };
    const onTap = () => showAll();
    stage.style.cursor = 'pointer';
    stage.addEventListener('click', onTap);
    timer = setTimeout(showNext, 80);
  });

  // フェーズ2: 1枚ずつめくる（タップでスキップ＝間隔短縮）
  let skipFlip = false;
  const onSkipTap = () => { skipFlip = true; stage.removeEventListener('click', onSkipTap); stage.style.cursor = ''; };
  stage.style.cursor = 'pointer';
  stage.addEventListener('click', onSkipTap);

  const stagger = results.length === 1 ? 0 : 500;
  for (let i = 0; i < results.length; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, skipFlip ? 30 : stagger));
    _sePlay('/sounds/turn.mp3');
    await new Promise(r => setTimeout(r, 100));
    document.getElementById(`sg-gc-${i}`).classList.add('flipped');
    sgBossReact(results[i]);
    renderSgHp(results[i].hp_after, sgCurrentEnemy.max_hp);
    if (results[i].state_after) {
      renderSgEffects(results[i].state_after);
      renderSgDestructionRate(results[i].state_after.destruction_rate);
      renderSgShield(results[i].state_after.shield, true);
    }
  }

  stage.removeEventListener('click', onSkipTap);
  stage.style.cursor = '';
  await new Promise(r => setTimeout(r, 700));
}

function setSgPullCollapsed(collapsed) {
  document.getElementById('sg-pull-wrap').classList.toggle('is-collapsed', collapsed);
}

async function doSpecialPull() {
  const btn = document.getElementById('sg-pull-btn');
  btn.disabled = true;
  setSgPullCollapsed(true);
  try {
    const data = await apiFetch('/special-gacha/pull', { method: 'POST' });
    await animateSpecialPull(data.results);
    // ゲージアクション：10枚めくり終わったら、チャージしたゲージ攻撃を順に発動
    const gauge = await runSgGauges(data.results.filter(r => r.gauge_token).map(r => r.gauge_token));
    const progress = gauge.progress || data.progress;
    const defeated = data.defeated || gauge.defeated;
    const awardedIcon = data.awarded_icon || gauge.awarded_icon;

    const totalDmg = data.results.reduce((s, r) => s + (r.dmg > 0 && !r.overkill ? r.dmg : 0), 0);
    const overkillDmg = data.results.reduce((s, r) => s + (r.dmg > 0 && r.overkill ? r.dmg : 0), 0);
    const blockedCount = data.results.filter(r => r.blocked).length;
    const notes = [];
    if (blockedCount) notes.push(`シールドに ${blockedCount} 回防がれた`);
    if (gauge.total) notes.push(`ゲージ攻撃 ${gauge.total.toLocaleString('ja-JP')}`);
    if (data.leftover_gauge_damage) notes.push(`前回のゲージ攻撃 ${data.leftover_gauge_damage.toLocaleString('ja-JP')}`);
    if (overkillDmg) notes.push(`オーバーキル ${overkillDmg.toLocaleString('ja-JP')}`);
    document.getElementById('sg-battle-log').innerHTML = `今回の10連で <b>${(totalDmg + gauge.total).toLocaleString('ja-JP')}</b> ダメージ` + (notes.length ? `（${notes.join('・')}）` : '');
    currentPoints = data.new_points;
    updatePointsDisplay(currentPoints);
    await finishSgTurn(progress, defeated, awardedIcon);
  } catch (err) {
    showAlert('#alert', err.message);
    btn.disabled = false;
    setSgPullCollapsed(false);
  }
}

let _lastPoolModalPoolId = null;
async function openPoolModal() {
  const modal = document.getElementById('pool-modal');
  if (modal.style.display !== 'flex') lockBodyScroll();
  modal.style.display = 'flex';
  if (_lastPoolModalPoolId === selectedPoolId) return;
  _lastPoolModalPoolId = selectedPoolId;
  document.getElementById('pool-list').innerHTML = `<div class="loading"><div class="spinner"></div>${t('loading')}</div>`;
  try {
    const icons = selectedPoolId
      ? await apiFetch(`/gacha/pools/${selectedPoolId}/icons`)
      : await apiFetch('/gacha/icons');
    const order = ['SS', 'S', 'A'];
    const grouped = {};
    order.forEach(r => grouped[r] = []);
    icons.forEach(ic => { if (grouped[ic.rarity]) grouped[ic.rarity].push(ic); });
    // ピックアップを各レアリティ内の先頭へ
    order.forEach(r => grouped[r].sort((a, b) => (b.is_pickup ? 1 : 0) - (a.is_pickup ? 1 : 0)));
    const rarityColors = { SS: '#ffd700', S: '#e0c060', A: '#4fc3f7' };
    document.getElementById('pool-list').innerHTML = order.map(r => {
      if (!grouped[r].length) return '';
      const pickupCount = grouped[r].filter(ic => ic.is_pickup).length;
      return `
        <div style="margin-bottom:18px">
          <div style="font-size:0.82rem;font-weight:bold;color:${rarityColors[r]};margin-bottom:8px">${r}${getLang()==='zh'?'稀':'レア'}（${grouped[r].length}${getLang()==='zh'?'種':'種'}）${pickupCount > 0 ? `<span style="font-size:0.72rem;color:#ffd700;margin-left:8px">★PickUp ${pickupCount}${getLang()==='zh'?'枚':'枚'}</span>` : ''}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px">
            ${grouped[r].map(ic => `
              <div style="text-align:center;position:relative">
                ${ic.is_pickup ? `<span style="position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:0.6rem;font-weight:bold;color:#ffd700;background:rgba(0,0,0,0.6);border-radius:3px;padding:0 3px;white-space:nowrap;z-index:1">★PU</span>` : ''}
                <img src="${escHtml(thumbUrl(ic.image_url))}" alt="${escHtml(ic.name)}" loading="lazy"
                     style="width:54px;height:54px;border-radius:20%;object-fit:cover;border:2px solid ${ic.is_pickup ? '#ffd700' : rarityColors[r]};display:block;margin:0 auto 4px;${ic.is_pickup ? 'box-shadow:0 0 6px #ffd700aa' : ''}">
                <div style="font-size:0.62rem;color:var(--text-secondary);word-break:break-all;line-height:1.2">${escHtml(ic.name)}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    document.getElementById('pool-list').innerHTML = `<div style="color:var(--danger)">${escHtml(err.message)}</div>`;
  }
}
function closePoolModal() {
  const modal = document.getElementById('pool-modal');
  if (modal.style.display !== 'none') unlockBodyScroll();
  modal.style.display = 'none';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePoolModal(); });
</script>
