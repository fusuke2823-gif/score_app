<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>ガチャ - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap">
<link rel="stylesheet" href="/css/gacha.css">
</head>
<body>
<div id="gp-toast" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:0.95rem;box-shadow:0 4px 18px rgba(0,0,0,0.5);text-align:center;max-width:90vw;pointer-events:none"></div>
<nav id="nav"></nav>
<main>
  <div id="alert"></div>

  <div class="gacha-wallet" id="gacha-wallet">
    <button type="button" class="gacha-mute" id="gacha-mute" onclick="toggleGachaMute()" aria-label="効果音を消す" title="効果音を消す"></button>
    <div class="gacha-wallet-item"><span class="gacha-wallet-label">PT</span><span id="my-points">---</span></div>
    <div class="gacha-wallet-sep"></div>
    <div class="gacha-wallet-item"><span class="gacha-wallet-label">GP</span><span id="my-gp">---</span></div>
    <div class="gacha-wallet-dup" id="dup-indicator"></div>
  </div>
  <div class="gacha-top-spacer"></div>

  <!-- ガチャ種別タブ -->
  <div id="gacha-type-tabs" class="gacha-type-tabs" data-active="normal" style="display:none">
    <span class="gacha-type-indicator" aria-hidden="true"></span>
    <button type="button" class="gacha-type-btn active" id="tab-btn-normal" onclick="switchGachaType('normal')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h5M15 12h5"/><circle cx="12" cy="12" r="3"/></svg>
      <span>通常ガチャ</span>
    </button>
    <button type="button" class="gacha-type-btn" id="tab-btn-special" onclick="switchGachaType('special')" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 3.5H20.5V9.5L10 20L4 14Z"/><path d="M13 11l-4 4"/><path d="M4 20l2.5-2.5"/></svg>
      <span>討伐ガチャ</span>
    </button>
  </div>

  <!-- ①プール選択画面 -->
  <div id="pool-select-screen" style="display:none">
    <div class="pool-select-head">
      <div class="pool-select-eyebrow">SELECT GACHA</div>
      <div class="pool-select-title" data-i18n="gacha.pool_select">ガチャを選んでください</div>
    </div>
    <div id="pool-pick-list" class="pool-grid"></div>
  </div>

  <!-- ②メインガチャUI -->
  <div id="gacha-main" style="display:none">

    <!-- 選択中ガチャのバナー + 戻るボタン -->
    <button id="btn-back-pool" class="gx-back" onclick="backToPoolSelect()" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-i18n="gacha.back_pool">ガチャ選択に戻る</span>
    </button>
    <div class="gx-pooltabs" id="gx-pooltabs" role="tablist" aria-label="ガチャを選ぶ" hidden></div>
    <div class="gx-hero" id="gx-hero"></div>

    <div class="gacha-pull-btns">
      <button class="gacha-btn gacha-btn-single" id="btn-single" onclick="doPull('single')" disabled>
        <img src="/img/gacha_btn_single.webp" alt="単発ガチャ"><span class="gbtn-cost"></span>
      </button>
      <button class="gacha-btn gacha-btn-multi" id="btn-multi" onclick="doPull('multi')" disabled>
        <img src="/img/gacha_btn_multi.webp" alt="10連ガチャ"><span class="gbtn-cost"></span>
      </button>
    </div>

    <!-- GP交換（このガチャを100回引くと解放） -->
    <details class="gx-panel gx-ex" id="gx-exchange" open>
      <summary class="gx-panel-head">
        <span class="gx-panel-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></span>
        <span class="gx-panel-titles"><span class="gx-panel-eyebrow">GP EXCHANGE</span><span class="gx-panel-title" data-i18n="gacha.exchange_title">GP交換</span></span>
        <span class="gx-ex-price"><b>200</b><small>GP</small><i>→</i><b class="ss">SS</b><small>×1</small></span>
        <svg class="gx-fold-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="gx-ex-meter">
        <div class="gx-ex-num"><b id="gx-ex-pulls">-</b><span>/ <em id="gx-ex-req">100</em></span></div>
        <div class="gx-ex-seg" id="gx-ex-seg"></div>
        <span class="gx-ex-badge">UNLOCKED</span>
      </div>
      <div class="gx-ex-note" id="gx-ex-note"></div>
      <div class="gx-ex-grid" id="exchange-ss-list"><div class="loading"><div class="spinner"></div></div></div>
    </details>

    <!-- 排出率（開閉式） -->
    <details class="gx-panel gx-rate">
      <summary class="gx-panel-head">
        <span class="gx-panel-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>
        <span class="gx-panel-titles"><span class="gx-panel-eyebrow">DROP RATES</span><span class="gx-panel-title" data-i18n="gacha.rate_title">排出率</span></span>
        <span class="gx-rate-mini" id="gx-rate-mini"></span>
        <svg class="gx-fold-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="gx-panel-body">
        <div id="rate-info"><div class="loading"><div class="spinner"></div></div></div>
        <button class="gx-rate-pool" onclick="openPoolModal()"><span data-i18n="gacha.pool_btn">排出対象を見る</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </details>

    <div id="my-icons" style="display:none"></div>

  </div><!-- /#gacha-main -->

  <!-- ③討伐ガチャ画面 -->
  <div id="special-gacha-screen" style="display:none">
    <div style="text-align:center;font-size:0.75rem;color:rgba(232,232,240,0.65);margin-bottom:8px">毎月1日に更新されます　※GPは入手できません</div>
    <div class="card sg-boss-card">
      <div class="sg-reward-preview">
        <div class="sg-reward-caption">討伐報酬</div>
        <img id="sg-reward-icon" alt="">
        <div class="sg-reward-label" id="sg-reward-name"></div>
      </div>
      <div class="sg-defeated-banner" id="sg-defeated-banner" hidden>討伐済み</div>
      <div class="sg-boss-stage">
        <div class="sg-boss-portrait-wrap" id="sg-boss-portrait-wrap"><img class="sg-boss-portrait" id="sg-boss-portrait" alt=""></div>
      </div>
      <div class="sg-boss-title">
        <span class="sg-boss-name" id="sg-boss-name">-</span>
        <span class="sg-gimmick" id="sg-gimmick" hidden><span class="sg-gimmick-tag" id="sg-gimmick-tag"></span></span>
      </div>
      <div class="sg-boss-bars">
        <div class="sg-shield-row" id="sg-shield-row" hidden>
          <div class="sg-shield-label"><span id="sg-shield-state">SHIELD</span><span id="sg-shield-num"></span></div>
          <div class="sg-shield-bar-outer"><div class="sg-shield-bar-inner" id="sg-shield-bar" style="width:100%"></div></div>
        </div>
        <div class="sg-hp-head">
          <span class="sg-hp-label">HP</span>
          <span class="sg-destruction"><span class="sg-destruction-label">破壊率</span><span class="sg-destruction-rate" id="sg-destruction-rate">-</span></span>
        </div>
        <div class="sg-hp-bar-outer"><div class="sg-hp-bar-ghost" id="sg-hp-ghost" style="width:100%"></div><div class="sg-hp-bar-inner" id="sg-hp-bar" style="width:100%"></div></div>
      </div>
      <div class="sg-effects-row" id="sg-effects-row"></div>
    </div>

    <div class="gacha-pull-btns sg-collapsible" id="sg-pull-wrap">
      <button class="gacha-btn gacha-btn-multi" id="sg-pull-btn" onclick="doSpecialPull()" disabled>
        <img src="/img/gacha_battle.png" alt="討伐ガチャ 10連 100pt">
      </button>
    </div>

    <div class="gacha-stage" id="sg-stage">
      <div style="text-align:center;color:rgba(232,232,240,0.75);font-size:0.9rem">討伐ガチャを引いてください</div>
    </div>
    <div class="sg-battle-log" id="sg-battle-log">10連ガチャを引くと、ここに結果が表示されます</div>

    <button class="btn btn-secondary" id="sg-rates-toggle" onclick="toggleSgRates()" style="width:100%;margin-top:6px">
      排出内容・確率を見る <span id="sg-rates-arrow">▾</span>
    </button>
    <div id="sg-rates-panel" class="sg-rates-panel" hidden></div>
  </div>

  <!-- 討伐ガチャ 討伐演出 -->
  <!-- 討伐ガチャ ゲージアクション（ゲージアクションのギミック用） -->
  <div id="sg-gauge-overlay" class="sg-gauge-overlay" hidden>
    <div class="sg-gauge-box" role="dialog" aria-label="ゲージアクション">
      <div class="sg-gauge-title">ゲージアクション <span id="sg-gauge-count"></span></div>
      <div class="sg-gauge-bar" id="sg-gauge-bar"><div class="sg-gauge-marker" id="sg-gauge-marker"></div></div>
      <div class="sg-gauge-result" id="sg-gauge-result"></div>
      <div class="sg-gauge-dmg" id="sg-gauge-dmg"></div>
      <div class="sg-gauge-hint" id="sg-gauge-hint">中心に近いところでタップ！</div>
    </div>
  </div>

  <div id="sg-defeat-overlay" class="sg-overlay">
    <div class="sg-defeat-card">
      <div class="sg-defeat-title">討伐完了</div>
      <img class="sg-ssr-icon" id="sg-ssr-icon-img" alt="">
      <div class="sg-ssr-tag">SSR</div>
      <div class="sg-ssr-name" id="sg-ssr-name"></div>
      <button class="btn btn-secondary" onclick="document.getElementById('sg-defeat-overlay').classList.remove('show')">閉じる</button>
    </div>
  </div>

  <!-- 排出対象モーダル -->
  <div id="pool-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px">
    <div style="background:var(--bg-modal);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--border-light);border-radius:14px;padding:24px;max-width:520px;width:100%;margin:auto;position:relative">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:1rem;font-weight:bold" data-i18n="gacha.pool_modal_title">排出対象アイコン</div>
        <button onclick="closePoolModal()" style="background:none;border:none;font-size:1.4rem;color:var(--text-muted);cursor:pointer;line-height:1">×</button>
      </div>
      <div id="pool-list"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
    </div>
  </div>

  <!-- GP交換確認モーダル -->
  <div id="exchange-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--bg-modal);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--border-light);border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center">
      <img id="exchange-modal-img" src="" alt="" style="width:72px;height:72px;object-fit:contain;border-radius:20%;border:2px solid #ffd700;display:block;margin:0 auto 10px">
      <div id="exchange-modal-name" style="font-size:0.95rem;font-weight:bold;color:#ffd700;margin-bottom:4px"></div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:20px" data-i18n="gacha.exchange_confirm">200GPで交換しますか？</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="closeExchangeModal()" data-i18n="cancel">キャンセル</button>
        <button class="btn btn-primary" style="flex:1" onclick="confirmExchange()" data-i18n="gacha.exchange_do">交換する</button>
      </div>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/gacha/sound.js"></script>
<script src="/js/gacha/fx.js"></script>
<script src="/js/gacha/special.js"></script>
<script src="/js/gacha/main.js"></script>
</body>
</html>
