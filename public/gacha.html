<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガチャ - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.gacha-hero { text-align:center; padding:28px 0 8px; }
.gacha-points-display { font-size:1.5rem; font-weight:bold; color:var(--accent); margin-bottom:6px; }
.gacha-pull-btns { display:flex; gap:16px; justify-content:center; flex-wrap:nowrap; margin:20px 0 28px; }
.gacha-btn {
  padding:0; margin:0; font-size:0.88rem; font-weight:bold;
  border:none; cursor:pointer; background:transparent;
  transition:transform 0.15s, opacity 0.15s;
  display:flex; flex-direction:column; align-items:center; gap:0;
}
.gacha-btn:hover:not(:disabled) { transform:translateY(-3px); }
.gacha-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
.gacha-btn-single { color:#fff; }
.gacha-btn-multi { color:#ffd700; }
.gacha-btn img { width:160px; max-width:38vw; height:auto; display:block; }
.gacha-btn .gcost { font-size:0.88rem; font-weight:bold; }
.g-card { opacity:0; transform:scale(0.8); transition:opacity 0.18s, transform 0.18s; }
.g-card.card-visible { opacity:1; transform:scale(1); }

/* カードステージ */
.gacha-stage {
  min-height:200px; display:flex; align-items:center; justify-content:center;
  margin-bottom:16px;
}
.gacha-cards { display:flex; flex-wrap:wrap; column-gap:8px; row-gap:36px; justify-content:center; width:calc(5*88px + 4*8px); max-width:100%; margin:0 auto; }

/* カード */
.g-card { width:88px; height:122px; perspective:700px; flex-shrink:0; }
.g-card-inner {
  width:100%; height:100%; position:relative;
  transform-style:preserve-3d;
  transition:transform 0.65s cubic-bezier(.4,2,.55,1);
}
.g-card-inner.flipped { transform:rotateY(180deg); }
.g-card-front, .g-card-back {
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;
}
.g-card-front {
  background:#201c3a; border:2px solid var(--border-light);
  transition: box-shadow 0.4s;
}
.g-card-back { transform:rotateY(180deg); background:#201c3a; padding:4px; overflow:visible; }
.g-card-back img { width:52px; height:52px; border-radius:20%; object-fit:cover; }
.g-dup { position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:0.6rem; background:rgba(100,180,255,0.25); color:#7dd3fc; padding:1px 7px; border-radius:3px; }
.g-card-back .g-name { font-size:0.62rem; color:var(--text-primary); text-align:center; word-break:break-all; line-height:1.2; max-width:80px; }
.g-rarity-tag { position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:0.65rem; font-weight:bold; padding:1px 7px; border-radius:4px; }

/* レアリティ枠 */
.rarity-SS .g-card-back {
  border:2px solid transparent;
  background:linear-gradient(#201c3a,#201c3a) padding-box,
             linear-gradient(135deg,#ffd700,#ff66cc,#00eeff,#ffd700) border-box;
  animation:ssGlow 1.8s linear infinite;
}
.rarity-S .g-card-back { border:2px solid #ffd700; box-shadow:0 0 12px rgba(255,215,0,0.65); }
.rarity-A .g-card-back { border:2px solid #4fc3f7; box-shadow:0 0 8px rgba(79,195,247,0.4); }
.g-rarity-tag.r-SS { background:#ffd700; color:#000; }
.g-rarity-tag.r-S  { background:#e0c060; color:#000; }
.g-rarity-tag.r-A  { background:#4fc3f7; color:#000; }

@keyframes ssGlow {
  0%   { box-shadow:0 0 18px #ffd700; }
  33%  { box-shadow:0 0 18px #ff66cc; }
  66%  { box-shadow:0 0 18px #00eeff; }
  100% { box-shadow:0 0 18px #ffd700; }
}

/* 結果サマリー */
.result-summary { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; padding:12px 0; }
.result-count { text-align:center; }
.result-count .rnum { font-size:1.5rem; font-weight:bold; }
.result-count .rlabel { font-size:0.75rem; }

/* 所持アイコン */
.icon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:12px; }
.icon-item { text-align:center; padding:4px; }
.icon-item img {
  width:58px; height:58px; border-radius:20%; object-fit:cover;
  border:2px solid var(--border); cursor:pointer;
  transition:border-color 0.2s, box-shadow 0.2s;
  display:block; margin:0 auto 4px;
}
.icon-item img:hover { border-color:var(--accent); }
.icon-item img.equipped { border-color:var(--accent); box-shadow:0 0 10px var(--accent); }
.icon-none-btn {
  width:58px; height:58px; border-radius:20%; border:2px solid var(--border); cursor:pointer;
  display:flex; align-items:center; justify-content:center; margin:0 auto 4px;
  font-size:1.4rem; color:var(--text-muted); background:var(--bg-primary);
  transition:border-color 0.2s, box-shadow 0.2s;
}
.icon-none-btn:hover { border-color:var(--accent); }
.icon-none-btn.equipped { border-color:var(--accent); box-shadow:0 0 10px var(--accent); }
.icon-item .iname { font-size:0.68rem; color:var(--text-secondary); word-break:break-all; line-height:1.2; }
.irarity { font-size:0.62rem; font-weight:bold; padding:1px 5px; border-radius:3px; display:inline-block; margin-bottom:3px; }
.irarity-SS { background:#ffd700; color:#000; }
.irarity-S  { background:#e0c060; color:#000; }
.irarity-A  { background:#4fc3f7; color:#000; }

/* めくる前カード裏面の表示レアリティ演出 */
.display-rarity-SS .g-card-front {
  border:2px solid transparent;
  background:linear-gradient(#201c3a,#201c3a) padding-box,
             linear-gradient(135deg,#ffd700,#ff66cc,#00eeff,#ffd700) border-box;
  animation:ssGlow 1.8s linear infinite;
}
.display-rarity-S .g-card-front {
  border:2px solid #ffd700;
  box-shadow:0 0 12px rgba(255,215,0,0.65);
}
/* S・SS レアリティ変更演出 */
@keyframes sRevealAnim {
  0%   { box-shadow:0 0 10px rgba(255,215,0,0.5); filter:brightness(1); transform:scale(1); }
  30%  { box-shadow:0 0 32px rgba(255,215,0,1), 0 0 64px rgba(255,180,0,0.5); filter:brightness(1.5); transform:scale(1.08); }
  55%  { box-shadow:0 0 20px rgba(255,215,0,0.8); filter:brightness(1.2); transform:scale(1.02); }
  78%  { box-shadow:0 0 38px rgba(255,215,0,1), 0 0 72px rgba(255,215,0,0.4); filter:brightness(1.45); transform:scale(1.06); }
  100% { box-shadow:0 0 12px rgba(255,215,0,0.65); filter:brightness(1); transform:scale(1); }
}
@keyframes ssRevealAnim {
  0%   { filter:brightness(1); transform:scale(1) translateX(0); box-shadow:none; }
  12%  { filter:brightness(1.6); transform:scale(1.06) translateX(-4px); box-shadow:0 0 30px #ffd700, 0 0 60px rgba(255,215,0,0.4); }
  24%  { filter:brightness(1.3); transform:scale(1.03) translateX(4px);  box-shadow:0 0 36px #ff88cc, 0 0 72px rgba(255,100,200,0.35); }
  38%  { filter:brightness(1.8); transform:scale(1.10) translateX(-3px); box-shadow:0 0 44px #00eeff, 0 0 88px rgba(0,200,255,0.4); }
  52%  { filter:brightness(2.1); transform:scale(1.13) translateX(0);    box-shadow:0 0 55px #ffd700, 0 0 90px #ff66cc, 0 0 130px rgba(0,230,255,0.35); }
  68%  { filter:brightness(1.5); transform:scale(1.06) translateX(0);    box-shadow:0 0 40px #ff66cc, 0 0 75px #00eeff; }
  85%  { filter:brightness(1.2); transform:scale(1.02); }
  100% { filter:brightness(1);   transform:scale(1) translateX(0); }
}
.reveal-S  .g-card-front { animation:sRevealAnim  0.95s ease-in-out forwards; }
.reveal-SS .g-card-front { animation:ssRevealAnim 1.25s ease-in-out forwards; }

.section-title { font-size:1rem; font-weight:bold; margin-bottom:14px; color:var(--text-primary); }
.rate-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:0.85rem; }
.rate-row:last-child { border-bottom:none; }

/* ===== 特殊ガチャ ===== */
.sg-boss-card { padding:16px 18px; }
.sg-boss-row { display:flex; align-items:center; gap:14px; }
.sg-boss-portrait { width:56px; height:56px; border-radius:50%; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
.sg-boss-info { flex:1; min-width:0; }
.sg-boss-name { font-size:0.82rem; color:var(--text-secondary); letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sg-destruction-rate { text-align:right; font-size:0.66rem; font-weight:700; color:#ff8fa3; font-variant-numeric:tabular-nums; margin-bottom:3px; }
.sg-hp-bar-outer { width:100%; height:8px; border-radius:5px; background:rgba(0,0,0,0.4); border:1px solid var(--border); overflow:hidden; }
.sg-hp-bar-inner { height:100%; border-radius:5px; background:linear-gradient(90deg,#ff5470,var(--accent)); transition:width .5s ease; }
.sg-reward-preview { flex-shrink:0; text-align:center; }
.sg-reward-preview img { width:36px; height:36px; border-radius:20%; object-fit:cover; border:1px solid rgba(255,214,0,0.5); box-shadow:0 0 8px rgba(255,214,0,0.3); display:block; margin:0 auto 2px; }
.sg-reward-label { font-size:0.55rem; color:var(--text-muted); max-width:44px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sg-effects-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; min-height:22px; }
.sg-eff-badge { font-size:0.66rem; font-weight:700; padding:3px 8px; border-radius:20px; }
.sg-eff-badge.fav { background:rgba(73,214,168,0.14); color:#49d6a8; border:1px solid rgba(73,214,168,0.4); }
.sg-eff-badge.unfav { background:rgba(230,73,79,0.14); color:#e6494f; border:1px solid rgba(230,73,79,0.4); }

.sg-card-back.cat-damage { border:2px solid #4fc3f7; box-shadow:0 0 8px rgba(79,195,247,0.35); color:#4fc3f7; }
.sg-card-back.cat-favorable { border:2px solid #49d6a8; box-shadow:0 0 8px rgba(73,214,168,0.35); color:#49d6a8; }
.sg-card-back.cat-unfavorable { border:2px solid #e6494f; box-shadow:0 0 8px rgba(230,73,79,0.35); color:#e6494f; }
.sg-card-back.cat-destruction { border:2px solid #c9762b; box-shadow:0 0 8px rgba(201,118,43,0.4); color:#c9762b; }
@keyframes sgGlowPulse {
  0%, 100% { box-shadow: 0 0 8px currentColor; }
  50% { box-shadow: 0 0 16px currentColor, 0 0 30px currentColor; }
}
.sg-card-back.sg-glow { animation: sgGlowPulse 1.3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .sg-card-back.sg-glow { animation: none; box-shadow: 0 0 16px currentColor; }
}
.sg-card-icon { display:flex; align-items:center; justify-content:center; }
.sg-svg-icon { width:32px; height:32px; }
.sg-card-back.cat-damage .sg-svg-icon { transform:rotate(45deg); transform-box:fill-box; transform-origin:center; }
.sg-icon-stack { position:relative; display:inline-flex; }
.sg-icon-stack .sg-svg-badge {
  position:absolute; right:-9px; bottom:-6px; width:15px; height:15px;
  color:var(--text-primary); background:rgba(10,9,20,0.85); border-radius:50%; padding:1.5px;
}
.sg-card-val { font-size:0.85rem; font-weight:900; margin-top:4px; text-align:center; }
.sg-card-back.cat-damage .sg-card-val { color:#4fc3f7; }
.sg-card-back.cat-destruction .sg-card-val { color:#c9762b; font-size:0.6rem; }
.sg-card-back.cat-favorable .sg-card-val { color:#49d6a8; font-size:0.56rem; }
.sg-card-back.cat-unfavorable .sg-card-val { color:#e6494f; font-size:0.56rem; }

.sg-battle-log { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:0.78rem; color:var(--text-secondary); text-align:center; margin-bottom:20px; }

.sg-overlay { position:fixed; inset:0; background:rgba(6,5,14,0.88); display:flex; align-items:center; justify-content:center; z-index:3000; opacity:0; pointer-events:none; transition:opacity .35s ease; }
.sg-overlay.show { opacity:1; pointer-events:auto; }
.sg-defeat-card { width:min(320px,86vw); text-align:center; padding:30px 22px; background:linear-gradient(180deg,rgba(40,20,50,0.97),rgba(20,10,30,0.98)); border:1px solid rgba(255,214,0,0.4); border-radius:20px; box-shadow:0 0 60px rgba(255,54,214,0.3); transform:scale(.85); transition:transform .4s cubic-bezier(.2,.9,.3,1.3); }
.sg-overlay.show .sg-defeat-card { transform:scale(1); }
.sg-defeat-title { font-size:0.75rem; color:var(--text-muted); letter-spacing:.1em; margin-bottom:14px; }
.sg-ssr-icon { width:96px; height:96px; border-radius:16px; object-fit:cover; margin-bottom:12px; border:3px solid; border-image:linear-gradient(135deg,#ff36d6,#ffd700) 1; }
.sg-ssr-tag { display:inline-block; font-size:0.68rem; font-weight:900; padding:2px 12px; border-radius:20px; background:linear-gradient(90deg,#ff36d6,#ffd700); color:#1a0a1a; margin-bottom:10px; }
.sg-ssr-name { font-size:0.9rem; font-weight:700; margin-bottom:18px; }


@media(max-width:480px) {
  .g-card { width:66px; height:92px; }
  .g-card-back img { width:42px; height:42px; }
  .g-card-back .g-name { font-size:0.58rem; }
  .gacha-cards { width:calc(5*66px + 4*5px); column-gap:5px; row-gap:36px; }
  .gacha-btn { padding:0; margin:0; }
}
</style>
</head>
<body>
<div id="gp-toast" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 22px;font-size:0.95rem;box-shadow:0 4px 18px rgba(0,0,0,0.5);text-align:center;max-width:90vw;pointer-events:none"></div>
<nav id="nav"></nav>
<main>
  <div id="alert"></div>

  <div class="gacha-hero">
    <h1 class="page-title" style="margin-bottom:6px" data-i18n="gacha.title">キャラアイコン ガチャ</h1>
    <div style="font-size:0.75rem;color:rgba(232,232,240,0.7);margin-bottom:4px" data-i18n="shop.points_hint">※ポイントはランキングに応じて配布されます</div>
    <div class="gacha-points-display" id="my-points">--- pt</div>
    <div style="font-size:0.9rem;color:rgba(232,232,240,0.75)" id="my-gp">GP: ---</div>
    <div id="dup-indicator" style="font-size:0.82rem;font-weight:bold;color:#4fc3f7;height:1.3em;opacity:0;transition:opacity 0.3s;text-align:center;margin-bottom:2px"></div>
  </div>

  <!-- ガチャ種別タブ（特殊ガチャは管理者限定公開中） -->
  <div id="gacha-type-tabs" style="display:none;justify-content:center;gap:8px;margin-bottom:16px">
    <button class="btn btn-sm" id="tab-btn-normal" onclick="switchGachaType('normal')"></button>
    <button class="btn btn-sm btn-secondary" id="tab-btn-special" onclick="switchGachaType('special')" style="display:none">特殊ガチャ</button>
  </div>

  <!-- ①プール選択画面 -->
  <div id="pool-select-screen" style="display:none">
    <div class="card" style="text-align:center;padding:28px 16px">
      <div style="font-size:1rem;font-weight:bold;margin-bottom:20px" data-i18n="gacha.pool_select">ガチャを選んでください</div>
      <div id="pool-pick-list" style="display:flex;flex-direction:column;gap:12px;max-width:400px;margin:0 auto"></div>
    </div>
  </div>

  <!-- ②メインガチャUI -->
  <div id="gacha-main" style="display:none">

    <!-- 選択中ガチャ + 戻るボタン -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <button id="btn-back-pool" class="btn btn-secondary btn-sm" onclick="backToPoolSelect()" style="display:none" data-i18n="gacha.back_pool">← 選択に戻る</button>
      <span id="selected-pool-label" style="font-size:0.88rem;font-weight:bold;color:var(--accent)"></span>
      <span id="selected-pool-days" style="font-size:0.78rem;font-weight:bold"></span>
    </div>

    <div class="gacha-pull-btns">
      <button class="gacha-btn gacha-btn-single" id="btn-single" onclick="doPull('single')" disabled>
        <img src="/img/gacha_1.png" alt="単発ガチャ">
      </button>
      <button class="gacha-btn gacha-btn-multi" id="btn-multi" onclick="doPull('multi')" disabled>
        <img src="/img/gacha_10.png" alt="10連ガチャ">
      </button>
    </div>
    <!-- アニメーション領域 -->
    <div class="gacha-stage" id="gacha-stage">
      <div style="text-align:center;color:rgba(232,232,240,0.75);font-size:0.9rem" data-i18n="gacha.prompt">ガチャを引いてアイコンをゲット！</div>
    </div>

    <!-- 結果サマリー -->
    <div id="result-summary" style="display:none;margin-bottom:20px"></div>

    <!-- 排出率 -->
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="section-title" style="margin:0" data-i18n="gacha.rate_title">排出率</div>
        <button class="btn btn-secondary btn-sm" onclick="openPoolModal()" data-i18n="gacha.pool_btn">排出対象を見る</button>
      </div>
      <div id="rate-info"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <!-- GP交換 -->
    <div class="card" style="margin-bottom:20px">
      <div class="section-title" style="margin-bottom:4px" data-i18n="gacha.exchange_title">GP交換</div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px" data-i18n="gacha.exchange_desc">200GP → SSアイコン1枚（選択）</div>
      <div id="exchange-ss-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:10px">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <div id="my-icons" style="display:none"></div>

  </div><!-- /#gacha-main -->

  <!-- ③特殊ガチャ画面（管理者限定公開中） -->
  <div id="special-gacha-screen" style="display:none">
    <div class="card sg-boss-card">
      <div class="sg-boss-row">
        <img class="sg-boss-portrait" id="sg-boss-portrait" alt="">
        <div class="sg-boss-info">
          <div class="sg-boss-name" id="sg-boss-name">-</div>
          <div class="sg-destruction-rate" id="sg-destruction-rate">-</div>
          <div class="sg-hp-bar-outer"><div class="sg-hp-bar-inner" id="sg-hp-bar" style="width:100%"></div></div>
        </div>
        <div class="sg-reward-preview">
          <img id="sg-reward-icon" alt="">
          <div class="sg-reward-label" id="sg-reward-name"></div>
        </div>
      </div>
      <div class="sg-effects-row" id="sg-effects-row"></div>
    </div>

    <div class="gacha-pull-btns">
      <button class="gacha-btn gacha-btn-multi" id="sg-pull-btn" onclick="doSpecialPull()" disabled>
        <img src="/img/gacha_10.png" alt="10連ガチャ">
      </button>
    </div>

    <div class="gacha-stage" id="sg-stage">
      <div style="text-align:center;color:rgba(232,232,240,0.75);font-size:0.9rem">特殊ガチャを引いてください</div>
    </div>
    <div class="sg-battle-log" id="sg-battle-log">10連ガチャを引くと、ここに結果が表示されます</div>
  </div>

  <!-- 特殊ガチャ 討伐演出 -->
  <div id="sg-defeat-overlay" class="sg-overlay">
    <div class="sg-defeat-card">
      <div class="sg-defeat-title">討伐完了</div>
      <img class="sg-ssr-icon" id="sg-ssr-icon-img" alt="">
      <div class="sg-ssr-tag">SSR</div>
      <div class="sg-ssr-name" id="sg-ssr-name"></div>
      <button class="btn btn-secondary" onclick="document.getElementById('sg-defeat-overlay').classList.remove('show')">閉じる</button>
    </div>
  </div>

  <!-- 排出対象モーダル -->
  <div id="pool-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px">
    <div style="background:var(--bg-modal);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--border-light);border-radius:14px;padding:24px;max-width:520px;width:100%;margin:auto;position:relative">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:1rem;font-weight:bold" data-i18n="gacha.pool_modal_title">排出対象アイコン</div>
        <button onclick="closePoolModal()" style="background:none;border:none;font-size:1.4rem;color:var(--text-muted);cursor:pointer;line-height:1">×</button>
      </div>
      <div id="pool-list"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
    </div>
  </div>

  <!-- GP交換確認モーダル -->
  <div id="exchange-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--bg-modal);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--border-light);border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center">
      <img id="exchange-modal-img" src="" alt="" style="width:72px;height:72px;object-fit:contain;border-radius:20%;border:2px solid #ffd700;display:block;margin:0 auto 10px">
      <div id="exchange-modal-name" style="font-size:0.95rem;font-weight:bold;color:#ffd700;margin-bottom:4px"></div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:20px" data-i18n="gacha.exchange_confirm">200GPで交換しますか？</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="closeExchangeModal()" data-i18n="cancel">キャンセル</button>
        <button class="btn btn-primary" style="flex:1" onclick="confirmExchange()" data-i18n="gacha.exchange_do">交換する</button>
      </div>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();
if (!requireLogin()) throw new Error('redirect');

const _sgUser = getUser();
if (_sgUser && _sgUser.role === 'admin') {
  document.getElementById('gacha-type-tabs').style.display = 'flex';
  document.getElementById('tab-btn-special').style.display = '';
}
document.getElementById('tab-btn-normal').textContent = '通常ガチャ';

let gSettings = null;
let isPulling = false;
let currentPoints = 0;
let currentGp = 0;

let selectedPoolId = null;
let gPools = [];

async function init() {
  ['/sounds/turn.mp3','/sounds/ss_sound.mp3','/sounds/s_sound.mp3','/sounds/kakutei.mp3','/sounds/putcard.mp3'].forEach(_sePreload);
  try {
    const [settings, myData, pools] = await Promise.all([
      apiFetch('/gacha/settings'),
      apiFetch('/gacha/my'),
      apiFetch('/gacha/pools')
    ]);
    gSettings = settings;
    gPools = pools;
    currentPoints = myData.points;
    currentGp = myData.gp || 0;
    updatePointsDisplay(currentPoints);
    updateGpDisplay(currentGp);
    renderPoolSelector(pools);
    loadExchangeList();

    // GP移行（未移行の場合のみ）
    try {
      const migRes = await apiFetch('/gacha/gp-migrate', { method: 'POST' });
      if (!migRes.already_done && migRes.gp_awarded > 0) {
        currentGp = migRes.new_gp;
        updateGpDisplay(currentGp);
        showGpToast(t('gacha.gp_migrated', migRes.gp_awarded));
      }
    } catch (_) {}

    updateRateInfo(settings, []);

    document.getElementById('btn-single').disabled = false;
    document.getElementById('btn-multi').disabled = false;

    renderMyIcons(myData.icons);
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

function updateRateInfo(settings, pickupIcons) {
  const ssRate = settings.ss_rate;
  const puCount = pickupIcons.length;
  let ssDetail = '';
  if (puCount > 0) {
    const puTotalRate = (puCount * 0.75).toFixed(2);
    const normalRate = Math.max(0, ssRate - puCount * 0.75);
    const puNote = getLang() === 'zh'
      ? `★PickUp各0.75%｜通常SS：${normalRate.toFixed(2)}%（均等）`
      : `★PickUp各0.75%｜通常SS：${normalRate.toFixed(2)}%（均等）`;
    ssDetail = `
      <div style="margin:4px 0 0 16px;font-size:0.75rem;color:var(--text-muted)">
        <span style="color:#ffd700">★PickUp</span>：${pickupIcons.map(p => escHtml(p.name)).join('・')}（各0.75%）<br>
        ${getLang() === 'zh' ? '通常SS' : '通常SS'}：${normalRate.toFixed(2)}%（${getLang() === 'zh' ? '均等' : '均等'}）
      </div>`;
  }
  const rateNote = getLang() === 'zh'
    ? `${puCount > 0 ? 'PickUpSSは各0.75%。' : ''}稀度內機率均等。十連最後1枚A→S保底。`
    : `${puCount > 0 ? 'PickUpSSは各0.75%。' : ''}レアリティ内の確率は均等。10連最後の1枚はAがSに変換。`;
  document.getElementById('rate-info').innerHTML = `
    <div class="rate-row">
      <span><span class="irarity irarity-SS">SS</span></span>
      <span style="font-weight:bold;color:#ffd700">${ssRate}%</span>
    </div>
    ${ssDetail}
    <div class="rate-row" style="margin-top:${puCount>0?'6px':'0'}">
      <span><span class="irarity irarity-S">S</span></span>
      <span style="font-weight:bold;color:#e0c060">${settings.s_rate}%</span>
    </div>
    <div class="rate-row">
      <span><span class="irarity irarity-A">A</span></span>
      <span style="font-weight:bold;color:#4fc3f7">${settings.a_rate}%</span>
    </div>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:10px;text-align:center">${rateNote}</p>`;
}

function updatePointsDisplay(pts) {
  document.getElementById('my-points').textContent = Number(pts).toLocaleString('ja-JP') + ' pt';
}
function updateGpDisplay(gp) {
  document.getElementById('my-gp').textContent = 'GP: ' + Number(gp).toLocaleString('ja-JP');
}

function poolDaysLabel(end_at) {
  if (!end_at) return '';
  const now = Date.now();
  const end = new Date(end_at).getTime();
  const diff = end - now;
  if (diff <= 0) return '';
  const totalHours = diff / (1000 * 60 * 60);
  if (totalHours < 24) {
    const h = Math.ceil(totalHours);
    return `<span style="font-size:0.72rem;font-weight:bold;color:#ff9800">${t('gacha.hours_left', h)}</span>`;
  }
  const days = Math.ceil(totalHours / 24);
  const color = days <= 3 ? '#ff9800' : 'var(--text-muted)';
  return `<span style="font-size:0.72rem;font-weight:bold;color:${color}">${t('gacha.days_left', days)}</span>`;
}

function renderPoolSelector(pools) {
  if (!pools || pools.length === 0) {
    // プールなし → 直接メインUIへ（従来通り全アイコン対象）
    selectedPoolId = null;
    showGachaMain();
    return;
  }
  // プール選択画面を表示
  const list = document.getElementById('pool-pick-list');
  list.innerHTML = pools.map(p => {
    const pickupRow = p.pickup_icons && p.pickup_icons.length > 0 ? `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px">
        <span style="font-size:0.68rem;color:#ffd700;font-weight:bold">★PU</span>
        ${p.pickup_icons.slice(0,5).map(pu => `<img src="${escHtml(thumbUrl(pu.image_url))}" title="${escHtml(pu.name)}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid #ffd700">`).join('')}
        ${p.pickup_icons.length > 5 ? `<span style="font-size:0.68rem;color:var(--text-muted)">+${p.pickup_icons.length - 5}</span>` : ''}
      </div>` : '';
    const daysLabel = poolDaysLabel(p.end_at);
    return `
    <button class="pool-pick-btn" onclick="selectPool(${p.id})" style="
      display:flex;align-items:center;gap:14px;text-align:left;
      padding:14px 18px;border-radius:14px;border:2px solid var(--border);
      background:var(--bg-primary);cursor:pointer;width:100%;
      transition:border-color 0.15s,background 0.15s;font-family:inherit
    " onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:1rem;font-weight:bold;color:var(--text-primary)">${escHtml(p.name)}</span>
          ${daysLabel}
        </div>
        ${p.description ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px">${escHtml(p.description)}</div>` : ''}
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px">${t('gacha.icons_count', p.icon_count)}</div>
        ${pickupRow}
      </div>
    </button>`;
  }).join('');
  document.getElementById('pool-select-screen').style.display = '';
  document.getElementById('gacha-main').style.display = 'none';
}

function selectPool(poolId) {
  selectedPoolId = poolId;
  const p = gPools.find(p => p.id === poolId);
  // ラベル・戻るボタン設定
  document.getElementById('selected-pool-label').textContent = p ? p.name : '';
  document.getElementById('selected-pool-days').innerHTML = p ? poolDaysLabel(p.end_at) : '';
  document.getElementById('btn-back-pool').style.display = gPools.length > 1 ? '' : 'none';
  // 排出率をピックアップ対応に更新
  const pickupIcons = p ? (p.pickup_icons || []) : [];
  if (gSettings) updateRateInfo(gSettings, pickupIcons);
  // GP交換リストをピックアップ対応に更新
  const pickupIds = pickupIcons.length > 0 ? pickupIcons.map(pu => pu.id) : null;
  loadExchangeList(pickupIds);
  showGachaMain();
  // 排出対象モーダルキャッシュリセット
  _lastPoolModalPoolId = Symbol();
}

function showGachaMain() {
  document.getElementById('pool-select-screen').style.display = 'none';
  document.getElementById('gacha-main').style.display = '';
}

function backToPoolSelect() {
  document.getElementById('gacha-main').style.display = 'none';
  document.getElementById('pool-select-screen').style.display = '';
}

let _gpToastTimer = null;
function showGpToast(html, isError = false) {
  const el = document.getElementById('gp-toast');
  el.style.color = isError ? '#f66' : 'var(--accent, #4fc3f7)';
  el.innerHTML = html;
  el.style.display = 'block';
  el.style.opacity = '1';
  if (_gpToastTimer) clearTimeout(_gpToastTimer);
  _gpToastTimer = setTimeout(() => {
    el.style.transition = 'opacity 0.5s';
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; el.style.transition = ''; }, 500);
  }, 3000);
}

async function loadExchangeList(pickupIds = null) {
  const container = document.getElementById('exchange-ss-list');
  try {
    const iconUrl = selectedPoolId ? `/gacha/pools/${selectedPoolId}/icons` : '/gacha/icons';
    const [icons, myData] = await Promise.all([apiFetch(iconUrl), apiFetch('/gacha/my')]);
    const ownedIds = new Set((myData.icons || []).map(i => i.id));
    let ss = icons.filter(i => i.rarity === 'SS' && !ownedIds.has(i.id));
    if (pickupIds && pickupIds.length > 0) {
      const pickupSet = new Set(pickupIds);
      ss = ss.filter(i => pickupSet.has(i.id));
    }
    if (ss.length === 0) { container.innerHTML = `<div style="color:var(--text-muted);font-size:0.85rem">${t('gacha.no_exchange')}</div>`; return; }
    container.innerHTML = ss.map(i => `
      <div style="text-align:center;cursor:pointer" onclick="askExchange(${i.id}, '${escHtml(i.name).replace(/'/g, "\\'")}', '${escHtml(thumbUrl(i.image_url)).replace(/'/g, "\\'")}')">
        <img src="${escHtml(thumbUrl(i.image_url))}" style="width:64px;height:64px;object-fit:contain;border-radius:20%;border:2px solid #ffd700;display:block;margin:0 auto 4px">
        <div style="font-size:0.7rem;color:#ffd700;word-break:break-all">${escHtml(i.name)}</div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div style="color:var(--text-muted);font-size:0.85rem">${t('error')}</div>`;
  }
}

let _pendingExchange = null;

function askExchange(iconId, iconName, iconImg) {
  if (isPulling) return;
  if (currentGp < 200) {
    showGpToast(t('gacha.gp_short', currentGp, 200), true);
    return;
  }
  _pendingExchange = { iconId, iconName };
  document.getElementById('exchange-modal-img').src = iconImg;
  document.getElementById('exchange-modal-name').textContent = `【SS】${iconName}`;
  const modal = document.getElementById('exchange-modal');
  if (modal.style.display !== 'flex') lockBodyScroll();
  modal.style.display = 'flex';
}

function closeExchangeModal() {
  const modal = document.getElementById('exchange-modal');
  if (modal.style.display !== 'none') unlockBodyScroll();
  modal.style.display = 'none';
  _pendingExchange = null;
}

async function confirmExchange() {
  if (!_pendingExchange) return;
  const { iconId } = _pendingExchange;
  closeExchangeModal();
  isPulling = true;
  updateGpDisplay(currentGp);
  try {
    const res = await apiFetch('/gacha/exchange', { method: 'POST', body: JSON.stringify({ icon_id: iconId }) });
    currentGp = res.new_gp;
    updateGpDisplay(currentGp);
    const r = res.result;
    document.getElementById('gacha-stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await animatePull([r]);
    if (r.is_dup) showGpToast(`<span style="color:#ffd700">【SS】${escHtml(r.name)}</span>（${t('gacha.dup_return', r.dup_pts)}）`);
    const myData = await apiFetch('/gacha/my');
    renderMyIcons(myData.icons);
    loadExchangeList();
  } catch (err) {
    showGpToast(err.message || 'エラーが発生しました', true);
  } finally {
    isPulling = false;
    updateGpDisplay(currentGp);
  }
}

function animateCount(from, to, duration) {
  return new Promise(resolve => {
    const start = performance.now();
    const diff = to - from;
    function step(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
      updatePointsDisplay(Math.round(from + diff * ease));
      if (t < 1) requestAnimationFrame(step);
      else { updatePointsDisplay(to); resolve(); }
    }
    requestAnimationFrame(step);
  });
}

async function showDupReturn(from, to, dupTotal) {
  const ind = document.getElementById('dup-indicator');
  ind.textContent = t('gacha.dup_return', dupTotal);
  ind.style.opacity = '1';
  await animateCount(from, to, 700);
  await new Promise(r => setTimeout(r, 1400));
  ind.style.opacity = '0';
}

function renderMyIcons(icons) {
  const el = document.getElementById('my-icons');
  if (!icons || icons.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🎰</div><p>${t('gacha.no_icons')}</p></div>`;
    return;
  }
  const anyEquipped = icons.some(i => i.is_equipped);
  el.innerHTML = `<div class="icon-grid">${icons.map(icon => `
    <div class="icon-item">
      <span class="irarity irarity-${escHtml(icon.rarity)}">${escHtml(icon.rarity)}</span><br>
      <img src="${escHtml(thumbUrl(icon.image_url))}" alt="${escHtml(icon.name)}" loading="lazy"
           class="${icon.is_equipped ? 'equipped' : ''}"
           onclick="equipIcon(${icon.id}, this)"
           title="${escHtml(icon.name)}">
      <div class="iname">${escHtml(icon.name)}</div>
    </div>`).join('')}
    <div class="icon-item">
      <span class="irarity" style="visibility:hidden">-</span><br>
      <div class="icon-none-btn ${anyEquipped ? '' : 'equipped'}" onclick="unequipIcon(this)" title="${t('gacha.icon_none')}">✕</div>
      <div class="iname">${t('gacha.icon_none')}</div>
    </div>
  </div>`;
}

async function equipIcon(iconId, imgEl) {
  try {
    const res = await apiFetch('/gacha/equip', { method: 'POST', body: JSON.stringify({ icon_id: iconId }) });
    document.querySelectorAll('#my-icons img').forEach(el => el.classList.remove('equipped'));
    document.querySelectorAll('#my-icons .icon-none-btn').forEach(el => el.classList.remove('equipped'));
    imgEl.classList.add('equipped');
    showAlert('#alert', res.message, 'success');
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

async function unequipIcon(el) {
  try {
    const res = await apiFetch('/gacha/equip', { method: 'POST', body: JSON.stringify({ icon_id: null }) });
    document.querySelectorAll('#my-icons img').forEach(e => e.classList.remove('equipped'));
    document.querySelectorAll('#my-icons .icon-none-btn').forEach(e => e.classList.remove('equipped'));
    el.classList.add('equipped');
    showAlert('#alert', res.message, 'success');
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

async function doPull(type) {
  if (isPulling) return;
  isPulling = true;
  _getAudioCtx(); // ユーザー操作中にAudioContextをアンロック
  const btnS = document.getElementById('btn-single');
  const btnM = document.getElementById('btn-multi');
  btnS.disabled = true;
  btnM.disabled = true;
  document.getElementById('result-summary').style.display = 'none';
  clearAlert('#alert');

  try {
    const body = selectedPoolId ? JSON.stringify({ pool_id: selectedPoolId }) : '{}';
    const res = await apiFetch(`/gacha/pull/${type}`, { method: 'POST', body });
    // コスト分を即座に減らす
    const dupTotal = res.results.reduce((s, r) => s + (r.dup_pts || 0), 0);
    const afterCost = res.new_points - dupTotal;
    await animateCount(currentPoints, afterCost, 350);
    currentPoints = afterCost;

    await animatePull(res.results);
    showResultSummary(res.results);

    // 重複補償を返却
    if (dupTotal > 0) {
      await showDupReturn(currentPoints, res.new_points, dupTotal);
    }
    currentPoints = res.new_points;
    if (res.new_gp != null) { currentGp = res.new_gp; updateGpDisplay(currentGp); }

    const myData = await apiFetch('/gacha/my');
    renderMyIcons(myData.icons);
  } catch (err) {
    showAlert('#alert', err.message);
  } finally {
    isPulling = false;
    btnS.disabled = false;
    btnM.disabled = false;
  }
}

let _audioCtx = null;
const _audioBuffers = {};

function _getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

async function _sePreload(src) {
  if (_audioBuffers[src]) return;
  try {
    const buf = await fetch(src).then(r => r.arrayBuffer());
    const ctx = _getAudioCtx();
    _audioBuffers[src] = await ctx.decodeAudioData(buf);
  } catch (e) {}
}

function _sePlay(src) {
  const ctx = _getAudioCtx();
  const buf = _audioBuffers[src];
  if (!buf) return null;
  const src_ = ctx.createBufferSource();
  src_.buffer = buf;
  src_.connect(ctx.destination);
  src_.start(0);
  return src_;
}

function _seStop(node) {
  if (!node) return;
  try { node.stop(); } catch (e) {}
}

async function animatePull(results) {
  const stage = document.getElementById('gacha-stage');
  stage.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'gacha-cards';
  stage.appendChild(wrap);

  const dispRarities = results.map(icon => {
    if (icon.rarity === 'SS') {
      const r = Math.random();
      if (r < 0.70) return 'SS';
      if (r < 0.90) return 'S';
      return 'A';
    }
    if (icon.rarity === 'S') return Math.random() < 0.75 ? 'S' : 'A';
    return 'A';
  });

  // カード生成（opacity:0 で非表示スタート）
  const cardEls = [];
  results.forEach((icon, i) => {
    const card = document.createElement('div');
    card.className = `g-card rarity-${icon.rarity} display-rarity-${dispRarities[i]}`;
    card.innerHTML = `
      <div class="g-card-inner" id="gc-${i}">
        <div class="g-card-front"><img src="/img/logo.png" alt="" style="width:70%;height:70%;object-fit:contain;opacity:0.7"></div>
        <div class="g-card-back">
          <img src="${escHtml(thumbUrl(icon.image_url))}" alt="${escHtml(icon.name)}">
          <div class="g-name">${escHtml(icon.name)}</div>
          ${icon.is_dup ? `<span class="g-dup">重複+${icon.dup_pts}pt</span>` : ''}
        </div>
      </div>`;
    wrap.appendChild(card);
    cardEls.push(card);
  });

  // 虹色SSがあれば確定音を再生し少しステイ
  const hasRainbow = dispRarities.includes('SS');
  let kakuteiAudio = null;
  if (hasRainbow) {
    kakuteiAudio = _sePlay('/sounds/kakutei.mp3');
    await new Promise(r => setTimeout(r, 600));
  }

  // ===== フェーズ1: カードを1枚ずつ表示 =====
  await new Promise(resolve => {
    let idx = 0;
    let timer = null;
    let done = false;

    const showAll = () => {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      cardEls.forEach(c => c.classList.add('card-visible'));
      stage.style.cursor = '';
      stage.removeEventListener('click', onTap);
      setTimeout(resolve, 1000);
    };

    const showNext = () => {
      if (done) return;
      _sePlay('/sounds/putcard.mp3');
      cardEls[idx].classList.add('card-visible');
      idx++;
      if (idx >= results.length) {
        done = true;
        stage.style.cursor = '';
        stage.removeEventListener('click', onTap);
        setTimeout(resolve, 1000);
      } else {
        timer = setTimeout(showNext, 220);
      }
    };

    const onTap = () => showAll();
    stage.style.cursor = 'pointer';
    stage.addEventListener('click', onTap);
    timer = setTimeout(showNext, 80);
  });

  // 確定音を止める
  _seStop(kakuteiAudio);

  // ===== フェーズ2: 1枚ずつめくる（タップでSS以外スキップ）=====
  let skipFlip = false;
  const onSkipTap = () => { skipFlip = true; stage.removeEventListener('click', onSkipTap); stage.style.cursor = ''; };
  stage.style.cursor = 'pointer';
  stage.addEventListener('click', onSkipTap);

  const doFlash = () => {
    const fl = document.createElement('div');
    fl.style.cssText = 'position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(255,230,120,0.45) 0%,transparent 70%);pointer-events:none;z-index:1500;opacity:0;transition:opacity 0.18s';
    document.body.appendChild(fl);
    requestAnimationFrame(() => { fl.style.opacity = '1'; });
    setTimeout(() => { fl.style.opacity = '0'; setTimeout(() => fl.remove(), 220); }, 180);
  };

  const stagger = results.length === 1 ? 0 : 500;
  for (let i = 0; i < results.length; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, skipFlip ? 30 : stagger));
    const actual = results[i].rarity;
    const isFakeout = dispRarities[i] !== actual;
    const card = cardEls[i];

    if (actual === 'SS') {
      // SSは常に演出あり
      if (isFakeout) {
        card.classList.remove(`display-rarity-${dispRarities[i]}`);
        card.classList.add(`display-rarity-SS`);
      }
      const ssAudio = _sePlay('/sounds/ss_sound.mp3');
      await new Promise(r => setTimeout(r, 100));
      card.classList.add('reveal-SS');
      setTimeout(doFlash, 480);
      await new Promise(r => setTimeout(r, 1300));
      _seStop(ssAudio);
      card.classList.remove('reveal-SS');
      await new Promise(r => setTimeout(r, 40));
    } else if (!skipFlip && (isFakeout || actual === 'S')) {
      // S以下は未スキップ時のみ演出
      if (isFakeout) {
        card.classList.remove(`display-rarity-${dispRarities[i]}`);
        card.classList.add(`display-rarity-${actual}`);
      }
      const sAudio = actual === 'S' ? _sePlay('/sounds/s_sound.mp3') : null;
      await new Promise(r => setTimeout(r, 100));
      card.classList.add(`reveal-${actual}`);
      await new Promise(r => setTimeout(r, 1000));
      _seStop(sAudio);
      card.classList.remove(`reveal-${actual}`);
      await new Promise(r => setTimeout(r, 40));
    }

    _sePlay('/sounds/turn.mp3');
    await new Promise(r => setTimeout(r, 100));
    document.getElementById(`gc-${i}`).classList.add('flipped');
  }

  stage.removeEventListener('click', onSkipTap);
  stage.style.cursor = '';
  await new Promise(r => setTimeout(r, 700));
}

function showResultSummary(results) {
  const counts = { SS: 0, S: 0, A: 0 };
  results.forEach(r => { counts[r.rarity] = (counts[r.rarity] || 0) + 1; });

  const colors = { SS: '#ffd700', S: '#e0c060', A: '#4fc3f7' };
  const parts = Object.entries(counts)
    .filter(([, n]) => n > 0)
    .map(([rarity, n]) => `
      <div class="result-count">
        <div class="rnum" style="color:${colors[rarity]}">${n}</div>
        <div class="rlabel"><span class="irarity irarity-${rarity}">${rarity}</span></div>
      </div>`);

  const el = document.getElementById('result-summary');
  el.innerHTML = `<div class="result-summary">${parts.join('')}</div>`;
  el.style.display = '';
}

init();

// ===== 特殊ガチャ（期間限定・管理者限定公開中） =====
let sgCurrentEnemy = null;
let sgLoaded = false;

function switchGachaType(type) {
  document.getElementById('tab-btn-normal').classList.toggle('btn-secondary', type !== 'normal');
  document.getElementById('tab-btn-special').classList.toggle('btn-secondary', type !== 'special');
  document.getElementById('pool-select-screen').style.display = type === 'normal' && !selectedPoolId ? '' : 'none';
  document.getElementById('gacha-main').style.display = type === 'normal' && selectedPoolId ? '' : 'none';
  document.getElementById('special-gacha-screen').style.display = type === 'special' ? '' : 'none';
  if (type === 'special' && !sgLoaded) { sgLoaded = true; loadSpecialGacha(); }
}

const SG_EFFECT_LABELS = {
  ally_small: '攻撃UP小', ally_large: '攻撃UP大',
  debuff_small: '防御DOWN小', debuff_large: '防御DOWN大',
  enemybuff_small: '防御UP小', enemybuff_large: '防御UP大',
  critup_small: 'CRT率UP小', critup_large: 'CRT率UP大',
};

function renderSgEffects(progress) {
  const row = document.getElementById('sg-effects-row');
  row.innerHTML = Object.keys(SG_EFFECT_LABELS)
    .filter(k => progress[k] > 0)
    .map(k => {
      const cls = k.startsWith('enemybuff') ? 'unfav' : 'fav';
      return `<span class="sg-eff-badge ${cls}">${SG_EFFECT_LABELS[k]}<span style="opacity:.75">残り${progress[k]}</span></span>`;
    }).join('');
}

function renderSgDestructionRate(rate) {
  document.getElementById('sg-destruction-rate').textContent = `${Number(rate).toFixed(1)}/999.0%`;
}

function renderSgHp(hp, maxHp) {
  document.getElementById('sg-hp-bar').style.width = Math.max(0, hp / maxHp * 100) + '%';
}

async function loadSpecialGacha() {
  try {
    const data = await apiFetch('/special-gacha/current');
    if (!data.enemy) {
      document.getElementById('sg-boss-name').textContent = '現在挑戦できる敵はいません';
      document.getElementById('sg-pull-btn').disabled = true;
      return;
    }
    sgCurrentEnemy = data.enemy;
    document.getElementById('sg-boss-name').textContent = data.enemy.name;
    document.getElementById('sg-boss-portrait').src = data.enemy.image_url;
    document.getElementById('sg-reward-icon').src = data.enemy.ssr_icon_image_url;
    document.getElementById('sg-reward-name').textContent = data.enemy.ssr_icon_name;
    renderSgHp(data.progress.current_hp, data.enemy.max_hp);
    renderSgDestructionRate(data.progress.destruction_rate);
    renderSgEffects(data.progress);
    updatePointsDisplay(data.points);
    currentPoints = data.points;
    document.getElementById('sg-pull-btn').disabled = !!data.progress.defeated_at;
    if (data.progress.defeated_at) {
      document.getElementById('sg-battle-log').textContent = 'この敵は既に討伐済みです';
    }
  } catch (err) {
    document.getElementById('sg-boss-name').textContent = '読み込みに失敗しました';
  }
}

// カードの中身を文字ではなく絵(アイコン)で表現する。key: サーバーから返る効果キー
const SG_ICON_MAP = {
  ally_small: ['sword', 'up1'], ally_large: ['sword', 'up2'],
  debuff_small: ['shield', 'down1'], debuff_large: ['shield', 'down2'],
  enemybuff_small: ['shield', 'up1'], enemybuff_large: ['shield', 'up2'],
  critup_small: ['star', null], critup_large: ['star3', null],
  heal_small: ['heart', null], heal_large: ['heart2', null],
};

// 手描きの線画アイコン(SVG)。currentColorでカテゴリ色を継承する。
const SG_SVG_BASE = {
  sword: '<path d="M12 2 L14.2 4.2 L14.2 15 L12 17.2 L9.8 15 L9.8 4.2 Z"/><rect x="6.5" y="14.2" width="11" height="2" rx="0.5"/><rect x="11" y="16.5" width="2" height="5.5" rx="0.6"/><circle cx="12" cy="22.3" r="1.4"/>',
  shield: '<path d="M12 2 L19.5 5 V11 C19.5 16 16 19.8 12 21.5 C8 19.8 4.5 16 4.5 11 V5 Z"/>',
  star: '<path d="M12 1.5 L14 9.5 L22 12 L14 14.5 L12 22.5 L10 14.5 L2 12 L10 9.5 Z"/>',
  star3: '<g transform="translate(7,7)"><path d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z"/></g><g transform="translate(17,7)"><path d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z"/></g><g transform="translate(12,17)"><path d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z"/></g>',
  heart: '<path d="M12 20.5 C12 20.5 4.5 14.8 4.5 9.3 C4.5 6.3 6.8 4.3 9.3 4.3 C10.7 4.3 11.6 5 12 5.8 C12.4 5 13.3 4.3 14.7 4.3 C17.2 4.3 19.5 6.3 19.5 9.3 C19.5 14.8 12 20.5 12 20.5 Z"/>',
  heart2: '<g transform="translate(-3,1) scale(0.72)"><path d="M12 20.5 C12 20.5 4.5 14.8 4.5 9.3 C4.5 6.3 6.8 4.3 9.3 4.3 C10.7 4.3 11.6 5 12 5.8 C12.4 5 13.3 4.3 14.7 4.3 C17.2 4.3 19.5 6.3 19.5 9.3 C19.5 14.8 12 20.5 12 20.5 Z"/></g><g transform="translate(6,4) scale(0.72)"><path d="M12 20.5 C12 20.5 4.5 14.8 4.5 9.3 C4.5 6.3 6.8 4.3 9.3 4.3 C10.7 4.3 11.6 5 12 5.8 C12.4 5 13.3 4.3 14.7 4.3 C17.2 4.3 19.5 6.3 19.5 9.3 C19.5 14.8 12 20.5 12 20.5 Z"/></g>',
  burst: '<path d="M12 1 L14.9 8 L22.5 8.6 L16.8 13.6 L18.5 20.9 L12 17 L5.5 20.9 L7.2 13.6 L1.5 8.6 L9.1 8 Z"/>',
};
const SG_SVG_BADGE = {
  up1: '<path d="M4 15 L12 7 L20 15" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  up2: '<path d="M4 12 L12 5 L20 12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20 L12 13 L20 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  down1: '<path d="M4 9 L12 17 L20 9" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  down2: '<path d="M4 4 L12 11 L20 4" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12 L12 19 L20 12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
};

function sgSvg(name) {
  return `<svg viewBox="0 0 24 24" fill="currentColor" class="sg-svg-icon">${SG_SVG_BASE[name]}</svg>`;
}
function sgBadgeSvg(name) {
  return `<svg viewBox="0 0 24 24" class="sg-svg-badge">${SG_SVG_BADGE[name]}</svg>`;
}

function sgCardVisual(r) {
  if (r.category === 'damage') {
    return { icon: sgSvg('sword'), val: (r.dmg >= 0 ? '-' : '+') + Math.abs(r.dmg) };
  }
  const label = r.label.replace(/[()]/g, '');
  if (r.category === 'destruction') {
    return { icon: sgSvg('burst'), val: `破壊率<br>+${r.amount}%` };
  }
  const [base, badge] = SG_ICON_MAP[r.key] || ['star', null];
  const iconHtml = sgSvg(base) + (badge ? sgBadgeSvg(badge) : '');
  return { icon: `<span class="sg-icon-stack">${iconHtml}</span>`, val: label };
}

// 通常ガチャのanimatePull()と同じ演出(カード出現→タップでスキップ→めくり音→フリップ)を流用し、
// レアリティ判定・フェイクアウト・SS/S演出だけを省いたもの。
async function animateSpecialPull(results) {
  const stage = document.getElementById('sg-stage');
  stage.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'gacha-cards';
  stage.appendChild(wrap);

  const cardEls = [];
  results.forEach((r, i) => {
    const isBigDamage = r.category === 'damage' && r.key === 'ultra';
    const isLargeEffect = (r.key && r.key.endsWith('_large')) || r.key === 'destruction_100';
    const cls = `cat-${r.category}` + ((isBigDamage || isLargeEffect) ? ' sg-glow' : '');
    const { icon, val } = sgCardVisual(r);
    const card = document.createElement('div');
    card.className = 'g-card';
    card.innerHTML = `
      <div class="g-card-inner" id="sg-gc-${i}">
        <div class="g-card-front"><img src="/img/logo.png" alt="" style="width:70%;height:70%;object-fit:contain;opacity:0.7"></div>
        <div class="g-card-back sg-card-back ${cls}">
          <div class="sg-card-icon">${icon}</div>
          ${val ? `<div class="sg-card-val">${val}</div>` : ''}
        </div>
      </div>`;
    wrap.appendChild(card);
    cardEls.push(card);
  });

  // フェーズ1: カードを1枚ずつ表示（タップで即時全表示）
  await new Promise(resolve => {
    let idx = 0;
    let timer = null;
    let done = false;

    const showAll = () => {
      if (done) return;
      done = true;
      if (timer) clearTimeout(timer);
      cardEls.forEach(c => c.classList.add('card-visible'));
      stage.style.cursor = '';
      stage.removeEventListener('click', onTap);
      setTimeout(resolve, 1000);
    };
    const showNext = () => {
      if (done) return;
      _sePlay('/sounds/putcard.mp3');
      cardEls[idx].classList.add('card-visible');
      idx++;
      if (idx >= results.length) {
        done = true;
        stage.style.cursor = '';
        stage.removeEventListener('click', onTap);
        setTimeout(resolve, 1000);
      } else {
        timer = setTimeout(showNext, 220);
      }
    };
    const onTap = () => showAll();
    stage.style.cursor = 'pointer';
    stage.addEventListener('click', onTap);
    timer = setTimeout(showNext, 80);
  });

  // フェーズ2: 1枚ずつめくる（タップでスキップ＝間隔短縮）
  let skipFlip = false;
  const onSkipTap = () => { skipFlip = true; stage.removeEventListener('click', onSkipTap); stage.style.cursor = ''; };
  stage.style.cursor = 'pointer';
  stage.addEventListener('click', onSkipTap);

  const stagger = results.length === 1 ? 0 : 500;
  for (let i = 0; i < results.length; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, skipFlip ? 30 : stagger));
    _sePlay('/sounds/turn.mp3');
    await new Promise(r => setTimeout(r, 100));
    document.getElementById(`sg-gc-${i}`).classList.add('flipped');
    renderSgHp(results[i].hp_after, sgCurrentEnemy.max_hp);
    if (results[i].state_after) {
      renderSgEffects(results[i].state_after);
      renderSgDestructionRate(results[i].state_after.destruction_rate);
    }
  }

  stage.removeEventListener('click', onSkipTap);
  stage.style.cursor = '';
  await new Promise(r => setTimeout(r, 700));
}

async function doSpecialPull() {
  const btn = document.getElementById('sg-pull-btn');
  btn.disabled = true;
  try {
    const data = await apiFetch('/special-gacha/pull', { method: 'POST' });
    await animateSpecialPull(data.results);

    const totalDmg = data.results.reduce((s, r) => s + (r.dmg > 0 ? r.dmg : 0), 0);
    document.getElementById('sg-battle-log').innerHTML = `今回の10連で <b>${totalDmg}</b> ダメージ`;

    renderSgHp(data.progress.current_hp, sgCurrentEnemy.max_hp);
    renderSgDestructionRate(data.progress.destruction_rate);
    renderSgEffects(data.progress);
    currentPoints = data.new_points;
    updatePointsDisplay(currentPoints);

    {
      btn.disabled = !!data.progress.defeated_at;
      if (data.defeated) {
        document.getElementById('sg-ssr-icon-img').src = data.awarded_icon.image_url;
        document.getElementById('sg-ssr-name').textContent = `限定アイコン「${data.awarded_icon.name}」を獲得！`;
        document.getElementById('sg-defeat-overlay').classList.add('show');
      }
    }
  } catch (err) {
    showAlert('#alert', err.message);
    btn.disabled = false;
  }
}

let _lastPoolModalPoolId = null;
async function openPoolModal() {
  const modal = document.getElementById('pool-modal');
  if (modal.style.display !== 'flex') lockBodyScroll();
  modal.style.display = 'flex';
  if (_lastPoolModalPoolId === selectedPoolId) return;
  _lastPoolModalPoolId = selectedPoolId;
  document.getElementById('pool-list').innerHTML = `<div class="loading"><div class="spinner"></div>${t('loading')}</div>`;
  try {
    const icons = selectedPoolId
      ? await apiFetch(`/gacha/pools/${selectedPoolId}/icons`)
      : await apiFetch('/gacha/icons');
    const order = ['SS', 'S', 'A'];
    const grouped = {};
    order.forEach(r => grouped[r] = []);
    icons.forEach(ic => { if (grouped[ic.rarity]) grouped[ic.rarity].push(ic); });
    // ピックアップを各レアリティ内の先頭へ
    order.forEach(r => grouped[r].sort((a, b) => (b.is_pickup ? 1 : 0) - (a.is_pickup ? 1 : 0)));
    const rarityColors = { SS: '#ffd700', S: '#e0c060', A: '#4fc3f7' };
    document.getElementById('pool-list').innerHTML = order.map(r => {
      if (!grouped[r].length) return '';
      const pickupCount = grouped[r].filter(ic => ic.is_pickup).length;
      return `
        <div style="margin-bottom:18px">
          <div style="font-size:0.82rem;font-weight:bold;color:${rarityColors[r]};margin-bottom:8px">${r}${getLang()==='zh'?'稀':'レア'}（${grouped[r].length}${getLang()==='zh'?'種':'種'}）${pickupCount > 0 ? `<span style="font-size:0.72rem;color:#ffd700;margin-left:8px">★PickUp ${pickupCount}${getLang()==='zh'?'枚':'枚'}</span>` : ''}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px">
            ${grouped[r].map(ic => `
              <div style="text-align:center;position:relative">
                ${ic.is_pickup ? `<span style="position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:0.6rem;font-weight:bold;color:#ffd700;background:rgba(0,0,0,0.6);border-radius:3px;padding:0 3px;white-space:nowrap;z-index:1">★PU</span>` : ''}
                <img src="${escHtml(thumbUrl(ic.image_url))}" alt="${escHtml(ic.name)}" loading="lazy"
                     style="width:54px;height:54px;border-radius:20%;object-fit:cover;border:2px solid ${ic.is_pickup ? '#ffd700' : rarityColors[r]};display:block;margin:0 auto 4px;${ic.is_pickup ? 'box-shadow:0 0 6px #ffd700aa' : ''}">
                <div style="font-size:0.62rem;color:var(--text-secondary);word-break:break-all;line-height:1.2">${escHtml(ic.name)}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    document.getElementById('pool-list').innerHTML = `<div style="color:var(--danger)">${escHtml(err.message)}</div>`;
  }
}
function closePoolModal() {
  const modal = document.getElementById('pool-modal');
  if (modal.style.display !== 'none') unlockBodyScroll();
  modal.style.display = 'none';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePoolModal(); });
</script>
