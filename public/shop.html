<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ヘブバンランクボード">
<title>ショップ - HBR</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 所持ポイント（ガチャと同じ、右上に固定する丸い表示） */
.shop-wallet {
  position: fixed; top: 66px; right: max(16px, calc((100vw - 1100px) / 2 + 24px)); z-index: 90;
  display: flex; align-items: baseline; gap: 5px; padding: 6px 14px; border-radius: 99px;
  background: rgba(18,16,34,0.78); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--border-light); box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  font-size: 0.9rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
.shop-wallet[hidden] { display: none; }
.shop-wallet-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em; color: var(--text-secondary); }
#my-points { color: #ff6b80; }

.shop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; }
@media (max-width: 400px) { .shop-list { grid-template-columns: 1fr; } }
/* 商品1つ分の箱：左に名前と説明、右に値段と購入ボタン */
.shop-item {
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  padding: 10px 12px;
  background: var(--bg-card2);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.shop-item:hover { border-color: var(--border-light); }
.shop-item.owned { background: rgba(255,255,255,0.025); }
.shop-item.equipped { border-color: rgba(255,107,128,0.65); background: linear-gradient(90deg, rgba(255,77,101,0.16), rgba(160,48,112,0.06)); box-shadow: 0 0 12px -2px rgba(255,77,101,0.5); }
.si-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.si-main { flex: 1; min-width: 0; }
.si-name { font-size: 0.92rem; font-weight: bold; color: var(--text-primary); line-height: 1.35; overflow-wrap: anywhere; }
.shop-item.owned .si-name { color: var(--text-secondary); }
.si-desc { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4; overflow-wrap: anywhere; }
.si-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.si-price { display: inline-flex; align-items: center; gap: 4px; font-size: 0.86rem; font-weight: bold; color: #ffd24a; font-variant-numeric: tabular-nums; white-space: nowrap; }
.si-price svg { width: 14px; height: 14px; flex-shrink: 0; }
.si-price small { font-size: 0.7rem; font-weight: normal; color: var(--text-muted); }
.si-btn {
  padding: 5px 14px; font-size: 0.76rem; font-weight: bold; white-space: nowrap;
  border-radius: 99px; border: none; background: var(--accent-grad); color: #fff; cursor: pointer;
  box-shadow: 0 0 10px rgba(255,77,101,0.35), inset 0 1px 0 rgba(255,255,255,0.3); transition: filter 0.15s, transform 0.15s;
}
.si-btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
.si-btn:disabled { box-shadow: none; border: 1px solid var(--border-light); background: transparent; border-color: var(--border-light); color: var(--text-muted); cursor: default; filter: none; }
.si-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: bold; color: var(--text-muted); white-space: nowrap; }
.si-state svg { width: 13px; height: 13px; }
.shop-item.equipped .si-state { color: #ffb3bf; }
.si-login { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
/* フレーム：見本の下に名前・条件・値段 */
.shop-item.frame-item .frame-sample { margin: 8px 4px 4px; }
.si-name-1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.si-conds { display: flex; flex-direction: column; gap: 4px; padding: 7px 9px; border-radius: 7px; background: rgba(0,0,0,0.18); }
.si-cond { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; color: var(--text-secondary); min-width: 0; }
.si-cond-text { display: inline-flex; align-items: baseline; gap: 5px; flex: 1; min-width: 0; line-height: 1.45; }
.si-cond-text svg, .si-cond-dot { align-self: center; }
.si-cond-text svg { width: 11px; height: 11px; flex-shrink: 0; color: var(--accent); }
.si-cond-dot { width: 5px; height: 5px; margin: 0 3px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
.si-cond.met .si-cond-text { color: var(--text-primary); }
.si-action-row { justify-content: flex-end; }
.si-cond-label { flex: 1; font-size: 0.7rem; color: var(--text-muted); }
.si-cond-bar { flex: 1; min-width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); overflow: hidden; }
/* グラデーションはゲージの端から端まで。進んだぶんだけ見せる */
.si-cond-bar > i { display: block; width: 100%; height: 100%; background: var(--frame-line, var(--accent)); }
.si-cond-num { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); white-space: nowrap; }
.si-cond.met .si-cond-num { color: var(--text-primary); }
.si-cond-bar { max-width: 70px; flex: 0 0 70px; }
.si-attrs { display: flex; align-items: center; gap: 4px; padding-left: 16px; }
.si-attrs-label { font-size: 0.66rem; color: var(--text-muted); margin-right: auto; }
.si-attrs .attr-badge { width: 22px; height: 22px; font-size: 0.68rem; }
.si-attrs .attr-badge.off { opacity: 0.25; filter: grayscale(1); }
.si-reward { display:inline-flex; align-items:center; gap:4px; flex-shrink:0; font-size:0.74rem; font-weight:bold; color:#ffd24a; padding:2px 9px; border-radius:99px;
  background:rgba(255,210,74,0.1); border:1px solid rgba(255,210,74,0.35); white-space:nowrap; }
.si-reward svg { width:13px; height:13px; }
.si-guide { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 1px; margin-left: 16px; padding: 5px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); font-size: 0.68rem; color: var(--text-secondary); line-height: 1.5; }
.si-guide-type { color: var(--text-muted); }
.si-or { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 4px 8px; border-left: 2px solid rgba(255,255,255,0.12); }
.si-or.met { border-left-color: var(--accent); }
.si-or-sep { font-size: 0.62rem; font-weight: bold; letter-spacing: 0.12em; color: var(--text-muted); text-transform: uppercase; }

/* 装備タブの称号リスト（スリム表示） */
.title-row-list { display: flex; flex-direction: column; gap: 6px; }
.title-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 10px;
  background: var(--bg-card2);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-light);
  border-radius: 7px;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.title-row.equipped {
  border-color: rgba(255,107,128,0.65);
  border-left-color: #ff4d65;
  background: linear-gradient(90deg, rgba(255,77,101,0.18), rgba(160,48,112,0.06));
  box-shadow: 0 0 12px -2px rgba(255,77,101,0.5);
}
.title-row-name {
  font-size: 0.9rem; font-weight: bold; letter-spacing: 0.01em;
  flex: 1; min-width: 0; cursor: pointer;
}
.title-row-name-text {
  display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title-row.equipped .title-row-name { color: #ffd6dc; }
.title-row-btn {
  flex-shrink: 0; padding: 4px 12px; font-size: 0.76rem; font-weight: bold;
  border-radius: 20px; border: 1px solid var(--border-light);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  transition: all 0.15s;
}
.title-row-btn:hover { border-color: rgba(255,107,128,0.7); color: #fff; box-shadow: 0 0 8px rgba(255,77,101,0.3); }
/* 装備する：グラデ。外す（装備中の行）：控えめな枠（装備中は行全体の光で示す） */
.title-row-btn:not(.equipped) { border: none; background: var(--accent-grad); color: #fff; box-shadow: 0 0 8px rgba(255,77,101,0.3); }
.title-row-btn.equipped { background: transparent; border-color: rgba(255,255,255,0.3); color: var(--text-secondary); }

.tabs { margin-bottom: 20px; }
.tab-btn[hidden] { display: none; }
.shop-tab-content { display: none; }
.shop-tab-content.active { display: block; }
.section-label { font-size: 0.82rem; font-weight: bold; color: var(--text-muted); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.05em; }

/* アイコン（装備タブ）：上に装備中、下に小さいタイルの一覧 */
.ic-current { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 14px; border-radius: 12px;
  background: linear-gradient(160deg, rgba(255,77,101,0.14), rgba(160,48,112,0.04)); border: 1px solid rgba(255,107,128,0.45); }
.ic-cur-icon { width: 64px; height: 64px; flex-shrink: 0; }
.ic-cur-icon img { width: 100%; height: 100%; border-radius: 20%; object-fit: cover; display: block; }
.ic-cur-icon .ic-empty { width: 100%; height: 100%; border-radius: 20%; border: 1px dashed var(--border-light); background: var(--bg-card2); }
.ic-cur-body { flex: 0 1 200px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.ic-cur-label { font-size: 0.7rem; font-weight: bold; color: var(--accent-hover); letter-spacing: 0.05em; }
.ic-cur-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ic-cur-body .title-row-btn { margin-top: 2px; }
.ic-cur-sample { flex: 1 1 260px; min-width: 0; max-width: 360px; }
.ic-cur-sample .frame-sample { margin: 6px 0; }
.ic-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.ic-unit { display: flex; align-items: baseline; gap: 6px; font-size: 0.78rem; font-weight: bold; color: rgba(232,232,240,0.75); margin: 16px 0 8px; }
.ic-unit .ic-count { font-size: 0.7rem; font-weight: normal; color: var(--text-muted); }
.ic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.ic-grid.flat { margin-top: 14px; }
.ic-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; padding: 8px 4px 6px; border-radius: 10px;
  background: var(--bg-card2); border: 1px solid var(--border-light); color: var(--text-secondary); font: inherit; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.ic-tile:hover { border-color: rgba(255,107,128,0.55); }
.ic-tile img { width: 100%; max-width: 56px; aspect-ratio: 1; border-radius: 20%; object-fit: cover; display: block; }
.ic-tile .ic-tname { width: 100%; font-size: 0.66rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.ic-tile.equipped { background: linear-gradient(160deg, rgba(255,77,101,0.22), rgba(160,48,112,0.08)); border-color: rgba(255,107,128,0.8); box-shadow: 0 0 12px -2px rgba(255,77,101,0.55); color: #fff; }
.ic-tile .ic-check { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 6px rgba(255,77,101,0.6); }
@media (max-width: 640px) {
  .ic-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .ic-tile { padding: 6px 3px 5px; }
  .ic-cur-sample { flex-basis: 100%; max-width: none; }
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1 class="page-title" id="page-title" data-i18n="shop.title">ショップ</h1>
  <div id="alert"></div>

  <div class="shop-wallet" id="shop-wallet" hidden><span class="shop-wallet-label">PT</span><span id="my-points">---</span></div>

  <!-- ショップ（称号・推し称号・フレームのサブタブ） -->
  <div class="tab-content active" id="tab-shop">
    <div class="pill-tabs" id="shop-tabs" style="margin-bottom:16px">
      <button class="tab-btn active" onclick="switchShopTab('titles')" data-i18n="shop.tab_titles">称号</button>
      <button class="tab-btn" onclick="switchShopTab('oshi')" data-i18n="shop.tab_oshi">推し称号</button>
      <button class="tab-btn" id="shop-frames-tab" onclick="switchShopTab('frames')" data-i18n="shop.tab_frames">フレーム</button>
    </div>
    <div class="shop-tab-content active" id="shop-tab-titles">
      <div id="shop-titles"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
    <div class="shop-tab-content" id="shop-tab-oshi">
      <div id="shop-oshi-titles"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
    <div class="shop-tab-content" id="shop-tab-frames">
      <div id="shop-frames"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
  </div>

  <!-- 装備（所持称号＋フレーム＋アイコンのサブタブ） -->
  <div class="tab-content" id="tab-equip">
    <div class="pill-tabs" id="equip-tabs" style="margin-bottom:16px">
      <button class="tab-btn active" onclick="switchEquipTab('titles')" data-i18n="shop.tab_titles">称号</button>
      <button class="tab-btn" onclick="switchEquipTab('icons')" data-i18n="shop.tab_icons">アイコン</button>
      <button class="tab-btn" id="equip-frames-tab" onclick="switchEquipTab('frames')" data-i18n="shop.tab_frames">フレーム</button>
    </div>
    <div class="shop-tab-content active" id="equip-tab-titles">
      <div id="my-titles"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
    <div class="shop-tab-content" id="equip-tab-frames">
      <div id="my-frames"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
    <div class="shop-tab-content" id="equip-tab-icons">
      <div id="icon-current"></div>
      <div class="ic-toolbar">
        <div class="pill-tabs pill-sm" id="icon-sort">
          <button class="on" data-v="impl" onclick="setIconSort('impl')" data-i18n="shop.sort_unit">部隊順</button>
          <button data-v="acq" onclick="setIconSort('acq')" data-i18n="shop.sort_acq">入手順</button>
        </div>
        <button type="button" class="fl-btn" id="icon-filter-btn" onclick="openIconFilter()"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-i18n="shop.filter">絞り込み</span></button>
        <button type="button" class="fl-clear" id="icon-filter-clear" hidden onclick="resetIconFilter()"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg><span data-i18n="filter.reset">リセット</span></button>
      </div>
      <div class="fl-modal" id="icon-filter-modal" hidden onclick="if (event.target === this) closeIconFilter()">
        <div class="fl-box" role="dialog" aria-modal="true" aria-labelledby="icon-filter-title">
          <div class="fl-head">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span id="icon-filter-title" data-i18n="shop.filter">絞り込み</span>
            <button type="button" class="fl-x" onclick="closeIconFilter()" aria-label="閉じる"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="fl-body">
            <div class="fl-label" data-i18n="shop.filter_rarity">レア度</div>
            <div class="fl-chips" id="icon-filter-rarity"></div>
            <div class="fl-label" data-i18n="shop.filter_unit">部隊</div>
            <div class="fl-chips" style="--n:4" id="icon-filter-unit"></div>
          </div>
          <div class="fl-foot">
            <button type="button" class="btn btn-secondary" onclick="resetIconFilter()" data-i18n="filter.reset">リセット</button>
            <button type="button" class="btn btn-primary" id="icon-filter-show" onclick="closeIconFilter()"></button>
          </div>
        </div>
      </div>
      <div id="my-icons"><div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中...</span></div></div>
    </div>
  </div>

  <!-- 購入確認モーダル -->
  <div id="buy-confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--bg-modal);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--border-light);border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center">
      <div id="buy-modal-name" style="font-size:0.95rem;font-weight:bold;color:var(--text-primary);margin-bottom:4px"></div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:20px">
        <span id="buy-modal-cost" style="color:var(--accent);font-weight:bold"></span> <span data-i18n="shop.buy_confirm">で購入しますか？</span>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="closeBuyModal()" data-i18n="cancel">キャンセル</button>
        <button class="btn btn-primary" style="flex:1" onclick="confirmBuy()" data-i18n="shop.buy">購入する</button>
      </div>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
renderNav();
applyI18n();

const user = getUser();
let myData = null;


function switchTab(name) {
  ['shop','equip'].forEach(n => {
    document.getElementById('tab-' + n).classList.toggle('active', n === name);
  });
  document.getElementById('page-title').textContent = name === 'equip' ? t('shop.equip_title') : t('shop.title');
}

function switchEquipTab(name) {
  document.querySelectorAll('#equip-tabs .tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['titles','icons','frames'][i] === name);
  });
  ['titles','frames','icons'].forEach(n => {
    document.getElementById('equip-tab-' + n).classList.toggle('active', n === name);
  });
}

function switchShopTab(name) {
  document.querySelectorAll('#shop-tabs .tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['titles','oshi','frames'][i] === name);
  });
  document.querySelectorAll('.shop-tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('shop-tab-' + name).classList.add('active');
}

async function load() {
  try {
    const [titles, oshiTitles, frames] = await Promise.all([
      apiFetch('/shop/titles'),
      apiFetch('/shop/titles?tag=oshi'),
      apiFetch('/shop/frames'),
    ]);
    if (user) {
      document.getElementById('shop-wallet').hidden = false;
      myData = await apiFetch('/shop/my');
      document.getElementById('my-points').textContent = Number(myData.points).toLocaleString('ja-JP');
      renderMyTitles();
      renderMyFrames();
      myIconData = null;
      await renderMyIcons();
    }
    renderShopTitles(titles);
    renderShopOshiTitles(oshiTitles);
    renderShopFrames(frames);
  } catch (err) {
    showAlert('#alert', err.message);
  }
}

async function refreshMyData() {
  myData = await apiFetch('/shop/my');
  document.getElementById('my-points').textContent = Number(myData.points).toLocaleString('ja-JP');
}

// ===== 称号 =====
function _titleScopeFor(scope) {
  // 外部枠に装備可能か（external/common）
  return scope !== 'internal';
}
function _titleScopeForInternal(scope) {
  // 内部枠に装備可能か（internal/common）
  return scope !== 'external';
}

// 商品の箱（称号・推し称号・フレームで共通）
const SI_COIN = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#ffd24a" stroke="#b8860b" stroke-width="1"/><circle cx="8" cy="8" r="4" fill="none" stroke="#b8860b" stroke-width="0.9" opacity="0.7"/></svg>';
const SI_CROWN = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
const SI_CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// 値段（所持・装備中のものには出さない）
function shopItemPrice({ cost, owned, equippedLabel }) {
  return owned || equippedLabel ? '' : `<span class="si-price">${SI_COIN}${cost.toLocaleString()}<small>pt</small></span>`;
}

// 購入ボタン（または所持済み・装備中）。lockedText があれば押せないボタンにする
function shopItemAction({ kind, id, name, cost, owned, equippedLabel, lockedText }) {
  if (equippedLabel) return `<span class="si-state">${SI_CHECK}${escHtml(equippedLabel)}</span>`;
  if (owned) return `<span class="si-state">${SI_CHECK}${t('shop.owned')}</span>`;
  if (!user) return `<span class="si-login">${t('shop.login_to_buy')}</span>`;
  if (lockedText) return `<button class="si-btn" disabled>${escHtml(lockedText)}</button>`;
  if (myData && myData.points < cost) return `<button class="si-btn" disabled>${t('shop.not_enough')}</button>`;
  return `<button class="si-btn" onclick="askBuy('${kind}',${id},'${escHtml(name).replace(/'/g, "\\'")}',${cost})">${t('shop.buy')}</button>`;
}

function titleItemHtml(ti) {
  const owned = !!myData?.titles.some(mt => mt.id === ti.id);
  const equippedExt = myData?.equipped_title_id === ti.id;
  const equippedInt = myData?.equipped_internal_title_id === ti.id;
  const equippedLabel = equippedInt && equippedExt ? '内部・外部装備中' : equippedInt ? '内部装備中' : equippedExt ? t('shop.equipped_badge') : '';
  return `
    <div class="shop-item ${equippedLabel ? 'equipped' : owned ? 'owned' : ''}">
      <div class="si-row">
        <div class="si-main">
          <div class="si-name">「${escHtml(ti.name)}」</div>
          ${ti.description ? `<div class="si-desc">${escHtml(ti.description)}</div>` : ''}
        </div>
        <div class="si-side">${shopItemPrice({ cost: ti.point_cost, owned, equippedLabel })}${shopItemAction({ kind: 'title', id: ti.id, name: ti.name, cost: ti.point_cost, owned, equippedLabel })}</div>
      </div>
    </div>`;
}

function renderTitleList(elId, titles) {
  const el = document.getElementById(elId);
  // 外部ユーザーは internal 称号を非表示
  const visible = (user && isInternal() ? (titles || []) : (titles || []).filter(ti => (ti.scope || 'common') !== 'internal'))
    .filter(ti => !myData?.titles?.some(mt => mt.id === ti.id)); // 持っているものは出さない
  if (!visible.length) {
    el.innerHTML = `<div class="empty-state"><p>${t('shop.no_titles')}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="shop-list">${visible.map(titleItemHtml).join('')}</div>`;
}

function renderShopTitles(titles) { renderTitleList('shop-titles', titles); }
function renderShopOshiTitles(titles) { renderTitleList('shop-oshi-titles', titles); }

function _renderTitleSlot(titles, equippedId, equipFn, unequipFn, emptyMsg) {
  if (!titles.length) return `<div class="empty-state" style="padding:12px 0"><p style="font-size:0.85rem">${emptyMsg}</p></div>`;
  return `<div class="title-row-list">${titles.map(ti => {
    const equipped = equippedId === ti.id;
    return `
      <div class="title-row ${equipped ? 'equipped' : ''}">
        <span class="title-row-name title-tooltip-wrap">
          <span class="title-row-name-text">${escHtml(ti.name)}</span>
          ${ti.description ? `<span class="title-tooltip">${escHtml(ti.description)}</span>` : ''}
        </span>
        ${equipped
          ? `<button class="title-row-btn equipped" onclick="${unequipFn}">${t('shop.unequip')}</button>`
          : `<button class="title-row-btn" onclick="${equipFn}(${ti.id})">${t('shop.equip_short')}</button>`
        }
      </div>`;
  }).join('')}</div>`;
}

function renderMyTitles() {
  const el = document.getElementById('my-titles');
  if (!myData?.titles?.length) {
    el.innerHTML = `<div class="empty-state"><p>${t('shop.no_my_titles')}</p></div>`;
    return;
  }
  if (isInternal()) {
    // 内部ユーザー：2つの装備枠
    const intTitles = myData.titles.filter(ti => _titleScopeForInternal(ti.scope || 'common'));
    const extTitles = myData.titles.filter(ti => _titleScopeFor(ti.scope || 'common'));
    el.innerHTML = `
      <div style="margin-bottom:20px">
        <div style="font-size:0.82rem;font-weight:bold;color:rgba(232,232,240,0.75);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">内部用装備枠（内部ランキングに表示）</div>
        ${_renderTitleSlot(intTitles, myData.equipped_internal_title_id, 'equipTitleInternal', 'equipTitleInternal(null)', '装備できる称号がありません')}
      </div>
      <div>
        <div style="font-size:0.82rem;font-weight:bold;color:rgba(232,232,240,0.75);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">外部用装備枠（外部ランキングに表示）</div>
        ${_renderTitleSlot(extTitles, myData.equipped_title_id, 'equipTitle', 'equipTitle(null)', '装備できる称号がありません')}
      </div>`;
  } else {
    // 外部ユーザー：1つの装備枠（external/common のみ）
    const extTitles = myData.titles.filter(ti => _titleScopeFor(ti.scope || 'common'));
    el.innerHTML = _renderTitleSlot(extTitles, myData.equipped_title_id, 'equipTitle', 'equipTitle(null)', t('shop.no_my_titles'));
  }
}

let _pendingBuy = null;

function askBuy(kind, id, name, cost) {
  _pendingBuy = { kind, id };
  document.getElementById('buy-modal-name').textContent = name;
  document.getElementById('buy-modal-cost').textContent = `${cost}pt`;
  const modal = document.getElementById('buy-confirm-modal');
  if (modal.style.display !== 'flex') lockBodyScroll();
  modal.style.display = 'flex';
}

function closeBuyModal() {
  const modal = document.getElementById('buy-confirm-modal');
  if (modal.style.display !== 'none') unlockBodyScroll();
  modal.style.display = 'none';
  _pendingBuy = null;
}

function confirmBuy() {
  if (!_pendingBuy) return;
  const { kind, id } = _pendingBuy;
  closeBuyModal();
  if (kind === 'title') buyTitle(id);
  if (kind === 'frame') buyFrame(id);
}

  try {
    const res = await apiFetch(`/shop/buy/${id}`, { method: 'POST' });

// ===== フレーム =====
// 買えるようになる条件の文（utils/frames.js の cond）
function frameCondText(c) {
  if (!c) return '';
  const attr = a => t('attr.' + a) || a;
  if (c.type === 'rank' && c.attr) return c.rank === 1 ? t('shop.frame_cond_rank_attr1', attr(c.attr), c.count) : t('shop.frame_cond_rank_attr', attr(c.attr), c.rank, c.count);
  if (c.type === 'rank') return c.rank === 1 ? t('shop.frame_cond_rank1', c.count) : t('shop.frame_cond_rank', c.rank, c.count);
  if (c.type === 'attr_rank') return c.rank === 1 ? t('shop.frame_cond_attr1', attr(c.attr), c.count) : t('shop.frame_cond_attr', attr(c.attr), c.rank, c.count);
  if (c.type === 'attr_kinds') return t('shop.frame_cond_kinds', c.kinds, c.rank);
  if (c.type === 'joined') return t('shop.frame_cond_joined', c.count);
  if (c.type === 'all_attrs') return t('shop.frame_cond_all_attrs');
  return '';
}

const frameSample = cls => frameSampleHtml(cls, user?.username, user?.icon_url ? thumbUrl(user.icon_url) : null);

function renderShopFrames(frames) {
  const el = document.getElementById('shop-frames');
  frames = (frames || []).filter(f => !myData?.frames?.some(mf => mf.id === f.id)); // 持っているものは出さない
  if (!frames || frames.length === 0) {
    el.innerHTML = `<div class="empty-state"><p>${t('shop.no_frames')}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="shop-list">${frames.map(f => {
    const owned = !!myData?.frames?.some(mf => mf.id === f.id);
    const equipped = myData?.equipped_frame_id === f.id;
    const p = f.progress;
    // シーズン1位の報酬：シーズン中は買えない（値段の代わりに「シーズン1位の報酬」）。締めたあと1位の人には通常どおり値段と購入ボタン
    if (f.season_reward && !f.season_reward.done) {
      return `
      <div class="shop-item frame-item ${f.css_class}">
        ${frameSample(f.css_class)}
        <div class="si-row">
          <div class="si-main"><div class="si-name si-name-1">${escHtml(f.name)}</div></div>
          ${shopItemPrice({ cost: f.point_cost })}
        </div>
        <div class="si-conds"><div class="si-cond"><span class="si-cond-text"><span class="si-cond-dot"></span>${escHtml(t('shop.season_reward_cond', f.season_reward.name))}</span></div></div>
        <div class="si-row si-action-row"><span class="si-cond-label">${t('shop.season_reward_note')}</span><button class="si-btn" disabled>${t('shop.frame_locked')}</button></div>
      </div>`;
    }
    const item = { kind: 'frame', id: f.id, name: f.name, cost: f.point_cost, owned, equippedLabel: equipped ? t('shop.equipped_badge') : '', lockedText: p && !p.met && !f.free ? t('shop.frame_locked') : '' };
    // 名前と値段の行、条件ごとの行（進み具合）、購入ボタンの行
    // 条件1つ分の行（チェックか点・条件の文・進み具合）
    const condLine = (c, pp) => `
        <div class="si-cond ${pp?.met ? 'met' : ''}">
          <span class="si-cond-text">${pp?.met ? SI_CHECK : '<span class="si-cond-dot"></span>'}${escHtml(frameCondText(c))}</span>
          ${pp ? `<span class="si-cond-bar"><i style="clip-path:inset(0 ${100 - Math.round(pp.now / pp.need * 100)}% 0 0)"></i></span><span class="si-cond-num">${pp.now}/${pp.need}</span>` : ''}
        </div>`;
    // 6属性の条件：条件の文、いちばん届いた回の属性（届いたものだけ色付き）、スコアの例
    const allAttrsBlock = (c, pp) => `
        <div class="si-cond ${pp?.met ? 'met' : ''}">
          <span class="si-cond-text">${pp?.met ? SI_CHECK : '<span class="si-cond-dot"></span>'}${escHtml(frameCondText(c))}</span>
        </div>
        <div class="si-guide">${Object.entries(c.pct).map(([type, r]) => `<span class="si-guide-type">${escHtml(t('etype.' + type))}</span><span>${escHtml(t('shop.frame_cond_all_attrs_row', +(r * 100).toFixed(1)))}</span>`).join('')}</div>
        ${pp ? `<div class="si-attrs"><span class="si-attrs-label">${t('shop.frame_cond_all_attrs_best')}</span>${ATTRIBUTES.map(a => `<span class="attr-badge small attr-${a} ${pp.attrs?.includes(a) ? '' : 'off'}">${escHtml(t('attr.' + a) || a)}</span>`).join('')}<span class="si-cond-num">${pp.now}/${pp.need}</span></div>` : ''}`;
    // 「または」の条件は1つずつの行にして、間に or を挟む
    const conds = !owned && f.conds?.length ? `<div class="si-conds">${f.conds.map((c, i) => {
      const pp = p?.parts?.[i];
      if (c.type === 'all_attrs') return allAttrsBlock(c, pp);
      if (c.type !== 'any') return condLine(c, pp);
      return `<div class="si-or ${pp?.met ? 'met' : ''}">${c.of.map((x, j) => condLine(x, pp?.of?.[j])).join(`<div class="si-or-sep"><span>${t('shop.frame_cond_or')}</span></div>`)}</div>`;
    }).join('')}</div>` : '';
    return `
      <div class="shop-item frame-item ${f.css_class} ${equipped ? 'equipped' : owned ? 'owned' : ''}">
        ${frameSample(f.css_class)}
        <div class="si-row">
          <div class="si-main">
            <div class="si-name si-name-1">${escHtml(f.name)}</div>
            ${f.description ? `<div class="si-desc">${escHtml(f.description)}</div>` : ''}
          </div>
          ${shopItemPrice(item)}
        </div>
        ${conds}
        ${f.season_reward ? `<div class="si-conds"><div class="si-cond met"><span class="si-cond-text">${SI_CHECK}${escHtml(t('shop.season_reward_won', f.season_reward.name))}</span></div></div>` : ''}
        <div class="si-row si-action-row">${conds ? `<span class="si-cond-label">${t('shop.frame_cond_all')}</span>` : ''}${shopItemAction(item)}</div>
      </div>`;
  }).join('')}</div>`;
}

function renderMyFrames() {
  const el = document.getElementById('my-frames');
  if (!myData?.frames?.length) {
    el.innerHTML = `<div class="empty-state"><p>${t('shop.no_my_frames')}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="shop-list">${myData.frames.map(f => {
    const equipped = myData.equipped_frame_id === f.id;
    return `
      <div class="shop-item frame-item ${equipped ? 'equipped' : ''}">
        ${frameSample(f.css_class)}
        <div class="si-row">
          <div class="si-main"><div class="si-name">${escHtml(f.name)}</div></div>
          ${equipped
            ? `<button class="title-row-btn equipped" onclick="equipFrame(null)">${t('shop.unequip')}</button>`
            : `<button class="title-row-btn" onclick="equipFrame(${f.id})">${t('shop.equip_short')}</button>`}
        </div>
      </div>`;
  }).join('')}</div>`;
}

async function buyFrame(id) {
  try {

// ===== アイコン =====
let myIconData = null;
let iconSort = 'impl';
const iconFilter = { rarity: new Set(), unit: new Set() };
const IC_CHECK = '<svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function setPillOn(id, v) {
  document.querySelectorAll(`#${id} > button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
function setIconSort(mode) { iconSort = mode; setPillOn('icon-sort', mode); renderMyIcons(); }

// 絞り込み（レア度・部隊、それぞれ複数選べる。何も選ばなければ全部）
const unitKey = ic => ic.unit || '';
const iconMatches = ic => (!iconFilter.rarity.size || iconFilter.rarity.has(ic.rarity)) && (!iconFilter.unit.size || iconFilter.unit.has(unitKey(ic)));
function renderIconFilterChips() {
  const icons = myIconData?.icons || [];
  const rar = ['SS', 'S', 'A'].filter(r => icons.some(ic => ic.rarity === r));
  const units = [...new Set(icons.map(unitKey))].sort((a, b) => unitOrder(a) - unitOrder(b));
  const chip = (kind, v, label) => `<button type="button" class="${iconFilter[kind].has(v) ? 'on' : ''}"${kind === 'rarity' ? ` data-c="${escHtml(v)}"` : ''} aria-pressed="${iconFilter[kind].has(v)}" onclick="toggleIconFilter('${kind}', '${escHtml(v)}')"><span>${escHtml(label)}</span></button>`;
  document.getElementById('icon-filter-rarity').innerHTML = rar.map(r => chip('rarity', r, r)).join('');
  document.getElementById('icon-filter-unit').innerHTML = units.map(u => chip('unit', u, u || t('shop.no_unit'))).join('');
  const n = iconFilter.rarity.size + iconFilter.unit.size;
  document.getElementById('icon-filter-clear').hidden = !n;
  document.getElementById('icon-filter-btn').classList.toggle('on', !!n);
  document.getElementById('icon-filter-show').textContent = t('filter.show', icons.filter(iconMatches).length);
}
function toggleIconFilter(kind, v) {
  const set = iconFilter[kind];
  set.has(v) ? set.delete(v) : set.add(v);
  renderMyIcons();
}
function resetIconFilter() { iconFilter.rarity.clear(); iconFilter.unit.clear(); renderMyIcons(); }
function openIconFilter() { renderIconFilterChips(); document.getElementById('icon-filter-modal').hidden = false; }
function closeIconFilter() { document.getElementById('icon-filter-modal').hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIconFilter(); });

const UNIT_ORDER = ['31A','31B','31C','31D','31E','31F','30G','31X'];
const rarityOrder = r => r === 'SS' ? 1 : r === 'S' ? 2 : 3;
const unitOrder = u => { const i = UNIT_ORDER.indexOf(u); return i < 0 ? UNIT_ORDER.length : i; };

function iconTileHtml(icon, equippedId) {
  const equipped = icon.id === equippedId;
  return `<button type="button" class="ic-tile${equipped ? ' equipped' : ''}" onclick="equipIcon(${icon.id})" title="${escHtml(icon.name)}">
    <img src="${escHtml(thumbUrl(icon.image_url))}" alt="" loading="lazy" class="icon-rarity-${escHtml(icon.rarity)}">
    <span class="ic-tname">${escHtml(icon.name)}</span>
    ${equipped ? `<span class="ic-check">${IC_CHECK}</span>` : ''}
  </button>`;
}

// 上の「装備中」：大きめのアイコン、外すボタン、ランキングでの見え方
function renderIconCurrent(icons, equippedId) {
  const cur = icons.find(ic => ic.id === equippedId);
  const frame = myData?.frames?.find(f => f.id === myData.equipped_frame_id);
  const sample = frameSampleHtml(frame ? frame.css_class : '', user?.username, cur ? thumbUrl(cur.image_url) : null);
  document.getElementById('icon-current').innerHTML = `<div class="ic-current">
    <div class="ic-cur-icon">${cur ? `<img src="${escHtml(thumbUrl(cur.image_url))}" alt="" class="icon-rarity-${escHtml(cur.rarity)}">` : '<div class="ic-empty"></div>'}</div>
    <div class="ic-cur-body">
      <div class="ic-cur-label">${t('shop.equipped_badge')}</div>
      <div class="ic-cur-name">${cur ? escHtml(cur.name) : t('shop.icon_none')}</div>
      ${cur ? `<button class="title-row-btn equipped" onclick="equipIcon(null)">${t('shop.unequip')}</button>` : ''}
    </div>
    <div class="ic-cur-sample">${sample}</div>
  </div>`;
}

async function renderMyIcons() {
  const el = document.getElementById('my-icons');
  try {
    if (!myIconData) myIconData = await apiFetch('/gacha/my');
    const icons = myIconData.icons || [];
    const equippedId = myIconData.equipped_icon_id ?? null;
    if (icons.length === 0) {
      document.getElementById('icon-current').innerHTML = '';
      el.innerHTML = `<div class="empty-state"><p>${t('shop.no_icons')}<br><a href="/gacha.html" style="color:var(--accent)">${t('shop.go_gacha')}</a></p></div>`;
      return;
    }
    renderIconCurrent(icons, equippedId);
    renderIconFilterChips();
    const list = icons.filter(iconMatches);
    if (!list.length) { el.innerHTML = `<div class="empty-state"><p>${t('shop.icon_filter_empty')}</p></div>`; return; }
    const byUnit = (a, b) => unitOrder(a.unit) - unitOrder(b.unit) || rarityOrder(a.rarity) - rarityOrder(b.rarity) || a.id - b.id;
    if (iconSort === 'impl') {
      const groups = new Map();
      for (const ic of [...list].sort(byUnit)) {
        const u = ic.unit || '';
        if (!groups.has(u)) groups.set(u, []);
        groups.get(u).push(ic);
      }
      el.innerHTML = [...groups].map(([u, g]) => `<div class="ic-unit">${escHtml(u || t('shop.no_unit'))}<span class="ic-count">${g.length}</span></div>
        <div class="ic-grid">${g.map(ic => iconTileHtml(ic, equippedId)).join('')}</div>`).join('');
    } else {
      const sorted = [...list].sort((a, b) => new Date(a.acquired_at) - new Date(b.acquired_at));
      el.innerHTML = `<div class="ic-grid flat">${sorted.map(ic => iconTileHtml(ic, equippedId)).join('')}</div>`;
    }
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

async function equipIcon(id) {
  try {
    const res = await apiFetch('/gacha/equip', { method: 'POST', body: JSON.stringify({ icon_id: id }) });
    showAlert('#alert', res.message, 'success');
    myIconData.equipped_icon_id = id ?? null;
    myIconData.icons.forEach(ic => { ic.is_equipped = ic.id === id; });
    renderMyIcons();
    const u = getUser();
    if (u) {
      const ic = myIconData.icons.find(x => x.id === id);
      u.equipped_icon_id = id;
      u.icon_url = ic ? ic.image_url : null;
      u.icon_rarity = ic ? ic.rarity : null;
      setAuth(getToken(), u);
      if (user) { user.icon_url = u.icon_url; user.icon_rarity = u.icon_rarity; }
      updateNavAvatar(u);
      renderMyFrames();
    }
  } catch (err) { showAlert('#alert', err.message); }
}

// 称号ツールチップ（タップ）
document.addEventListener('click', e => {
  const wrap = e.target.closest('.title-tooltip-wrap');
  document.querySelectorAll('.title-tooltip-wrap.tt-open').forEach(el => {
    if (el !== wrap) el.classList.remove('tt-open');
  });
  if (wrap && wrap.querySelector('.title-tooltip')) {
    wrap.classList.toggle('tt-open');
    e.stopPropagation();
  }
});

switchTab(getParam('tab') || 'shop');
load();
